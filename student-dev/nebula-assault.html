      }
      ctx.restore();
    }

    function drawBossLasers() {
      if (!boss || boss.introMode) return;
      const bx = boss.x + boss.width / 2;
      const by = boss.y + boss.height / 2;

      ctx.save();

      // VOID SANCTUARY: 안전 구역을 제외한 전장을 경고/발사 레이저로 표시
      if (bossSafeZonePattern) {
        const safe = bossSafeZonePattern;
        const warning = safe.timer < safe.warnDuration;
        const active = !warning;
        const pulse = 0.72 + Math.sin(performance.now() * 0.018) * 0.18;
        const leftW = Math.max(0, safe.safeX - safe.safeWidth / 2);
        const rightX = safe.safeX + safe.safeWidth / 2;
        const rightW = Math.max(0, canvas.width - rightX);

        ctx.save();
        if (warning) {
          // 경고 단계는 저비용 단색 레이어와 점선 경계만 사용한다.
          ctx.fillStyle = `rgba(255, 20, 70, ${0.20 + pulse * 0.12})`;
          ctx.fillRect(0, 0, leftW, canvas.height);
          ctx.fillRect(rightX, 0, rightW, canvas.height);
          ctx.strokeStyle = `rgba(255, 105, 145, ${pulse})`;
          ctx.lineWidth = 4;
          ctx.setLineDash([13, 9]);
          ctx.strokeRect(2, 2, Math.max(0, leftW - 4), canvas.height - 4);
          ctx.strokeRect(rightX + 2, 2, Math.max(0, rightW - 4), canvas.height - 4);
          ctx.setLineDash([]);
        } else {
          // 발사 단계: 고비용 shadowBlur/매 프레임 gradient 대신 선명한 레이어로 표현.
          const beamPulse = 0.82 + Math.sin(Math.floor(performance.now() / 55) * 0.22) * 0.12;
          // 전장 전체를 덮는 강한 발광 면. 단순 fillRect만 사용해 성능은 유지한다.
          ctx.fillStyle = `rgba(255, 12, 62, ${0.62 * beamPulse})`;
          ctx.fillRect(0, 0, leftW, canvas.height);
          ctx.fillRect(rightX, 0, rightW, canvas.height);

          // 짧은 펄스로 화면이 통째로 타오르는 느낌을 추가
          const impactPulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.045);
          ctx.fillStyle = `rgba(255, 210, 225, ${0.10 + impactPulse * 0.13})`;
          ctx.fillRect(0, 0, leftW, canvas.height);
          ctx.fillRect(rightX, 0, rightW, canvas.height);

          // 굵고 밝은 수직 에너지 기둥을 일정 간격으로 배치
          const stripeOffset = Math.floor(performance.now() / 24) % 64;
          for (let x = 12 - stripeOffset; x < leftW - 5; x += 64) {
            if (x >= 0) {
              ctx.fillStyle = "rgba(255, 245, 250, 0.42)";
              ctx.fillRect(x, 0, 9, canvas.height);
              ctx.fillStyle = "rgba(255, 255, 255, 0.72)";
              ctx.fillRect(x + 3, 0, 2, canvas.height);
            }
          }
          for (let x = rightX + 12 - stripeOffset; x < canvas.width - 5; x += 64) {
            if (x >= rightX) {
              ctx.fillStyle = "rgba(255, 245, 250, 0.42)";
              ctx.fillRect(x, 0, 9, canvas.height);
              ctx.fillStyle = "rgba(255, 255, 255, 0.72)";
              ctx.fillRect(x + 3, 0, 2, canvas.height);
            }
          }

          // 공격 개시 직후 전장을 덮는 짧고 강한 섬광
          const fireAge = safe.timer - safe.warnDuration;
          if (fireAge < 7) {
            const flashAlpha = (1 - fireAge / 7) * 0.72;
            ctx.fillStyle = `rgba(255,245,250,${flashAlpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }

          // 넓은 레이저 기둥이 공격 영역을 빠르게 훑는다.
          const sweep = (Math.floor(performance.now() / 18) * 11) % 140;
          for (let x = -140 + sweep; x < leftW; x += 140) {
            ctx.fillStyle = "rgba(255,235,245,0.30)";
            ctx.fillRect(x, 0, 34, canvas.height);
            ctx.fillStyle = "rgba(255,255,255,0.88)";
            ctx.fillRect(x + 13, 0, 7, canvas.height);
          }
          for (let x = rightX - 140 + sweep; x < canvas.width; x += 140) {
            const beamX = Math.max(rightX, x);
            if (beamX >= canvas.width) continue;
            ctx.fillStyle = "rgba(255,235,245,0.30)";
            ctx.fillRect(beamX, 0, Math.min(34, canvas.width - beamX), canvas.height);
            ctx.fillStyle = "rgba(255,255,255,0.88)";
            const coreX = Math.max(rightX, x + 13);
            if (coreX < canvas.width) ctx.fillRect(coreX, 0, Math.min(7, canvas.width - coreX), canvas.height);
          }

          // 화면을 가로지르는 충격파형 에너지 띠
          const bandY = (Math.floor(performance.now() / 13) * 19) % canvas.height;
          ctx.fillStyle = "rgba(255,245,250,0.48)";
          ctx.fillRect(0, bandY, leftW, 10);
          ctx.fillRect(rightX, bandY, rightW, 10);

          // 화면 상·하단의 충격 띠가 공격의 압도적인 범위를 강조
          ctx.fillStyle = `rgba(255, 235, 245, ${0.72 * beamPulse})`;
          ctx.fillRect(0, 0, canvas.width, 18);
          ctx.fillRect(0, canvas.height - 18, canvas.width, 18);

          // 안전 구역 경계의 두꺼운 백색 코어 라인
          ctx.fillStyle = "rgba(255,255,255,0.98)";
          ctx.fillRect(Math.max(0, leftW - 5), 0, 5, canvas.height);
          ctx.fillRect(rightX, 0, 5, canvas.height);
        }

        // 보호 구역은 공격 중에도 청록색 면과 이중 경계선으로 명확히 구분
        ctx.fillStyle = warning ? "rgba(65, 235, 255, 0.13)" : "rgba(65, 235, 255, 0.20)";
        ctx.fillRect(leftW, 0, safe.safeWidth, canvas.height);
        ctx.strokeStyle = "#75f4ff";
        ctx.lineWidth = 4;
        ctx.strokeRect(leftW + 2, 3, safe.safeWidth - 4, canvas.height - 6);
        ctx.strokeStyle = "rgba(255,255,255,0.85)";
        ctx.lineWidth = 1;
        ctx.strokeRect(leftW + 7, 8, safe.safeWidth - 14, canvas.height - 16);
        ctx.textAlign = "center";
        ctx.font = "900 17px Arial";
        ctx.fillStyle = "#eaffff";
        ctx.fillText(warning ? "안전 구역" : "성역", safe.safeX, canvas.height - 28);
        ctx.font = "900 13px Arial";
        ctx.fillStyle = warning ? "#ffd5e1" : "#ffffff";
        const fireLeft = Math.max(0, safe.warnDuration + safe.fireDuration - safe.timer);
        ctx.fillText(
          warning ? "⚠ 광역 레이저 공격 임박" : `공허 레이저 휩쓸기!  ${Math.ceil(fireLeft / 60)}초`,
          canvas.width / 2, 28
        );
        ctx.restore();
        ctx.restore();
      }

      for (const vl of bossVerticalLasers) {
        if (vl.timer < vl.warnDuration) {
          ctx.fillStyle = "rgba(255, 71, 87, 0.15)";
          ctx.fillRect(vl.x - vl.width / 2, 0, vl.width, canvas.height);

          ctx.beginPath();
          ctx.setLineDash([12, 12]);
          ctx.moveTo(vl.x, 0);
          ctx.lineTo(vl.x, canvas.height);
          ctx.strokeStyle = "rgba(255, 71, 87, 0.85)";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.setLineDash([]);
        } else {
          ctx.fillStyle = "rgba(255, 42, 109, 0.35)";
          ctx.fillRect(vl.x - vl.width / 2 - 6, 0, vl.width + 12, canvas.height);

          ctx.fillStyle = "#ffffff";
          ctx.fillRect(vl.x - vl.width / 4, 0, vl.width / 2, canvas.height);

          ctx.strokeStyle = "#ff2a6d";
          ctx.lineWidth = 3;
          ctx.strokeRect(vl.x - vl.width / 2, 0, vl.width, canvas.height);
        }
      }

      if (boss.targetLaser.active) {
        const targetEndX = bx + Math.cos(boss.targetLaser.angle) * 1500;
        const targetEndY = by + Math.sin(boss.targetLaser.angle) * 1500;

        const trackEnd = boss.targetLaser.trackDuration;
        const lockEnd = trackEnd + boss.targetLaser.lockDuration;

        if (boss.targetLaser.timer <= trackEnd) {
          ctx.beginPath();
          ctx.setLineDash([8, 8]);
          ctx.moveTo(bx, by);
          ctx.lineTo(targetEndX, targetEndY);
          ctx.strokeStyle = "rgba(255, 71, 87, 0.75)";
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.setLineDash([]);
        } 
        else if (boss.targetLaser.timer <= lockEnd) {
          const isFlash = Math.floor(boss.targetLaser.timer / 4) % 2 === 0;

          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(targetEndX, targetEndY);
          ctx.strokeStyle = isFlash ? "rgba(255, 159, 26, 0.95)" : "rgba(255, 71, 87, 0.35)";
          ctx.lineWidth = 5;
          ctx.stroke();

          ctx.save();
          ctx.fillStyle = "#ff4757";
          ctx.font = "bold 15px Arial";
          ctx.textAlign = "center";
          ctx.fillText("⚠️ 조준 중! 이동하라! ⚠️", player.x, player.y - 35);
          ctx.restore();
        } 
        else {
          const beamPhase = performance.now();
          const beamPulse = 0.88 + Math.sin(beamPhase * 0.018) * 0.12;
          const drift = (beamPhase * 0.32) % 34;
          const sideX = -Math.sin(boss.targetLaser.angle);
          const sideY = Math.cos(boss.targetLaser.angle);

          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.lineCap = "round";

          // Layered cyan bloom, bright core, and fine energy filaments give the shot more depth.
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(targetEndX, targetEndY);
          ctx.strokeStyle = `rgba(0, 205, 255, ${0.13 * beamPulse})`;
          ctx.lineWidth = 48;
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(targetEndX, targetEndY);
          ctx.strokeStyle = `rgba(0, 225, 255, ${0.34 * beamPulse})`;
          ctx.lineWidth = 25;
          ctx.stroke();

          // Slightly offset side streams create a turbulent edge around the main discharge.
          for (const offset of [-9, 9]) {
            ctx.beginPath();
            ctx.moveTo(bx + sideX * offset, by + sideY * offset);
            ctx.lineTo(targetEndX + sideX * offset, targetEndY + sideY * offset);
            ctx.setLineDash([17, 17]);
            ctx.lineDashOffset = -drift - offset;
            ctx.strokeStyle = `rgba(140, 250, 255, ${0.46 * beamPulse})`;
            ctx.lineWidth = 2.5;
            ctx.stroke();
          }
          ctx.setLineDash([]);

          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(targetEndX, targetEndY);
          ctx.strokeStyle = `rgba(75, 215, 255, ${0.88 * beamPulse})`;
          ctx.lineWidth = 11;
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(targetEndX, targetEndY);
          ctx.strokeStyle = `rgba(225, 255, 255, ${0.98 * beamPulse})`;
          ctx.lineWidth = 4.5;
          ctx.stroke();

          // Bright moving fragments travel along the beam instead of leaving it as a flat stripe.
          ctx.beginPath();
          ctx.setLineDash([7, 25]);
          ctx.lineDashOffset = -drift;
          ctx.moveTo(bx, by);
          ctx.lineTo(targetEndX, targetEndY);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.92)";
          ctx.lineWidth = 2.2;
          ctx.stroke();
          ctx.setLineDash([]);

          const muzzleGlow = ctx.createRadialGradient(bx, by, 2, bx, by, 38);
          muzzleGlow.addColorStop(0, "rgba(255,255,255,0.92)");
          muzzleGlow.addColorStop(0.22, "rgba(130,245,255,0.62)");
          muzzleGlow.addColorStop(1, "rgba(0,190,255,0)");
          ctx.fillStyle = muzzleGlow;
          ctx.beginPath();
          ctx.arc(bx, by, 38, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      ctx.restore();
    }


    // 규칙적인 등간격 패턴 대신, 고정 시드 난수로 자연스럽게 흩어진 별밭을 만든다.
    // 배경은 한 번만 그리므로 별의 좌표와 밝기는 실행 중 안정적으로 유지된다.
    function createStarRandom(seed) {
      let state = seed >>> 0;
      return () => {
        state = (state * 1664525 + 1013904223) >>> 0;
        return state / 4294967296;
      };
    }
    function starGaussian(random) {
      const u = Math.max(0.000001, random());
      const v = random();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    const starRandom = createStarRandom(0x4e454255);
    const starClusters = [
      { x: 105, y: 145, sx: 82, sy: 112 },
      { x: 500, y: 205, sx: 105, sy: 125 },
      { x: 265, y: 455, sx: 118, sy: 145 },
      { x: 570, y: 690, sx: 78, sy: 125 },
      { x: 145, y: 790, sx: 105, sy: 92 }
    ];
    const starColors = ["#bceeff", "#dce9ff", "#91dfff", "#c6baff", "#ffffff"];
    const spaceStars = Array.from({ length: 142 }, (_, i) => {
      let x, y;
      if (i < 42 || starRandom() < 0.27) {
        // 일부 별은 넓은 공간에 드문드문 흩뿌린다.
        x = starRandom() * canvas.width;
        y = starRandom() * canvas.height;
      } else {
        // 나머지는 몇 개의 흐릿한 성운 영역 주변에 느슨하게 모인다.
        const cluster = starClusters[Math.floor(starRandom() * starClusters.length)];
        x = cluster.x + starGaussian(starRandom) * cluster.sx;
        y = cluster.y + starGaussian(starRandom) * cluster.sy;
      }
      x = Math.max(3, Math.min(canvas.width - 3, x));
      y = Math.max(3, Math.min(canvas.height - 3, y));
      const sizeRoll = starRandom();
      const r = sizeRoll < 0.70 ? 0.32 + starRandom() * 0.55
        : sizeRoll < 0.96 ? 0.88 + starRandom() * 0.72
        : 1.65 + starRandom() * 0.75;
      return {
        x, y, r,
        alpha: 0.24 + starRandom() * 0.58,
        color: starColors[Math.floor(starRandom() * starColors.length)],
        sparkle: r > 1.55 && starRandom() < 0.42
      };
    });
    // Static scenery is painted once instead of rebuilding gradients every frame.
    const backgroundCanvas = document.createElement('canvas');
    backgroundCanvas.width = canvas.width;
    backgroundCanvas.height = canvas.height;
    const backgroundCtx = backgroundCanvas.getContext('2d');
    function buildSpaceBackground() {
      const b = backgroundCtx;
      const bg = b.createLinearGradient(0,0,canvas.width,canvas.height);
      bg.addColorStop(0,"#071329"); bg.addColorStop(.52,"#080d20"); bg.addColorStop(1,"#100b27");
      b.fillStyle=bg; b.fillRect(0,0,canvas.width,canvas.height);
      const nebula=b.createRadialGradient(350,330,15,350,330,440);
      nebula.addColorStop(0,"rgba(31,104,178,.17)");
      nebula.addColorStop(.55,"rgba(87,54,157,.08)");
      nebula.addColorStop(1,"rgba(0,0,0,0)");
      b.fillStyle=nebula; b.fillRect(0,0,canvas.width,canvas.height);
      // 격자 없이 불규칙한 위치·크기·색상의 별을 그린다.
      for (const star of spaceStars) {
        b.globalAlpha = star.alpha;
        b.fillStyle = star.color;
        b.beginPath();
        b.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        b.fill();
        // 극소수의 밝은 별에만 은은한 십자형 반짝임을 더한다.
        if (star.sparkle) {
          b.globalAlpha = star.alpha * 0.42;
          b.strokeStyle = star.color;
          b.lineWidth = 0.65;
          b.beginPath();
          b.moveTo(star.x - star.r * 2.8, star.y);
          b.lineTo(star.x + star.r * 2.8, star.y);
          b.moveTo(star.x, star.y - star.r * 2.8);
          b.lineTo(star.x, star.y + star.r * 2.8);
          b.stroke();
        }
      }
      b.globalAlpha = 1;
      const vignette=b.createRadialGradient(350,450,240,350,450,610);
      vignette.addColorStop(0,"rgba(0,0,0,0)"); vignette.addColorStop(1,"rgba(0,0,8,.52)");
      b.fillStyle=vignette; b.fillRect(0,0,canvas.width,canvas.height);
    }
    buildSpaceBackground();

    // 쉬움 전용 배경: 우주 성운과 별을 사용하지 않고 파스텔 핑크 바탕에 하트를 흩뿌린다.
    // 하트는 시작 시 정적 캔버스에 한 번만 그려 매 프레임 추가 계산을 최소화한다.
    const easyBackgroundCanvas = document.createElement("canvas");
    easyBackgroundCanvas.width = canvas.width;
    easyBackgroundCanvas.height = canvas.height;
    const easyBackgroundCtx = easyBackgroundCanvas.getContext("2d");

    function traceHeartPath(target, size) {
      target.beginPath();
      target.moveTo(0, size * 0.36);
      target.bezierCurveTo(-size * 0.18, size * 0.20, -size * 0.62, -size * 0.10, -size * 0.48, -size * 0.48);
      target.bezierCurveTo(-size * 0.37, -size * 0.78, -size * 0.07, -size * 0.72, 0, -size * 0.43);
      target.bezierCurveTo(size * 0.07, -size * 0.72, size * 0.37, -size * 0.78, size * 0.48, -size * 0.48);
      target.bezierCurveTo(size * 0.62, -size * 0.10, size * 0.18, size * 0.20, 0, size * 0.36);
      target.closePath();
    }

    function buildEasyBackground() {
      const b = easyBackgroundCtx;
      const pink = b.createLinearGradient(0, 0, canvas.width, canvas.height);
      pink.addColorStop(0, "#f8e9ee");
      pink.addColorStop(0.48, "#f3e0e8");
      pink.addColorStop(1, "#efd9e3");
      b.fillStyle = pink;
      b.fillRect(0, 0, canvas.width, canvas.height);

      // 아주 옅은 둥근 색면만 더해 단색처럼 밋밋하지 않게 한다. 성운 효과는 사용하지 않는다.
      b.fillStyle = "rgba(255,255,255,.16)";
      b.beginPath(); b.ellipse(110, 190, 150, 210, -0.25, 0, Math.PI * 2); b.fill();
      b.fillStyle = "rgba(198,139,164,.055)";
      b.beginPath(); b.ellipse(590, 700, 190, 260, 0.18, 0, Math.PI * 2); b.fill();

      const heartColors = ["#fffafd", "#e9bdcf", "#e5c0d0", "#ffffff", "#efd0dd"];
      for (let i = 0; i < 42; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const size = 5 + Math.random() * 13;
        b.save();
        b.translate(x, y);
        b.rotate((Math.random() - 0.5) * 0.9);
        b.globalAlpha = 0.13 + Math.random() * 0.22;
        traceHeartPath(b, size);
        b.fillStyle = heartColors[Math.floor(Math.random() * heartColors.length)];
        b.fill();
        if (i % 7 === 0) {
          b.globalAlpha *= 0.75;
          b.strokeStyle = "rgba(166,113,137,.30)";
          b.lineWidth = 0.8;
          b.stroke();
        }
        b.restore();
      }

      // 구석에는 큰 반투명 하트를 몇 개만 두어 하트 배경임을 멀리서도 알아보게 한다.
      const cornerHearts = [
        { x: 42, y: 86, size: 33, angle: -0.22 },
        { x: 654, y: 210, size: 28, angle: 0.28 },
        { x: 72, y: 790, size: 39, angle: 0.18 },
        { x: 635, y: 825, size: 34, angle: -0.18 }
      ];
      for (const heart of cornerHearts) {
        b.save();
        b.translate(heart.x, heart.y);
        b.rotate(heart.angle);
        b.globalAlpha = 0.10;
        traceHeartPath(b, heart.size);
        b.fillStyle = "#fffafd";
        b.fill();
        b.restore();
      }
      b.globalAlpha = 1;
    }

    buildEasyBackground();

    function drawSpaceBackground() {
      if (difficultyMode === "easy") {
        ctx.drawImage(easyBackgroundCanvas, 0, 0);
      } else {
        ctx.drawImage(backgroundCanvas, 0, 0);
      }
    }

    function drawMilestoneBoss() {
      if (!boss) return;
      const scale = Math.min(boss.width / 100, 1.7);
      const cx = boss.x + boss.width / 2;
      const cy = boss.y + boss.height / 2;
      const phaseTwo = boss.phase === 2;
      const main = phaseTwo ? "#d9f7f7" : "#8274b9";
      const dark = phaseTwo ? "#173b55" : "#211b45";
      const accent = phaseTwo ? "#75f4ff" : "#ff5c9c";
      const glow = phaseTwo ? "#e7fdff" : "#c6a4ff";

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);

      // 거대한 뿔과 어깨 갑주: 기존 전함형 보스와 실루엣이 겹치지 않는 수호자 형태
      ctx.fillStyle = dark;
      ctx.strokeStyle = accent;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-30,-22); ctx.lineTo(-83,-66); ctx.lineTo(-70,-24);
      ctx.lineTo(-91,7); ctx.lineTo(-53,31); ctx.lineTo(-29,23);
      ctx.lineTo(29,23); ctx.lineTo(53,31); ctx.lineTo(91,7);
      ctx.lineTo(70,-24); ctx.lineTo(83,-66); ctx.lineTo(30,-22);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // 어깨 갑주 안쪽의 장식 판
      for (const side of [-1, 1]) {
        ctx.fillStyle = phaseTwo ? "#32617a" : "#44366f";
        ctx.beginPath();
        ctx.moveTo(side*38,-18); ctx.lineTo(side*70,-43);
        ctx.lineTo(side*62,-7); ctx.lineTo(side*43,14); ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = glow; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(side*47,-4); ctx.lineTo(side*66,-22); ctx.stroke();
      }

      // 중앙의 다면체 머리 갑주
      const shell = ctx.createLinearGradient(0,-52,0,52);
      shell.addColorStop(0, main);
      shell.addColorStop(.35, phaseTwo ? "#4d8292" : "#554b82");
      shell.addColorStop(1, dark);
      ctx.fillStyle = shell;
      ctx.strokeStyle = phaseTwo ? "#d8ffff" : "#d7c4ff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0,-57); ctx.lineTo(34,-36); ctx.lineTo(43,4);
      ctx.lineTo(27,43); ctx.lineTo(0,56); ctx.lineTo(-27,43);
      ctx.lineTo(-43,4); ctx.lineTo(-34,-36); ctx.closePath();
      ctx.fill(); ctx.stroke();

      // 이마의 왕관형 에너지 돌기
      ctx.fillStyle = accent;
      ctx.beginPath();
      ctx.moveTo(-18,-43); ctx.lineTo(-10,-70); ctx.lineTo(0,-55);
      ctx.lineTo(10,-70); ctx.lineTo(18,-43); ctx.closePath(); ctx.fill();
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(0,-42,5,0,Math.PI*2); ctx.fill();

      // 눈과 얼굴 중앙의 빛나는 코어
      ctx.fillStyle = phaseTwo ? "#06283e" : "#180f32";
      ctx.beginPath(); ctx.ellipse(0,-5,27,19,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = accent;
      ctx.beginPath(); ctx.moveTo(-20,-6); ctx.lineTo(-5,-13); ctx.lineTo(-2,-3); ctx.lineTo(-19,1); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(20,-6); ctx.lineTo(5,-13); ctx.lineTo(2,-3); ctx.lineTo(19,1); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(0,18,phaseTwo ? 15 : 12,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = accent;
      ctx.beginPath(); ctx.arc(0,18,phaseTwo ? 10 : 8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(-3,14,3,0,Math.PI*2); ctx.fill();

      // 아래쪽 턱 장갑과 양쪽 돌출 송곳니
      ctx.fillStyle = phaseTwo ? "#24536a" : "#302652";
      ctx.strokeStyle = accent; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-26,24); ctx.lineTo(-16,48); ctx.lineTo(0,39);
      ctx.lineTo(16,48); ctx.lineTo(26,24); ctx.lineTo(0,33); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.moveTo(-26,18); ctx.lineTo(-19,36); ctx.lineTo(-12,23); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(26,18); ctx.lineTo(19,36); ctx.lineTo(12,23); ctx.closePath(); ctx.fill();

      // 2페이지에는 왕관 링과 떠 있는 보조 칼날이 추가되어 형태가 확실히 변화
      if (phaseTwo) {
        ctx.strokeStyle = "rgba(117,244,255,.9)"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(0,0,105,68,-0.12,Math.PI*1.08,Math.PI*1.92); ctx.stroke();
        ctx.fillStyle = "#b7faff";
        for (const side of [-1,1]) {
          ctx.beginPath();
          ctx.moveTo(side*76,-42); ctx.lineTo(side*101,-67);
          ctx.lineTo(side*94,-28); ctx.lineTo(side*78,-12); ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = "#e7fdff";
        ctx.fillRect(-3,-78,6,15);
      } else {
        // 1페이지의 어두운 장식 링
        ctx.strokeStyle = "rgba(255,92,156,.55)"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(0,0,98,63,0,Math.PI*1.12,Math.PI*1.88); ctx.stroke();
      }
      ctx.restore();

      // 수리 코어: 그림자/점선/매 프레임 파티클을 제거해 저사양 환경에서도 가볍게 표시
      if (boss.repairNode && !boss.introMode) {
        const node = boss.repairNode;
        const nx = node.x + node.width / 2;
        const ny = node.y + node.height / 2;
        const bossCenterX = boss.x + boss.width / 2;
        const bossCenterY = boss.y + boss.height / 2;

        // 보스와 코어를 잇는 단순한 이중 직선 (shadowBlur 및 setLineDash 미사용)
        ctx.save();
        ctx.globalAlpha = 0.72;
        ctx.strokeStyle = "#278da8";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(nx, ny - 22);
        ctx.lineTo(bossCenterX, bossCenterY + 35);
        ctx.stroke();
        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = "#bafaff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(nx, ny - 22);
        ctx.lineTo(bossCenterX, bossCenterY + 35);
        ctx.stroke();
        ctx.restore();

        // 회전과 광원 효과 없이 고정된 기하학 형태로 코어 표시
        ctx.save();
        ctx.translate(nx, ny);
        ctx.fillStyle = "#062c43";
        ctx.strokeStyle = "#e2ffff";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0,-34); ctx.lineTo(27,-16); ctx.lineTo(27,16);
        ctx.lineTo(0,34); ctx.lineTo(-27,16); ctx.lineTo(-27,-16); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.strokeStyle = "#75f4ff";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0,0,21,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle = "#75f4ff";
        ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(-3,-7,6,6);
        ctx.restore();
      }
    }

    function drawWingmen() {
      if (stage < 21 || !player) return;

      for (const side of [-1, 1]) {
        const x = Math.max(16, Math.min(canvas.width - 16, player.x + side * 48));
        const y = player.y + 5;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(0.58, 0.58);
        ctx.globalAlpha = 0.96;
        ctx.shadowColor = "#75f4ff";
        ctx.shadowBlur = 13;
        ctx.fillStyle = "#167da0";
        ctx.strokeStyle = "#d9fbff";
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(0, -27);
        ctx.lineTo(16, 11);
        ctx.lineTo(7, 7);
        ctx.lineTo(0, 15);
        ctx.lineTo(-7, 7);
        ctx.lineTo(-16, 11);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#bdfaff";
        ctx.beginPath();
        ctx.moveTo(0, -17);
        ctx.lineTo(4, 4);
        ctx.lineTo(0, 1);
        ctx.lineTo(-4, 4);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#ffd66b";
        ctx.fillRect(-11, 4, 5, 3);
        ctx.fillRect(6, 4, 5, 3);
        ctx.fillStyle = "#75f4ff";
        ctx.beginPath();
        ctx.moveTo(-4, 13);
        ctx.lineTo(4, 13);
        ctx.lineTo(0, 25 + Math.random() * 4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    // 쉬움 전용 적: 정교한 전투 함선 대신 낙서처럼 단순하고 말랑한 캐릭터로 그린다.
    // 충돌 판정과 이동/체력은 기존 enemy 객체를 그대로 사용한다.
    function drawEasyEnemy(enemy) {
      const design = enemy.design || 0;
      const size = Math.min(enemy.width, enemy.height);
      const scale = size / 44;
      const bob = Math.sin(performance.now() * 0.003 + (enemy.visualSeed || 0)) * 1.1;
      const styles = [
        { body: "#ffd9ec", edge: "#d96e9f", blush: "#ff91b9", detail: "#fff4fa" },
        { body: "#fff0cd", edge: "#d6a36d", blush: "#ff9fbd", detail: "#ffc9dd" },
        { body: "#d9f4e3", edge: "#78b991", blush: "#ff9bb6", detail: "#f7fff8" }
      ];
      const style = styles[design] || styles[0];

      ctx.save();
      ctx.translate(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2 + bob);
      ctx.scale(scale, scale);
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.lineWidth = 2.5;

      // 귀와 작은 더듬이는 몸통 뒤에 먼저 그린다.
      if (design === 1) {
        ctx.fillStyle = style.body;
        ctx.strokeStyle = style.edge;
        ctx.beginPath(); ctx.ellipse(-10, -16, 5.5, 12, -0.22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(10, -16, 5.5, 11, 0.18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = style.detail;
        ctx.beginPath(); ctx.ellipse(-10, -16, 2.2, 7, -0.22, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(10, -16, 2.2, 6, 0.18, 0, Math.PI * 2); ctx.fill();
      } else if (design === 2) {
        ctx.strokeStyle = style.edge;
        ctx.beginPath(); ctx.moveTo(0, -13); ctx.quadraticCurveTo(-3, -24, 4, -25); ctx.stroke();
        ctx.fillStyle = style.blush;
        ctx.beginPath(); ctx.arc(4, -25, 3.2, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = style.body;
        ctx.strokeStyle = style.edge;
        ctx.beginPath(); ctx.arc(-10, -10, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(10, -10, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }

      // 종류마다 몸통 모양만 살짝 다르게 한 단순한 낙서 스타일.
      ctx.fillStyle = style.body;
      ctx.strokeStyle = style.edge;
      ctx.beginPath();
      if (design === 0) {
        ctx.moveTo(-18, 4);
        ctx.quadraticCurveTo(-21, -11, -9, -16);
        ctx.quadraticCurveTo(0, -22, 8, -15);
        ctx.quadraticCurveTo(21, -12, 18, 4);
        ctx.quadraticCurveTo(16, 18, 1, 17);
        ctx.quadraticCurveTo(-15, 20, -18, 4);
      } else if (design === 1) {
        ctx.ellipse(0, 1, 17, 17, 0, 0, Math.PI * 2);
      } else {
        ctx.moveTo(0, -19);
        ctx.quadraticCurveTo(18, -12, 17, 2);
        ctx.quadraticCurveTo(17, 18, 0, 18);
        ctx.quadraticCurveTo(-17, 18, -17, 2);
        ctx.quadraticCurveTo(-18, -12, 0, -19);
      }
      ctx.fill(); ctx.stroke();

      // 짧은 손과 발을 대충 붙여 장난감 같은 느낌을 준다.
      ctx.fillStyle = style.body;
      ctx.strokeStyle = style.edge;
      ctx.beginPath(); ctx.ellipse(-19, 6, 4, 6, -0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(19, 6, 4, 6, 0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(-8, 16, 5, 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(8, 16, 5, 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      // 동그란 눈, 볼터치, 삐뚤한 입.
      ctx.fillStyle = "#56384a";
      ctx.beginPath(); ctx.arc(-6.5, -2, 2.1, 0, Math.PI * 2); ctx.arc(6.5, -2, 2.1, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = style.blush;
      ctx.beginPath(); ctx.ellipse(-12, 5, 4, 2.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(12, 5, 4, 2.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#8f526c";
      ctx.lineWidth = 1.7;
      ctx.beginPath(); ctx.moveTo(-2.5, 7); ctx.quadraticCurveTo(1, 10, 4, 7); ctx.stroke();

      if (design === 2) {
        // 방울이에게만 작은 리본 점 하나를 추가한다.
        ctx.fillStyle = "#ff82ae";
        ctx.beginPath(); ctx.arc(0, -13, 3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();

      // 이름표는 작고 둥글게 표시해 귀여운 별명을 실제 게임에서도 알아볼 수 있게 한다.
      if (enemy.displayName) {
        ctx.save();
        ctx.font = '900 8px "Malgun Gothic", "맑은 고딕", Arial, sans-serif';
        ctx.textAlign = "center";
        const labelWidth = ctx.measureText(enemy.displayName).width + 9;
        const labelX = enemy.x + enemy.width / 2;
        const labelY = enemy.y + enemy.height + 3;
        ctx.fillStyle = "rgba(255,249,252,.92)";
        ctx.strokeStyle = "rgba(214,105,153,.58)";
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.roundRect(labelX - labelWidth / 2, labelY, labelWidth, 12, 6); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#9c4c70";
        ctx.fillText(enemy.displayName, labelX, labelY + 8.4);
        ctx.restore();
      }
    }

    // 일반 모드에서는 현재의 함선 디자인을 유지하고, 쉬움에서만 귀여운 낙서 적으로 교체한다.
    function drawEnemyShip(enemy) {
      if (difficultyMode === "easy") {
        drawEasyEnemy(enemy);
        return;
      }
      const tier = enemy.visualTier || 0;
      const design = enemy.design || 0;
      const scale = Math.min(enemy.width, enemy.height) / 52;
      const hull = enemy.hullColor || "#183d45";
      const plate = enemy.plateColor || "#28745f";
      const accent = enemy.color || "#55efad";
      const core = enemy.coreColor || "#e0ffff";
      const secondary = enemy.secondaryColor || null;

      ctx.save();
      ctx.translate(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
      ctx.scale(scale, scale);
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      // 후방 엔진: 짧은 고정 도형으로 표현해 파티클 계산을 추가하지 않는다.
      ctx.fillStyle = accent;
      ctx.globalAlpha = 0.72;
      ctx.beginPath();
      ctx.moveTo(-13, -13); ctx.lineTo(-8, -13); ctx.lineTo(-10, -27 - tier * 1.2); ctx.closePath();
      ctx.moveTo(8, -13); ctx.lineTo(13, -13); ctx.lineTo(10, -27 - tier * 1.2); ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;

      // 상위 등급은 선체 바깥에 장갑 날개가 한 겹씩 추가된다.
      if (tier >= 1) {
        ctx.fillStyle = plate;
        ctx.strokeStyle = accent;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(-8, -9); ctx.lineTo(-25, -2 - tier); ctx.lineTo(-22, 12);
        ctx.lineTo(-9, 8); ctx.closePath();
        ctx.moveTo(8, -9); ctx.lineTo(25, -2 - tier); ctx.lineTo(22, 12);
        ctx.lineTo(9, 8); ctx.closePath();
        ctx.fill(); ctx.stroke();
      }

      // 함선 실루엣은 3종류로 나뉘어 한 화면에서도 서로 구별된다.
      ctx.fillStyle = hull;
      ctx.strokeStyle = accent;
      ctx.lineWidth = tier >= 3 ? 2.2 : 1.6;
      ctx.beginPath();
      if (design === 0) {
        // 빠른 요격기: 날카로운 앞부분과 뒤로 뻗은 날개
        ctx.moveTo(0, 24); ctx.lineTo(8, 8); ctx.lineTo(23, 1);
        ctx.lineTo(17, -8); ctx.lineTo(9, -5); ctx.lineTo(7, -21);
        ctx.lineTo(0, -16); ctx.lineTo(-7, -21); ctx.lineTo(-9, -5);
        ctx.lineTo(-17, -8); ctx.lineTo(-23, 1); ctx.lineTo(-8, 8); ctx.closePath();
      } else if (design === 1) {
        // 날개형 함선: 넓게 펼쳐진 좌우 날개와 분리된 꼬리
        ctx.moveTo(0, 23); ctx.lineTo(10, 8); ctx.lineTo(25, -1);
        ctx.lineTo(23, -9); ctx.lineTo(11, -7); ctx.lineTo(6, -19);
        ctx.lineTo(0, -14); ctx.lineTo(-6, -19); ctx.lineTo(-11, -7);
        ctx.lineTo(-23, -9); ctx.lineTo(-25, -1); ctx.lineTo(-10, 8); ctx.closePath();
      } else {
        // 중장갑 드론: 네 방향 장갑 돌기와 두꺼운 중앙 선체
        ctx.moveTo(0, 24); ctx.lineTo(12, 13); ctx.lineTo(22, 12);
        ctx.lineTo(18, 2); ctx.lineTo(23, -12); ctx.lineTo(9, -10);
        ctx.lineTo(0, -22); ctx.lineTo(-9, -10); ctx.lineTo(-23, -12);
        ctx.lineTo(-18, 2); ctx.lineTo(-22, 12); ctx.lineTo(-12, 13); ctx.closePath();
      }
      ctx.fill(); ctx.stroke();

      // 내부 장갑 패널과 중앙 함교
      ctx.fillStyle = plate;
      ctx.beginPath();
      ctx.moveTo(0, -13); ctx.lineTo(8, -5); ctx.lineTo(7, 10);
      ctx.lineTo(0, 18); ctx.lineTo(-7, 10); ctx.lineTo(-8, -5); ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(235,250,255,.52)";
      ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(0, 13); ctx.stroke();

      // 좌우 포대와 동력선은 장갑이 강해질수록 선명해진다.
      ctx.fillStyle = tier >= 2 ? accent : hull;
      ctx.strokeStyle = accent;
      ctx.lineWidth = 1.1;
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(side * 12, -3); ctx.lineTo(side * 20, -5);
        ctx.lineTo(side * 18, 5); ctx.lineTo(side * 11, 7); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = core;
        ctx.fillRect(side * 15 - 1.2, -1, 2.4, 4);
        ctx.fillStyle = tier >= 2 ? accent : hull;
      }

      // 중심 에너지 코어: 단계가 올라갈수록 크고 밝아져 강화 상태를 알아보기 쉽다.
      const coreRadius = tier >= 4 ? 6.4 : tier >= 2 ? 5.5 : 4.2;
      ctx.fillStyle = "#091522";
      ctx.strokeStyle = accent;
      ctx.lineWidth = tier >= 3 ? 2 : 1.3;
      ctx.beginPath(); ctx.arc(0, 4, coreRadius + 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = accent;
      ctx.beginPath(); ctx.arc(0, 4, coreRadius, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = core;
      ctx.beginPath(); ctx.arc(-1.4, 2.2, Math.max(1.4, coreRadius * 0.38), 0, Math.PI * 2); ctx.fill();

      // 11스테이지부터는 추가 코어, 16스테이지부터는 방어막 링을 표시한다.
      if (tier >= 2) {
        ctx.fillStyle = core;
        ctx.beginPath(); ctx.arc(-12, 11, 2.2, 0, Math.PI * 2); ctx.arc(12, 11, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = accent;
        ctx.lineWidth = 1.1;
        ctx.beginPath(); ctx.moveTo(-10, 14); ctx.lineTo(-5, 18); ctx.moveTo(10, 14); ctx.lineTo(5, 18); ctx.stroke();
      }
      if (tier >= 3) {
        ctx.globalAlpha = 0.82;
        ctx.strokeStyle = accent;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 2, 27, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 2, 27, Math.PI * 0.08, Math.PI * 0.92); ctx.stroke();
        ctx.globalAlpha = 1;
        // 장갑 판금 3개가 후반 적의 높은 방어 등급을 시각적으로 표시한다.
        ctx.fillStyle = plate;
        ctx.strokeStyle = accent;
        ctx.lineWidth = 1.2;
        for (const side of [-1, 0, 1]) {
          const px = side * 13;
          ctx.beginPath();
          ctx.moveTo(px - 4, -17); ctx.lineTo(px, -22 - (side === 0 ? 3 : 0));
          ctx.lineTo(px + 4, -17); ctx.lineTo(px + 3, -12); ctx.lineTo(px - 3, -12); ctx.closePath();
          ctx.fill(); ctx.stroke();
        }
      }
      if (tier >= 4) {
        // 21스테이지 이후 지휘급 적: 왕관형 상부 장갑과 삼중 에너지 표식
        // 라임색은 솔라 빔과 혼동되지 않도록 선체 주색으로 쓰지 않고 작은 장갑 식별선에만 사용한다.
        if (secondary) {
          ctx.fillStyle = secondary;
          ctx.globalAlpha = 0.92;
          ctx.beginPath();
          ctx.moveTo(-21, -3); ctx.lineTo(-16, -6); ctx.lineTo(-13, -1); ctx.lineTo(-18, 2); ctx.closePath();
          ctx.moveTo(21, -3); ctx.lineTo(16, -6); ctx.lineTo(13, -1); ctx.lineTo(18, 2); ctx.closePath();
          ctx.fill();
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = plate;
        ctx.strokeStyle = core;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(-12, -18); ctx.lineTo(-9, -28); ctx.lineTo(0, -21);
        ctx.lineTo(9, -28); ctx.lineTo(12, -18); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = core;
        ctx.beginPath(); ctx.arc(0, -19, 2.3, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = accent;
        ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.arc(0, 4, 31, Math.PI * 1.18, Math.PI * 1.82); ctx.stroke();
      }

      // 장갑 등급을 작은 점으로도 표현해, 작은 화면에서도 후반 강화가 눈에 띈다.
      if (tier > 0) {
        for (let i = 0; i < tier; i++) {
          ctx.fillStyle = core;
          ctx.globalAlpha = 0.95;
          ctx.beginPath(); ctx.arc(-((tier - 1) * 3.2) + i * 6.4, 21, 1.5, 0, Math.PI * 2); ctx.fill();
        }
      }

      ctx.restore();
    }

    // 쉬움 난이도의 보스도 전함 대신 커다란 말랑 캐릭터로 표현한다.
    function drawEasyBoss() {
      if (!boss) return;
      const cx = boss.x + boss.width / 2;
      const cy = boss.y + boss.height / 2;
      const scale = Math.min(boss.width / 148, 1.5);
      const bodyColor = boss.isMilestone ? "#ff9fc9" : "#ffc2dc";
      const edgeColor = boss.isMilestone ? "#ca568c" : "#d875a2";

      ctx.save();
      ctx.translate(cx, cy + Math.sin(performance.now() * 0.002) * 1.6);
      ctx.scale(scale, scale);
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      // 삐뚤빼뚤한 두 귀와 동그란 몸통.
      ctx.fillStyle = bodyColor;
      ctx.strokeStyle = edgeColor;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(-27, -39, 12, 21, -0.25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(28, -38, 11, 19, 0.22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff0f7";
      ctx.beginPath(); ctx.ellipse(-27, -39, 4.5, 13, -0.25, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(28, -38, 4, 11, 0.22, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = bodyColor;
      ctx.strokeStyle = edgeColor;
      ctx.beginPath(); ctx.moveTo(-55, 7);
      ctx.quadraticCurveTo(-67, -39, -28, -48);
      ctx.quadraticCurveTo(0, -66, 30, -47);
      ctx.quadraticCurveTo(66, -35, 56, 10);
      ctx.quadraticCurveTo(53, 53, 0, 54);
      ctx.quadraticCurveTo(-54, 52, -55, 7);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // 짧은 팔과 발.
      ctx.beginPath(); ctx.ellipse(-57, 12, 10, 13, -0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(57, 12, 10, 13, 0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(-23, 51, 12, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(23, 51, 12, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      // 큼지막한 눈과 볼터치, 단순한 입.
      ctx.fillStyle = "#59394c";
      ctx.beginPath(); ctx.arc(-19, -5, 4.2, 0, Math.PI * 2); ctx.arc(19, -5, 4.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ff83b1";
      ctx.beginPath(); ctx.ellipse(-34, 12, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(34, 12, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#98516f"; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(-5, 19); ctx.quadraticCurveTo(0, 25, 6, 19); ctx.stroke();

      // 머리 위 하트 장식. 20스테이지 보스는 하트 세 개를 단다.
      ctx.fillStyle = "#ff4f98";
      ctx.save(); ctx.translate(0, -61);
      traceHeartPath(ctx, boss.isMilestone ? 22 : 18);
      ctx.fill();
      ctx.restore();
      if (boss.isMilestone) {
        ctx.save(); ctx.translate(-18, -56); traceHeartPath(ctx, 10); ctx.fill(); ctx.restore();
        ctx.save(); ctx.translate(18, -56); traceHeartPath(ctx, 10); ctx.fill(); ctx.restore();
      }
      ctx.restore();

      const bossName = boss.isMilestone ? "하트 대장" : "대왕 말랑이";
      ctx.save();
      ctx.font = '900 11px "Malgun Gothic", "맑은 고딕", Arial, sans-serif';
      ctx.textAlign = "center";
      const w = ctx.measureText(bossName).width + 16;
      const y = boss.y + boss.height + 5;
      ctx.fillStyle = "rgba(255,248,252,.94)";
      ctx.strokeStyle = "rgba(203,83,137,.66)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(cx - w / 2, y, w, 17, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#963e68";
      ctx.fillText(bossName, cx, y + 12);
      ctx.restore();

      // 쉬움 모드에서는 drawMilestoneBoss()를 사용하지 않으므로,
      // 보스의 회복 코어를 이 경로에서 별도로 그려 항상 보이게 한다.
      if (boss.repairNode && !boss.introMode) {
        const node = boss.repairNode;
        const nx = node.x + node.width / 2;
        const ny = node.y + node.height / 2;
        const bossBottomX = boss.x + boss.width / 2;
        const bossBottomY = boss.y + boss.height - 8;
        const hpRatio = Math.max(0, Math.min(1, node.hp / node.maxHp));

        ctx.save();
        // 보스와 코어를 잇는 굵고 선명한 분홍 연결선.
        ctx.strokeStyle = "rgba(183,83,132,.68)";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(bossBottomX, bossBottomY);
        ctx.lineTo(nx, ny - 25);
        ctx.stroke();
        ctx.strokeStyle = "rgba(255,248,252,.95)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(bossBottomX, bossBottomY);
        ctx.lineTo(nx, ny - 25);
        ctx.stroke();

        // 민트색 캔디 캡슐과 진한 테두리로 핑크 배경/보스와 확실히 구분.
        ctx.translate(nx, ny);
        ctx.fillStyle = "#a9e5d0";
        ctx.strokeStyle = "#8d4770";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, 29, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#f7fff8";
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.save();
        ctx.translate(0, 1);
        traceHeartPath(ctx, 17);
        ctx.fillStyle = "#f06b9c";
        ctx.strokeStyle = "#a83f70";
        ctx.lineWidth = 1.8;
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // 코어 체력을 바로 알아볼 수 있는 작은 막대.
        ctx.fillStyle = "rgba(98,57,83,.22)";
        ctx.beginPath(); ctx.roundRect(-31, 36, 62, 7, 4); ctx.fill();
        ctx.fillStyle = "#e96d9d";
        ctx.beginPath(); ctx.roundRect(-31, 36, 62 * hpRatio, 7, 4); ctx.fill();
        ctx.restore();

        // 코어 이름표는 위치를 고정해 적/보스 몸통과 겹치지 않게 표시.
        ctx.save();
        ctx.font = '900 11px "Malgun Gothic", "맑은 고딕", Arial, sans-serif';
        ctx.textAlign = "center";
        const tagText = "하트 충전기";
        const tagWidth = ctx.measureText(tagText).width + 18;
        const tagY = node.y + node.height + 4;
        ctx.fillStyle = "rgba(255,250,253,.97)";
        ctx.strokeStyle = "#b45a83";
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.roundRect(nx - tagWidth / 2, tagY, tagWidth, 19, 9); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#8f3c67";
        ctx.fillText(tagText, nx, tagY + 13);
        ctx.restore();
      }
    }

    function drawEasyPlayfieldFrame() {
      if (difficultyMode !== "easy") return;
      ctx.save();
      // 실제 플레이 영역의 외곽과 안쪽 기준선을 겹쳐 핑크 배경에서도 경계가 또렷하게 보이게 한다.
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(143, 83, 111, 0.88)";
      ctx.lineWidth = 7;
      ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.96)";
      ctx.lineWidth = 2;
      ctx.strokeRect(12, 12, canvas.width - 24, canvas.height - 24);

      // 네 모서리의 짧은 이중 코너 표시로 전장 끝을 직관적으로 알려준다.
      ctx.strokeStyle = "rgba(168, 91, 125, 0.95)";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      const inset = 18, len = 30;
      const corners = [
        [inset, inset, 1, 1],
        [canvas.width - inset, inset, -1, 1],
        [inset, canvas.height - inset, 1, -1],
        [canvas.width - inset, canvas.height - inset, -1, -1]
      ];
      for (const [x, y, sx, sy] of corners) {
        ctx.beginPath();
        ctx.moveTo(x + sx * len, y); ctx.lineTo(x, y); ctx.lineTo(x, y + sy * len);
        ctx.stroke();
      }
      ctx.restore();
    }

    function draw() {
      drawSpaceBackground();

      let shakeX = 0, shakeY = 0;
      if (shakeTime > 0) {
        shakeX = (Math.random() - 0.5) * shakePower;
        shakeY = (Math.random() - 0.5) * shakePower;
      }

      ctx.save();
      ctx.translate(shakeX, shakeY);

      drawLaser();
      drawBossLasers();

      for (let i = dashTrails.length - 1; i >= 0; i--) {
        const trail = dashTrails[i];
        ctx.save();
        ctx.globalAlpha = trail.alpha;
        ctx.fillStyle = "#00f0ff";
        ctx.beginPath();
        ctx.arc(trail.x, trail.y, trail.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        trail.alpha -= 0.08;
        if (trail.alpha <= 0) dashTrails.splice(i, 1);
      }

      if (!gameOver && (player.invulnerableTimer % 6 < 3)) {
        ctx.save(); ctx.translate(player.x,player.y);
        ctx.shadowColor="#35eaff"; ctx.shadowBlur=24;
        ctx.fillStyle="#1be4ff"; ctx.strokeStyle="#d9fbff"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(0,-27); ctx.lineTo(17,12); ctx.lineTo(7,8);
        ctx.lineTo(0,17); ctx.lineTo(-7,8); ctx.lineTo(-17,12); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.shadowBlur=0; ctx.fillStyle="#eefcff";
        ctx.beginPath(); ctx.moveTo(0,-17); ctx.lineTo(5,5); ctx.lineTo(0,2); ctx.lineTo(-5,5); ctx.closePath(); ctx.fill();
        ctx.shadowColor="#25bfff"; ctx.fillStyle="rgba(31,190,255,.8)";
        ctx.beginPath(); ctx.ellipse(0,20,4,9,0,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }

      drawWingmen();

      if (boss) {
        if (difficultyMode === "easy") {
          drawEasyBoss();
        } else if (boss.isMilestone) {
          drawMilestoneBoss();
        } else {
          // 거대 전함형 보스: 기존 충돌 판정/이동 크기는 유지하고 화면에 그리는 외형만 확장
          ctx.save();
          const s = boss.width / 100;
          const cx = boss.x + boss.width / 2;
          const cy = boss.y + boss.height / 2;
          ctx.translate(cx, cy);
          ctx.scale(s, s);

          const hull = ctx.createLinearGradient(0, -52, 0, 52);
          hull.addColorStop(0, "#9baec5");
          hull.addColorStop(0.22, "#435b78");
          hull.addColorStop(0.58, "#182b43");
          hull.addColorStop(1, "#071321");
          const armor = ctx.createLinearGradient(0, -38, 0, 42);
          armor.addColorStop(0, "#d5e3ef");
          armor.addColorStop(0.35, "#607b98");
          armor.addColorStop(1, "#1a2c42");

          // 좌우로 크게 펼쳐진 장갑 날개
          ctx.fillStyle = "#101e30";
          ctx.strokeStyle = "#8ca8c4";
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(-36, -19); ctx.lineTo(-78, -34); ctx.lineTo(-69, -8);
          ctx.lineTo(-84, 13); ctx.lineTo(-47, 25); ctx.lineTo(-28, 18);
          ctx.lineTo(28, 18); ctx.lineTo(47, 25); ctx.lineTo(84, 13);
          ctx.lineTo(69, -8); ctx.lineTo(78, -34); ctx.lineTo(36, -19);
          ctx.closePath(); ctx.fill(); ctx.stroke();

          // 날개 위 장갑 패널과 붉은 전력 라인
          for (const side of [-1, 1]) {
            ctx.fillStyle = "#526b86";
            ctx.beginPath();
            ctx.moveTo(side*39, -15); ctx.lineTo(side*70, -27);
            ctx.lineTo(side*59, -5); ctx.lineTo(side*43, 5); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = "#e34b52"; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(side*42, 10); ctx.lineTo(side*69, 3); ctx.stroke();
            // 측면 포대
            ctx.fillStyle = "#263c55"; ctx.strokeStyle = "#a8bfd2"; ctx.lineWidth = 1.5;
            ctx.fillRect(side*52-7, -18, 14, 9); ctx.strokeRect(side*52-7, -18, 14, 9);
            ctx.fillStyle = "#ff625b"; ctx.fillRect(side*52-2, -26, 4, 10);
            // 엔진 노즐
            ctx.fillStyle = "#07111d"; ctx.fillRect(side*54-5, 20, 10, 13);
            ctx.fillStyle = "#ff6a45"; ctx.fillRect(side*54-2, 23, 4, 10);
          }

          // 중앙 주 선체
          ctx.fillStyle = hull; ctx.strokeStyle = "#c1d2e1"; ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(0, -54); ctx.lineTo(23, -30); ctx.lineTo(31, 13);
          ctx.lineTo(18, 42); ctx.lineTo(0, 49); ctx.lineTo(-18, 42);
          ctx.lineTo(-31, 13); ctx.lineTo(-23, -30); ctx.closePath();
          ctx.fill(); ctx.stroke();

          // 갑판의 길게 이어진 금속 패널
          ctx.fillStyle = armor;
          ctx.beginPath(); ctx.moveTo(0, -43); ctx.lineTo(13, -25); ctx.lineTo(18, 18);
          ctx.lineTo(0, 35); ctx.lineTo(-18, 18); ctx.lineTo(-13, -25); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = "#8ea8c0"; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(0, -39); ctx.lineTo(0, 31); ctx.stroke();

          // 전함의 함교: 층층이 쌓인 지휘탑
          ctx.fillStyle = "#263d56"; ctx.strokeStyle = "#d1e0ed"; ctx.lineWidth = 1.7;
          ctx.beginPath(); ctx.moveTo(-15, -22); ctx.lineTo(-10, -39); ctx.lineTo(10, -39);
          ctx.lineTo(15, -22); ctx.lineTo(11, -8); ctx.lineTo(-11, -8); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.fillStyle = "#ff5358"; ctx.fillRect(-8, -32, 16, 4);
          ctx.fillStyle = "#8feaff"; ctx.fillRect(-6, -23, 12, 3);

          // 선수의 주포와 좌우 보조 포탑
          ctx.fillStyle = "#17283b"; ctx.strokeStyle = "#b7c9d8"; ctx.lineWidth = 1.5;
          ctx.fillRect(-5, -52, 10, 17); ctx.strokeRect(-5, -52, 10, 17);
          ctx.fillRect(-25, -10, 12, 8); ctx.strokeRect(-25, -10, 12, 8);
          ctx.fillRect(13, -10, 12, 8); ctx.strokeRect(13, -10, 12, 8);
          ctx.fillStyle = "#ff665e";
          ctx.fillRect(-2, -57, 4, 13); ctx.fillRect(-22, -15, 3, 9); ctx.fillRect(19, -15, 3, 9);

          // 중앙 에너지 코어와 장갑 테두리
          ctx.fillStyle = "#260f1c"; ctx.strokeStyle = "#ff7770"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 9, 11, 0, Math.PI*2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = "#ff403f"; ctx.beginPath(); ctx.arc(0, 9, 6, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = "#fff0d8"; ctx.beginPath(); ctx.arc(-2, 6, 2.2, 0, Math.PI*2); ctx.fill();

          // 후방 추진기 불꽃: 파티클 대신 고정 도형으로 그려 부담 최소화
          ctx.fillStyle = "#ff713f";
          ctx.beginPath(); ctx.moveTo(-13, 39); ctx.lineTo(-7, 39); ctx.lineTo(-10, 57); ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(7, 39); ctx.lineTo(13, 39); ctx.lineTo(10, 57); ctx.closePath(); ctx.fill();
          ctx.restore();
        
        }
      }

      for (const bb of bossBullets) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const speed = Math.hypot(bb.vx || 0, bb.vy || 0) || 1;
        const angle = Math.atan2(bb.vy || 1, bb.vx || 0);
        ctx.translate(bb.x, bb.y);
        ctx.rotate(angle + Math.PI / 2);
        ctx.shadowColor = bb.color;
        ctx.shadowBlur = 0;
        const tail = ctx.createLinearGradient(0, -bb.radius * 4.5, 0, bb.radius);
        tail.addColorStop(0, 'rgba(255,255,255,0)');
        tail.addColorStop(.55, bb.color);
        tail.addColorStop(1, '#ffffff');
        ctx.fillStyle = tail;
        ctx.beginPath();
        ctx.moveTo(0, -bb.radius * 5.5);
        ctx.quadraticCurveTo(bb.radius * 1.15, -bb.radius, bb.radius * .72, bb.radius * .55);
        ctx.quadraticCurveTo(0, bb.radius * 1.5, -bb.radius * .72, bb.radius * .55);
        ctx.quadraticCurveTo(-bb.radius * 1.15, -bb.radius, 0, -bb.radius * 5.5);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, bb.radius * .68, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 0;
        ctx.fill();
        ctx.restore();
      }

      for (const enemy of enemies) {
        drawEnemyShip(enemy);
      }
      
      for (const item of items) {
          ctx.save();
          ctx.fillStyle = item.color;
          ctx.fillRect(item.x, item.y, item.width, item.height);
          
          ctx.fillStyle = "#111"; 
          ctx.font = "bold 16px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(item.text, item.x + item.width/2, item.y + item.height/2);
          ctx.restore();
      }

      for (const bullet of bullets) {
        ctx.save();
        if (difficultyMode === "easy") {
          // 쉬움에서는 모든 단계가 같은 크기의 하트 탄환. 레벨에 따라 색상만 바뀐다.
          const heartPalettes = ["#e99fba", "#d987ae", "#b99bcf", "#967db6"];
          const heartColor = heartPalettes[player.bulletLevel >= 30 ? 3 : player.bulletLevel >= 25 ? 2 : player.bulletLevel >= 15 ? 1 : 0];
          const heartSize = bullet.isWingman ? 12 : 16;
          ctx.translate(bullet.x, bullet.y);
          traceHeartPath(ctx, heartSize);
          ctx.fillStyle = heartColor;
          ctx.strokeStyle = "rgba(255,255,255,.82)";
          ctx.lineWidth = 1.1;
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "rgba(255,255,255,.70)";
          ctx.beginPath(); ctx.arc(-heartSize * 0.16, -heartSize * 0.32, 1.5, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          continue;
        }
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);

        if (player.bulletLevel >= 25 || bullet.isGoldenPulse) {
          ctx.fillStyle = "#ffc52e";
          ctx.strokeStyle = "#fff0a3";
          ctx.lineWidth = 1.4;
          ctx.fill();
          ctx.stroke();
        } else if (bullet.isWingman) {
          ctx.fillStyle = "#75f4ff";
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.2;
          ctx.fill();
          ctx.stroke();
        } else {
          if (player.bulletLevel >= 15) {
            ctx.fillStyle = "#a29bfe";
          } else {
            ctx.fillStyle = bullet.isAoe ? "#ff4757" : "#FFD700";
          }
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.radius * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = (player.bulletLevel >= 25 || bullet.isGoldenPulse) ? "#fff9d1" : (bullet.isWingman ? "#ffffff" : (player.bulletLevel >= 15 ? "#ffffff" : (bullet.isAoe ? "#ff9f1a" : "#FFF8B0")));
        ctx.fill();
        ctx.restore();
      }

      for (let i = lightningArcs.length - 1; i >= 0; i--) {
        const arc = lightningArcs[i];
        ctx.save();
        ctx.strokeStyle = arc.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(arc.x1, arc.y1);

        const midX = (arc.x1 + arc.x2) / 2 + (Math.random() - 0.5) * 30;
        const midY = (arc.y1 + arc.y2) / 2 + (Math.random() - 0.5) * 30;
        ctx.lineTo(midX, midY);
        ctx.lineTo(arc.x2, arc.y2);
        ctx.stroke();
        ctx.restore();

        arc.life--;
        if (arc.life <= 0) lightningArcs.splice(i, 1);
      }

      for (const sw of shockwaves) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, sw.alpha);

        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.currentRadius, 0, Math.PI * 2);
        ctx.fillStyle = sw.color;
        ctx.fill();

        ctx.lineWidth = 4;
        ctx.strokeStyle = sw.borderColor || "#ffffff";
        ctx.stroke();

        ctx.restore();
      }

      for (const wave of goldenWaves) {
        const left = Math.max(0, wave.x - wave.reach);
        const right = Math.min(canvas.width, wave.x + wave.reach);
        const fade = Math.max(0, 1 - wave.age / wave.duration);
        const span = Math.max(0, right - left);
        ctx.save();
        ctx.globalAlpha = fade * 0.22;
        ctx.fillStyle = "#ffc52e";
        ctx.fillRect(left, wave.y - 15, span, 30);
        ctx.globalAlpha = fade * 0.8;
        ctx.strokeStyle = "#ffc52e";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(left, wave.y);
        ctx.lineTo(right, wave.y);
        ctx.stroke();
        ctx.globalAlpha = fade * 0.95;
        ctx.strokeStyle = "#fff2a1";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(left, wave.y - 8);
        ctx.lineTo(right, wave.y - 8);
        ctx.moveTo(left, wave.y + 8);
        ctx.lineTo(right, wave.y + 8);
        ctx.stroke();
        ctx.fillStyle = "#fff4bd";
        ctx.beginPath();
        ctx.arc(left, wave.y, 6, 0, Math.PI * 2);
        ctx.arc(right, wave.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (const p of explosions) {
        ctx.save();
        if (difficultyMode === "easy") {
          // 쉬움 모드의 피격/파괴 연출은 폭발 대신 작은 파스텔 하트 팡으로 표현한다.
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.translate(p.x, p.y);
          const popColors = ["#e9a6bf", "#d8b3cb", "#e8c9a8", "#b9d8c6"];
          traceHeartPath(ctx, Math.max(5, p.radius * 2.6));
          ctx.fillStyle = popColors[Math.abs(Math.floor(p.x + p.y)) % popColors.length];
          ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,.72)";
          ctx.lineWidth = 0.8;
          ctx.stroke();
          ctx.restore();
          continue;
        }
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = p.alpha;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 0;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(1, p.radius * .42);
        ctx.beginPath();
        ctx.moveTo(p.x - p.dx * 1.8, p.y - p.dy * 1.8);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1, p.radius * .48), 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        ctx.save();
        ctx.globalAlpha = Math.max(0, t.alpha);
        ctx.fillStyle = t.color;
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";
        ctx.fillText(t.text, t.x, t.y);
        ctx.restore();
      }

      drawUI();

      drawDamageFlash();
      ctx.restore();
      drawEasyPlayfieldFrame();
    }

    function gameLoop() {
      if (gameScreen === "playing") {
        update();
        draw();
        syncOverlayActionButtons();
      }
      requestAnimationFrame(gameLoop);
    }

    restartBtn.addEventListener("click", () => {
      initGame();
      gameScreen = "playing";
      syncOverlayActionButtons();
    });

    // 플레이어/게임 변수는 준비하되, 실제 진행은 시작 버튼을 누를 때까지 멈춘다.
    initGame();
    showMainMenu();
    drawSpaceBackground();
    gameLoop(); 
  </script>
</body>
</html>
