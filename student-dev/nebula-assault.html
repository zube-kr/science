      wChargeLocked = false;

      const isMilestoneBoss = stage % 20 === 0;
      const bossSize = 100 + (stage * 2);
      
      let bossHp = stage <= 5 
        ? Math.floor(250 + (stage * 40)) 
        : Math.floor(350 + (stage * 120) + (player.bulletLevel * 15));

      if (stage > 10) {
        bossHp = Math.floor(bossHp * Math.pow(1.2, (stage - 10) / 2)); 
      }
      if (isMilestoneBoss) bossHp = Math.floor(bossHp * 1.12);
      bossHp = Math.max(1, Math.floor(bossHp * getDifficultySettings().bossHpMultiplier));
      const difficulty = getDifficultySettings();

      boss = {
        x: canvas.width / 2 - bossSize / 2,
        y: -bossSize, 
        targetY: 90,  
        width: bossSize,
        height: bossSize,
        hp: bossHp,
        maxHp: bossHp,
        speed: (2.0 + (stage * 0.08)) * difficulty.bossSpeedMultiplier,
        vx: (2.0 + (stage * 0.08)) * difficulty.bossSpeedMultiplier,
        color: stage > 10 ? "#e74c3c" : "#9b59b6", 
        point: stage * 300,
        scoreReward: Math.round(stage * 300 * getStageScoreMultiplier(stage)),
        introMode: true,
        // 공허 군주 경고 화면은 원본 사이렌 3회(약 6.8초)가 끝날 때까지 유지한다.
        warningBannerTimer: isMilestoneBoss ? Math.ceil(((2.179955 / 2.5) * 3 + 0.005 * 2) * 60) : 0,
        restTimer: Math.round((stage <= 5 ? 80 : 55) * difficulty.bossRestMultiplier),
        spiralAngle: 0,
        isMilestone: isMilestoneBoss,
        phase: 1,
        phaseTwoHp: isMilestoneBoss ? Math.floor(bossHp * 1.55) : 0,
        healCooldown: 300,
        healingTimer: 0,
        repairNode: null,
        repairCoreSpawnCount: 0,

        targetLaser: {
          active: false,
          timer: 0,
          trackDuration: Math.round(Math.max(30, 50 - stage * 1.5) * difficulty.bossWarningMultiplier),
          lockDuration: Math.round(25 * difficulty.bossWarningMultiplier),
          fireDuration: Math.max(12, Math.round(25 * difficulty.bossFireMultiplier)),
          angle: 0
        }
      };

      bossVerticalLasers = [];
      playBossWarningSound(isMilestoneBoss);
      triggerShake(isMilestoneBoss ? 22 : 18, isMilestoneBoss ? 42 : 35);
    }

    function spawnEnemy() {
      if (boss) return;

      const size = 28 + Math.random() * 20;
      const isGreen = Math.random() < 0.5;
      // 스테이지가 올라갈수록 적 함선의 장갑/에너지 등급이 시각적으로 진화한다.
      const visualTier = stage >= 21 ? 4 : stage >= 16 ? 3 : stage >= 11 ? 2 : stage >= 6 ? 1 : 0;
      const design = Math.floor(Math.random() * 3); // 요격기 / 날개형 / 중장갑 드론
      // 플레이어의 주 컬러(노랑/파랑/보라)와 겹치지 않도록 적 함대는
      // 적색·주황색·독성 녹색 계열로 통일한다. 스테이지 등급마다 명도와 채도를 올려 진화를 표현한다.
      const palettes = [
        [
          { hull: "#173b2e", plate: "#287a4b", accent: "#65f28a", core: "#d9ffe1" },
          { hull: "#45212a", plate: "#98384b", accent: "#ff5264", core: "#ffe1d8" }
        ],
        [
          { hull: "#47291d", plate: "#a34c2b", accent: "#ff8a3d", core: "#ffe6c9" },
          { hull: "#3c2020", plate: "#a83c32", accent: "#ff6247", core: "#fff0d9" }
        ],
        [
          { hull: "#203323", plate: "#416b36", accent: "#78c65a", core: "#f7d7a4" },
          { hull: "#421b23", plate: "#a52e3d", accent: "#f04f55", core: "#ffe0d5" }
        ],
        [
          { hull: "#381b23", plate: "#9e303c", accent: "#ff3c55", core: "#ffe4d4" },
          { hull: "#482519", plate: "#b9572d", accent: "#ff914d", core: "#fff0d9" }
        ],
        [
          // 지휘급 A: 짙은 녹색 선체 + 진홍 장갑이 주색, 라임은 작은 식별 표식으로만 사용
          { hull: "#172b20", plate: "#8f2938", accent: "#ff4052", core: "#ffc18a", secondary: "#b8e64b" },
          // 지휘급 B: 암적색 선체 + 깊은 녹색 장갑, 붉은 코어와 소량의 라임 장식
          { hull: "#351720", plate: "#28583a", accent: "#ff654b", core: "#ffd09a", secondary: "#a9d943" }
        ]
      ];
      const palette = palettes[visualTier][isGreen ? 0 : 1];
      const baseEnemyPoint = isGreen ? 10 : 20;

      const speedBoost = Math.max(0, (stage - 1) * 0.25);
      const baseSpeed = stage <= 3 ? (1.5 + Math.random() * 1.5) : (2 + Math.random() * 2);

      enemies.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        width: size,
        height: size,
        speed: (baseSpeed + speedBoost) * getDifficultySettings().enemySpeedMultiplier,
        color: palette.accent,
        hullColor: palette.hull,
        plateColor: palette.plate,
        coreColor: palette.core,
        secondaryColor: palette.secondary || null,
        visualTier,
        design,
        visualSeed: Math.random() * Math.PI * 2,
        displayName: difficultyMode === "easy"
          ? `${visualTier >= 4 ? "대장 " : visualTier >= 2 ? "튼튼 " : ""}${["몽실이", "토끼콩", "방울이"][design]}`
          : "",
        point: baseEnemyPoint,
        scoreReward: Math.round(baseEnemyPoint * getStageScoreMultiplier(stage)),
        // 16스테이지부터 일반 적은 기존 밸런스대로 기본 공격 2~3회에 파괴
        hp: stage >= 16 ? (Math.random() < 0.5 ? 2 : 3) : 1,
        maxHp: stage >= 16 ? 3 : 1,
        laserHitCooldown: 0
      });
    }

    function spawnItem(x, y, force = false) {
        if (!force && Math.random() > ITEM_DROP_CHANCE) return; 

        const rand = Math.random();
        let type = 'power';
        let color = "#FFD700";
        let text = 'P';

        if (force) {
            const isPower = Math.random() < 0.5;
            type = isPower ? 'power' : 'laserBooster';
            color = isPower ? "#FFD700" : "#7CFFFD";
            text = isPower ? 'P' : 'L';
        } else {
            if (rand >= 0.5 && rand < 0.85) {
                type = 'laserBooster';
                color = "#7CFFFD";
                text = 'L';
            } else if (rand >= 0.85) {
                type = 'heal';
                color = "#ff6b81"; 
                text = 'H';
            }
        }

        const size = 22;
        items.push({
            x: x - size/2,
            y: y - size/2,
            width: size,
            height: size,
            speed: force ? (Math.random() * 2 + 1) : 2, 
            type: type,
            color: color, 
            text: text
        });
    }

    // 20스테이지 클리어 보상: 윙맨은 플레이어의 탄환 패턴을 복제한다.
    // 쉬움에서도 발사 패턴/탄환 수/피해 효과는 다른 난이도와 동일하고,
    // 실제 외형만 draw()에서 하트 모양으로 바꿔 표시한다.
    function fireVolleyFrom(originX, originY, isWingman = false) {
      const isGoldenPulse = player.bulletLevel >= 25;
      const isAoe = player.bulletLevel >= 10 && !isGoldenPulse;
      const baseBulletRadius = isAoe
        ? Math.min(12 + (player.bulletLevel - 10) * 0.8, 24)
        : Math.min(10 + (player.bulletLevel - 1) * 0.8, 22);
      // 윙맨 탄환은 본체보다 작게 표시하되 강화 피해량은 공유한다.
      const bulletRadius = baseBulletRadius * (isWingman ? 0.68 : 1);

      const addBullet = (x, vx = 0, damageMultiplier = (isGoldenPulse ? 2 : 1), options = {}) => bullets.push({
        x, y: originY,
        radius: bulletRadius * (options.small ? 0.86 : 1),
        speed: 13,
        isAoe: options.directHit ? false : isAoe,
        isGoldenPulse: options.goldenPulse ?? isGoldenPulse,
        vx, isWingman,
        damageMultiplier
      });

      if (isGoldenPulse) {
        // Lv.25는 중앙 황금 파동탄, Lv.30부터 좌우 직격 보조탄도 추가된다.
        addBullet(originX, 0, 2);
        if (player.bulletLevel >= 30) {
          addBullet(originX - 15, -1.05, 1.15, { directHit: true, goldenPulse: false, small: true });
          addBullet(originX + 15, 1.05, 1.15, { directHit: true, goldenPulse: false, small: true });
        }
      } else if (player.bulletLevel >= 5 && player.bulletLevel < 10) {
        addBullet(originX - 12, -0.8);
        addBullet(originX + 12, 0.8);
      } else {
        addBullet(originX, 0);
      }
    }

    function shoot() {
      if (boss && boss.introMode) return; 

      const now = performance.now();
      // 탄환 종류가 바뀌는 구간의 발사 딜레이 증가는 의도된 밸런스다.
      // 같은 종류 안에서는 레벨이 오를수록 빨라지지만, Lv.10 광역탄과 Lv.25 황금 파동탄 전환 시에는 다시 느려진다.
      const isAoe = player.bulletLevel >= 10 && player.bulletLevel < 25;
      const goldenWaveCooldown = Math.max(180, 420 - (player.bulletLevel - 25) * 22);
      const currentCooldown = player.bulletLevel >= 25
        ? goldenWaveCooldown
        : (isAoe
          ? Math.max(60, 180 - (player.bulletLevel - 10) * 8)
          : Math.max(30, 180 - (player.bulletLevel - 1) * 12));

      // 본체는 기존 발사 주기를 그대로 유지한다.
      if (now - lastShot >= currentCooldown) {
        lastShot = now;
        playSound('shoot');
        fireVolleyFrom(player.x, player.y - player.radius, false);
      }

      // 윙맨 타이머는 본체와 독립적으로 검사해 실제 발사 간격이 정확히 1.4배가 된다.
      // 탄환 패턴/속도/피해량은 공유하고, 탄환 크기만 본체의 68%로 줄였다.
      if (stage >= 21 && now - lastWingmanShot >= currentCooldown * 1.4) {
        lastWingmanShot = now;
        for (const side of [-1, 1]) {
          const wingX = Math.max(16, Math.min(canvas.width - 16, player.x + side * 48));
          fireVolleyFrom(wingX, player.y - 10, true);
        }
      }
    }

    function triggerBulletAoE(x, y, damageMultiplier = 1, isWingman = false) {
      const bonusLevel = player.bulletLevel - 10;
      const aoeRadius = 120 + bonusLevel * 7;
      const laserSynergy = 1 + Math.max(0, player.laserLevel - 1) * 0.012;
      let damage = 2.5 + bonusLevel * 0.6;
      if (player.bulletLevel >= 15) damage *= 2;
      damage *= damageMultiplier * laserSynergy;

      if (!isWingman) playSound('explosion');

      if (shockwaves.length < 10) shockwaves.push({
        x, y,
        currentRadius: 10,
        maxRadius: aoeRadius,
        alpha: 0.8,
        color: player.bulletLevel >= 15 ? "rgba(162, 155, 254, 0.4)" : "rgba(255, 90, 0, 0.35)",
        borderColor: player.bulletLevel >= 15 ? "#a29bfe" : "#ff4757"
      });

      // 고레벨 광역탄은 연속 발동 빈도가 높으므로 파티클만 줄여 프레임 부하를 억제한다.
      // 폭발 범위, 피해량, 연쇄 공격은 기존 수치를 그대로 유지한다.
      const particleCount = isWingman ? 7 : (player.bulletLevel >= 15 ? 14 : 30 + bonusLevel * 2);
      createExplosion(x, y, player.bulletLevel >= 15 ? "#a29bfe" : "#ff9f1a", particleCount);
      triggerShake(8 + bonusLevel * 0.4, 12);
      addScoreText(x, y - 15, player.bulletLevel >= 15 ? "💥 과부하!" : "💥 폭발!", player.bulletLevel >= 15 ? "#a29bfe" : "#ff9f1a");

      if (boss && !boss.introMode) {
        if (boss.repairNode && circleRectCollision({ x, y, radius: aoeRadius }, boss.repairNode)) {
          damageBossRepairNode(damage * 2.5);
        }
        if (boss && circleRectCollision({ x, y, radius: aoeRadius }, boss)) {
          boss.hp -= damage * 3.5; 
          if (boss.hp <= 0) handleBossDefeat();
        }
      }

      for (let k = enemies.length - 1; k >= 0; k--) {
        const enemy = enemies[k];
        if (!enemy) continue;

        const enemyCircle = {
          x: enemy.x + enemy.width / 2,
          y: enemy.y + enemy.height / 2,
          radius: enemy.width / 2
        };

        if (circleCircleCollision({ x, y, radius: aoeRadius }, enemyCircle, 0)) {
          const earnedPoints = enemy.scoreReward ?? enemy.point;
          score += earnedPoints;
          if (!boss) checkStageProgress(enemy.point);

          createExplosion(enemyCircle.x, enemyCircle.y, enemy.color, 12);
          addScoreText(enemyCircle.x, enemyCircle.y, `+${earnedPoints.toLocaleString("ko-KR")}`, enemy.color);
          spawnItem(enemyCircle.x, enemyCircle.y);
          enemies.splice(k, 1);

          if (boss) break;
        }
      }

      if (player.bulletLevel >= 15) {
        triggerElectricity(x, y);
      }
    }

    // Lv.25 황금 파동: 명중 지점에서 좌우로 넓어지고 잠시 남아 반복 피해를 준다.
    // 파티클 대신 간단한 선/띠 렌더링과 낮은 빈도의 충돌 검사만 사용한다.
    function triggerGoldenWave(x, y, damageMultiplier = 1, isWingman = false, target = null, targetKind = "enemy") {
      const laserSynergy = 1 + Math.max(0, player.laserLevel - 1) * 0.012;
      const baseDamage = (1.2 + player.bulletLevel * 0.2) *
        (player.bulletLevel >= 15 ? 2 : 1) * damageMultiplier * laserSynergy;
      // Lv.30은 발사량이 늘어나므로 활성 파동을 조금 더 보존하되 상한을 둔다.
      const goldenWaveCap = player.bulletLevel >= 25 ? 48 : 12;
      if (goldenWaves.length >= goldenWaveCap) goldenWaves.shift();
      goldenWaves.push({
        x: Math.max(0, Math.min(canvas.width, x)),
        y: Math.max(0, Math.min(canvas.height, y)),
        reach: 8,
        maxReach: Math.max(x, canvas.width - x),
        speed: 14,
        age: 0,
        duration: 72,
        halfHeight: 82,
        damageInterval: 6,
        // Lv.25 탄환은 보스전에서도 체감되도록 파동 지속 피해를 크게 강화.
        enemyDamage: 5.5 * damageMultiplier * laserSynergy,
        bossDamage: baseDamage * 1.15,
        nodeDamage: baseDamage * 0.90,
        target,
        targetKind,
        isWingman
      });
      if (!isWingman) playSound('explosion');
    }

    function goldenWaveTouchesRect(wave, rect) {
      const left = Math.max(0, wave.x - wave.reach);
      const right = Math.min(canvas.width, wave.x + wave.reach);
      return rect.x <= right && rect.x + rect.width >= left &&
        rect.y <= wave.y + wave.halfHeight &&
        rect.y + rect.height >= wave.y - wave.halfHeight;
    }

    function defeatEnemyWithGoldenWave(enemy) {
      const enemyIndex = enemies.indexOf(enemy);
      if (enemyIndex < 0) return false;
      const ex = enemy.x + enemy.width / 2;
      const ey = enemy.y + enemy.height / 2;
      enemies.splice(enemyIndex, 1);
      const earnedPoints = enemy.scoreReward ?? enemy.point;
      score += earnedPoints;
      if (!boss) checkStageProgress(enemy.point);
      createExplosion(ex, ey, enemy.color, 6);
      addScoreText(ex, ey, `+${earnedPoints.toLocaleString("ko-KR")}`, enemy.color);
      spawnItem(ex, ey);
      return true;
    }

    function updateGoldenWaves() {
      for (let i = goldenWaves.length - 1; i >= 0; i--) {
        const wave = goldenWaves[i];
        if (!wave) continue; // 스테이지/보스 전환으로 배열이 비워진 경우
        wave.age++;
        wave.reach = Math.min(wave.maxReach, wave.reach + wave.speed);

        if (wave.age % wave.damageInterval === 0) {
          // 명중한 원래 대상에는 파동이 사라질 때까지 지속 피해를 준다.
          if (wave.targetKind === "enemy" && wave.target) {
            const targetIndex = enemies.indexOf(wave.target);
            if (targetIndex >= 0) {
              wave.target.hp = (wave.target.hp ?? 1) - wave.enemyDamage;
              if (wave.target.hp <= 0) {
                defeatEnemyWithGoldenWave(wave.target);
                if (boss) return; // 적 처치 점수로 보스 스테이지가 시작됨
              }
            }
          } else if (wave.targetKind === "node" && boss && boss.repairNode === wave.target) {
            damageBossRepairNode(wave.nodeDamage, true);
          } else if (wave.targetKind === "boss" && boss === wave.target && !boss.introMode) {
            boss.hp -= wave.bossDamage;
            if (boss.hp <= 0) {
              handleBossDefeat();
              return; // 보스 형태/스테이지 전환 후 이전 파동은 종료
            }
          }

          // 좌우로 퍼진 파동 띠에 닿은 다른 적도 반복 피해를 받는다.
          for (let j = enemies.length - 1; j >= 0; j--) {
            const enemy = enemies[j];
            if (!enemy || enemy === wave.target || !goldenWaveTouchesRect(wave, enemy)) continue;
            enemy.hp = (enemy.hp ?? 1) - wave.enemyDamage;
            if (enemy.hp <= 0) {
              defeatEnemyWithGoldenWave(enemy);
              if (boss) return;
            }
          }

          // 원래 명중 대상이 아닌 보스/수리 코어도 파동 띠에 들어오면 피해를 받는다.
          if (wave.targetKind !== "node" && boss && !boss.introMode) {
            if (boss.repairNode && goldenWaveTouchesRect(wave, boss.repairNode)) {
              damageBossRepairNode(wave.nodeDamage, true);
            } else if (wave.targetKind !== "boss" && goldenWaveTouchesRect(wave, boss)) {
              boss.hp -= wave.bossDamage;
              if (boss.hp <= 0) {
                handleBossDefeat();
                return;
              }
            }
          }
        }

        if (wave.age >= wave.duration) goldenWaves.splice(i, 1);
      }
    }

    function createExplosion(x, y, color, count = 18) {
      if (difficultyMode === "easy") count = Math.min(count, 8);
      // Keep a hard ceiling so large chains/boss effects cannot flood the frame.
      // 고레벨 광역 공격 구간은 활성 파티클 총량도 낮춰 프레임 드롭을 방지한다.
      const particleCap = player && player.bulletLevel >= 15 ? 100 : 180;
      const allowed = Math.max(0, Math.min(count, particleCap - explosions.length));
      for (let i = 0; i < allowed; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 5;
        explosions.push({
          x, y,
          dx: Math.cos(angle) * speed,
          dy: Math.sin(angle) * speed,
          radius: 2 + Math.random() * 4,
          alpha: 1, color
        });
      }
    }

    function resetChargeStatus() {
      wChargeProgress = 0;
      wChargeLocked = false;
    }

    function addScoreText(x, y, text, color) {
      floatingTexts.push({ x, y, text, color, vy: 1.2, alpha: 1 });
    }

    function triggerShake(power = 5, time = 10) {
      shakePower = power;
      shakeTime = time;
    }

    function fireLaser() {
      laser.active = true;
      laser.x = player.x;
      laser.frames = laser.maxFrames;
      
      resetChargeStatus(); 
      wChargeLocked = true; 

      playSound('laser');
      const easyLaserPalette = ["#f0a9c2", "#e7c3a2", "#b6d4c1"];
      const laserColor = difficultyMode === "easy"
        ? easyLaserPalette[player.laserLevel >= 25 ? 2 : player.laserLevel >= 10 ? 1 : 0]
        : (player.laserLevel >= 25 ? "#ffd34d" : (player.laserLevel >= 15 ? "#a29bfe" : "#7CFFFD"));
      // 쉬움에서는 작은 하트 팡 연출만 남기고 화면 흔들림도 줄인다.
      const laserBurstParticles = difficultyMode === "easy" ? 5 : (player.laserLevel >= 25 ? 12 : 25);
      createExplosion(player.x, player.y - 30, laserColor, laserBurstParticles);
      triggerShake(difficultyMode === "easy" ? 1 : 10, difficultyMode === "easy" ? 2 : 18);
    }

    function getLaserBeams() {
      const beams = [];
      const length = 1500;
      // Lv.25 황금 레이저는 단일 집중 빔: 시각 폭과 실제 피격 폭을 일치시킨다.
      const currentWidth = difficultyMode === "easy"
        ? laser.width * 1.7
        : (player.laserLevel >= 25 ? laser.width * 2.75 : (player.laserLevel >= 5 ? laser.width * 2 : laser.width));
      const spreadAngle = 0.06;

      const addShipBeams = (px, py, isWingman = false) => {
        // 윙맨 빔은 본체보다 폭과 피격 판정을 함께 줄인다.
        const beamWidth = currentWidth * (isWingman ? (difficultyMode === "easy" ? 0.38 : (player.laserLevel >= 25 ? 0.30 : 0.38)) : 1);
        beams.push({
          x1: px, y1: py,
          x2: px, y2: py - length,
          angle: -Math.PI / 2,
          width: beamWidth,
          isWingman
        });

        // 윙맨은 강화 레벨에서도 중앙 빔 하나만 사용해 충돌/렌더링 계산을 줄인다.
        // Lv.25 황금 레이저에서는 좌우 분기 빔을 생성하지 않는다.
        if (difficultyMode !== "easy" && player.laserLevel >= 10 && player.laserLevel < 25 && !isWingman) {
          beams.push({
            x1: px - 16, y1: py,
            x2: px - 16 + Math.cos(-Math.PI / 2 - spreadAngle) * length,
            y2: py + Math.sin(-Math.PI / 2 - spreadAngle) * length,
            angle: -Math.PI / 2 - spreadAngle,
            width: beamWidth,
            isWingman
          });
          beams.push({
            x1: px + 16, y1: py,
            x2: px + 16 + Math.cos(-Math.PI / 2 + spreadAngle) * length,
            y2: py + Math.sin(-Math.PI / 2 + spreadAngle) * length,
            angle: -Math.PI / 2 + spreadAngle,
            width: beamWidth,
            isWingman
          });
        }
      };

      addShipBeams(player.x, player.y - player.radius);

      // Lv.30부터 21스테이지 이후 합류한 윙맨도 얇은 보조 빔을 발사한다.
      // 좌우 각도를 8도로 좁혀 중앙 솔라 빔과 자연스럽게 묶이도록 한다.
      if (player.laserLevel >= 30 && stage >= 21) {
        for (const side of [-1, 1]) {
          const wingX = Math.max(16, Math.min(canvas.width - 16, player.x + side * 48));
          const wingY = player.y - 11;
          const wingAngle = -Math.PI / 2 + side * (Math.PI / 22.5); // 좌우로 각각 8도
          beams.push({
            x1: wingX, y1: wingY,
            x2: wingX + Math.cos(wingAngle) * length,
            y2: wingY + Math.sin(wingAngle) * length,
            angle: wingAngle,
            width: laser.width * 0.78,
            isWingman: true,
            damageMultiplier: 0.45
          });
        }
        return beams;
      }

      // Lv.25~29의 일반 난이도에서는 플레이어의 단일 집중 빔만 사용한다.
      if (player.laserLevel >= 25 && difficultyMode !== "easy") return beams;

      if (stage >= 21) {
        for (const side of [-1, 1]) {
          const wingX = Math.max(16, Math.min(canvas.width - 16, player.x + side * 48));
          addShipBeams(wingX, player.y - 11, true);
        }
      }

      return beams;
    }

    function executeBossAttack() {
      const bx = boss.x + boss.width / 2;
      const by = boss.y + boss.height / 2;
      
      const difficulty = getDifficultySettings();
      const bulletSpeed = (2.6 + (stage * 0.15)) * difficulty.bossBulletSpeedMultiplier;
      const projectileScale = difficulty.bossProjectileCountMultiplier;
      const isSanctuaryBoss = boss.isMilestone && boss.phase === 2;
      // VOID SANCTUARY는 기존 1/6 선택보다 드물게, 약 1/10 확률로 등장한다.
      let pattern = isSanctuaryBoss
        ? (Math.random() < 0.10 ? 5 : Math.floor(Math.random() * 5))
        : Math.floor(Math.random() * (boss.isMilestone ? 5 : (stage <= 4 ? 2 : 4)));
      // 수리 코어가 활성/임박한 동안에는 광역 패턴을 건너뛴다.
      if (isSanctuaryBoss && pattern === 5 && (boss.repairNode || boss.healCooldown <= 90)) {
        pattern = Math.floor(Math.random() * 5);
      }

      switch (pattern) {
        case 0: {
          playBossAttackSound("spread");
          const baseBulletCount = 6 + Math.min(6, Math.floor(stage / 2));
          const bulletCount = Math.max(1, Math.ceil(baseBulletCount * projectileScale));
          const spreadAngle = Math.PI * 0.65;
          const startAngle = Math.PI / 2 - spreadAngle / 2;

          for (let i = 0; i < bulletCount; i++) {
            const angle = bulletCount === 1
              ? Math.PI / 2
              : startAngle + (spreadAngle * (i / (bulletCount - 1)));
            bossBullets.push({
              x: bx, y: by,
              vx: Math.cos(angle) * bulletSpeed,
              vy: Math.sin(angle) * bulletSpeed,
              radius: 12, color: "#ff4757"
            });
          }
          break;
        }

        case 1: {
          playBossAttackSound("spiral");
          const baseSpokeCount = stage >= 15 ? 8 : (stage >= 10 ? 6 : 4);
          const spokeCount = Math.max(1, Math.ceil(baseSpokeCount * projectileScale));
          boss.spiralAngle += 0.35;
          
          for (let i = 0; i < spokeCount; i++) {
            const angle = boss.spiralAngle + (Math.PI * 2 / spokeCount) * i;
            bossBullets.push({
              x: bx, y: by,
              vx: Math.cos(angle) * (bulletSpeed * 0.8),
              vy: Math.sin(angle) * (bulletSpeed * 0.8),
              radius: 11, color: "#e056fd"
            });
          }
          break;
        }

        case 2: {
          playBossAttackSound("charge");
          const baseLaserCount = stage >= 15 ? 3 : (stage >= 10 ? 2 : 1);
          const laserCount = Math.max(1, Math.ceil(baseLaserCount * projectileScale));
          for (let c = 0; c < laserCount; c++) {
            bossVerticalLasers.push({
              x: 50 + Math.random() * (canvas.width - 100),
              width: 42,
              timer: 0,
              warnDuration: Math.round(Math.max(40, 65 - stage * 2) * difficulty.bossWarningMultiplier),
              fireDuration: Math.max(12, Math.round(22 * difficulty.bossFireMultiplier))
            });
          }
          break;
        }

        case 3: {
          if (!boss.targetLaser.active) {
            playBossAttackSound("charge");
            boss.targetLaser.active = true;
            boss.targetLaser.timer = 0;
          }
          break;
        }

        case 4: {
          playBossAttackSound("crossfire");
          // 20스테이지 보스 전용: 양쪽 장갑에서 교차 탄막을 발사
          const origins = [boss.x + boss.width * 0.18, boss.x + boss.width * 0.82];
          const crossfire = [];
          for (let side = 0; side < origins.length; side++) {
            for (let n = -2; n <= 2; n++) {
              crossfire.push({
                x: origins[side],
                angle: Math.PI / 2 + n * 0.19 + (side === 0 ? -0.12 : 0.12)
              });
            }
          }
          const crossfireCount = Math.max(1, Math.ceil(crossfire.length * projectileScale));
          for (let i = 0; i < crossfireCount; i++) {
            const pick = crossfire[Math.floor((i + 0.5) * crossfire.length / crossfireCount)];
            bossBullets.push({
              x: pick.x, y: by + 8,
              vx: Math.cos(pick.angle) * bulletSpeed * 0.95,
              vy: Math.sin(pick.angle) * bulletSpeed * 0.95,
              radius: 10,
              color: boss.phase === 2 ? "#75f4ff" : "#c58aff"
            });
          }
          break;
        }

        case 5: {
          // 2페이지 전용: 안전 구역 한 곳을 제외한 전장을 광역 레이저로 휩쓴다.
          const safeWidth = difficulty.bossSafeWidth;
          const margin = safeWidth / 2 + 18;
          playBossAttackSound("sanctuary");
          bossSafeZonePattern = {
            safeX: margin + Math.random() * (canvas.width - margin * 2),
            safeWidth,
            timer: 0,
            warnDuration: Math.round(105 * difficulty.bossWarningMultiplier),
            fireDuration: Math.max(55, Math.round(110 * difficulty.bossFireMultiplier))
          };
          // 광역 공격 시작과 동시에 기존 탄막과 레이저를 정리한다.
          bossBullets.length = 0;
          bossVerticalLasers.length = 0;
          boss.targetLaser.active = false;
          boss.restTimer = 0;
          playSound('bigExplosion');
          triggerShake(18, 28);
          addScoreText(canvas.width / 2, 390, "공허의 성역 // 안전 구역을 찾아라!", "#75f4ff");
          break;
        }
      }

      const baseRestTimer = (boss.isMilestone && boss.phase === 2 && pattern === 5)
        ? 165
        : (stage <= 5 ? 80 : Math.max(45, 95 - (stage * 3)));
      boss.restTimer = Math.round(baseRestTimer * difficulty.bossRestMultiplier);

      if (!bossSafeZonePattern && stage >= 10 && (boss.hp / boss.maxHp) <= 0.4 && Math.random() < (0.5 * difficulty.extraBossLaserChanceMultiplier)) {
         bossVerticalLasers.push({
            x: player.x,
            width: 38,
            timer: 0,
            warnDuration: Math.round(35 * difficulty.bossWarningMultiplier),
            fireDuration: Math.max(10, Math.round(18 * difficulty.bossFireMultiplier))
         });
      }
    }

    function update() {
      if (gameOver || gamePaused) return;

      if (wingmanNoticeTimer > 0) wingmanNoticeTimer--;
      if (player.invulnerableTimer > 0) player.invulnerableTimer--;
      const difficulty = getDifficultySettings();
      if (difficulty.regenFrames > 0 && lives < difficulty.maxHealth) {
        healthRegenTimer++;
        if (healthRegenTimer >= difficulty.regenFrames) {
          lives = Math.min(difficulty.maxHealth, lives + 1);
          healthRegenTimer = 0;
        }
      } else {
        healthRegenTimer = 0;
      }
      if (damageFlashTimer > 0) damageFlashTimer--;
      if (player.dashCooldown > 0) player.dashCooldown--;
      if (player.dashTimer > 0) {
        player.dashTimer--;
        if (dashTrails.length < 35) dashTrails.push({ x: player.x, y: player.y, radius: player.radius, alpha: 0.6 });
      }

      if (keys["KeyA"]) player.vx -= player.accel;
      if (keys["KeyD"]) player.vx += player.accel;
      
      if (player.dashTimer <= 0) {
        if (player.vx > player.maxSpeed) player.vx = player.maxSpeed;
        if (player.vx < -player.maxSpeed) player.vx = -player.maxSpeed;
      }

      if (!keys["KeyA"] && !keys["KeyD"]) {
        player.vx *= player.friction;
        if (Math.abs(player.vx) < 0.05) player.vx = 0;
      }
      player.x += player.vx;

      if (player.x < player.radius) { player.x = player.radius; player.vx = 0; }
      if (player.x > canvas.width - player.radius) { player.x = canvas.width - player.radius; player.vx = 0; }

      if (keys["Space"]) shoot();


      if (laser.active) {
        laser.x = player.x; 
        laser.frames--;
        if (laser.frames <= 0) {
          laser.active = false;
          wChargeLocked = false; 
        }
      } else if (!wChargeLocked) {
        if (boss && boss.introMode) {
          wChargeProgress = 0;
        } else if (keys["KeyW"]) {
          const currentChargeTime = Math.max(300, 2000 - (player.laserLevel - 1) * 110);
          const chargeAmountPerFrame = 1000 / 60 / currentChargeTime;
          wChargeProgress = Math.min(1, wChargeProgress + chargeAmountPerFrame);
          if (wChargeProgress >= 1) fireLaser();
        } else {
          wChargeProgress = Math.max(0, wChargeProgress - 0.005);
        }
      }

      if (boss) {
        const bx = boss.x + boss.width / 2;
        const by = boss.y + boss.height / 2;

        if (boss.introMode) {
          if (boss.isMilestone && boss.warningBannerTimer > 0) {
            boss.warningBannerTimer--;
          } else {
            boss.y += 2.0;
          }
          if (boss.y >= boss.targetY) {
            boss.y = boss.targetY;
            boss.introMode = false;
            // 2페이지 착지 후 첫 수리 코어가 오래 기다리지 않도록 1.5초로 단축
            if (boss.isMilestone && boss.phase === 2) {
              boss.healCooldown = Math.min(boss.healCooldown, 90);
            }
          }
        } else {
          boss.x += boss.vx;
          if (boss.x <= 0 || boss.x + boss.width >= canvas.width) {
            boss.vx *= -1;
          }
          
          const isLaserRunning = boss.targetLaser.active;
          const isSanctuaryRunning = !!bossSafeZonePattern;

          // 광역 공격 중에는 다른 공격을 시작하지 않고 공격 쿨다운도 멈춘다.
          if (isSanctuaryRunning) {
            // 전용 패턴 종료 후 휴식 시간은 종료 처리부에서 설정한다.
          } else if (boss.restTimer > 0) {
            boss.restTimer--;
          } else if (!isLaserRunning) {
            executeBossAttack();
          }

          if (boss.targetLaser.active) {
            boss.targetLaser.timer++;
            
            const trackEnd = boss.targetLaser.trackDuration; 
            const lockEnd = trackEnd + boss.targetLaser.lockDuration; 
            const fireEnd = lockEnd + boss.targetLaser.fireDuration;

            if (boss.targetLaser.timer <= trackEnd) {
              boss.targetLaser.angle = Math.atan2(player.y - by, player.x - bx);
            } 
            else if (boss.targetLaser.timer <= lockEnd) {
            }
            else if (boss.targetLaser.timer === lockEnd + 1) {
              playBossAttackSound("beam");
            }
            else if (boss.targetLaser.timer <= fireEnd) {
              const targetEndX = bx + Math.cos(boss.targetLaser.angle) * 1500;
              const targetEndY = by + Math.sin(boss.targetLaser.angle) * 1500;

              if (lineCircleCollision(bx, by, targetEndX, targetEndY, player.x, player.y, player.hitRadius + 4)) {
                damagePlayer();
              }
            } 
            else {
              boss.targetLaser.active = false;
            }
          }
        }

        // 20스테이지 보스 2페이지: 수리 코어가 살아 있는 동안 주기적으로 체력을 회복
        if (boss.isMilestone && boss.phase === 2 && !boss.introMode) {
          // VOID SANCTUARY 진행 중에는 코어 생성/회복 연출을 잠시 멈춰
          // 광역 레이저와 동시에 표시되지 않게 한다.
          const sanctuaryBusy = !!bossSafeZonePattern;
          if (boss.repairNode && !sanctuaryBusy) {
            boss.healingTimer--;
            if (boss.healingTimer > 0 && boss.healingTimer % 30 === 0) {
              const healAmount = Math.max(1, Math.floor(boss.maxHp * 0.018));
              boss.hp = Math.min(boss.maxHp, boss.hp + healAmount);
              addScoreText(bx, by - 52, `+${healAmount} 회복`, "#75f4ff");
              createExplosion(boss.repairNode.x + boss.repairNode.width / 2, boss.repairNode.y + boss.repairNode.height / 2, "#75f4ff", 4);
            }
            if (boss.healingTimer <= 0 && boss.repairNode) {
              // 코어를 제한 시간 안에 파괴하지 못하면 회복 주기가 끝나고 다음 주기를 준비
              boss.repairNode = null;
              boss.healCooldown = 300;
              addScoreText(bx, by - 52, "수리 주기 완료", "#ffb86b");
            }
          } else if (!sanctuaryBusy && boss.repairCoreSpawnCount < 3) {
            boss.healCooldown--;
            if (boss.healCooldown <= 0) {
              const coreSize = 68;
              const coreHp = Math.max(1, Math.floor((260 + Math.floor(stage * 8)) * difficulty.bossCoreHpMultiplier));
              boss.repairNode = {
                x: 0,
                y: 0,
                width: coreSize,
                height: coreSize,
                hp: coreHp,
                maxHp: coreHp
              };
              positionBossRepairNode();
              boss.repairCoreSpawnCount++;
              boss.healingTimer = 240;
              addScoreText(boss.repairNode.x + coreSize / 2, boss.repairNode.y - 18, "수리 핵 가동!", "#75f4ff");
              playSound('item');
            }
          }
        }

        const playerBox = {
          x: player.x - player.hitRadius,
          y: player.y - player.hitRadius,
          width: player.hitRadius * 2,
          height: player.hitRadius * 2
        };
        if (rectRectCollision(boss, playerBox)) {
          if (difficultyMode === "easy" || difficultyMode === "normal") {
            damagePlayer();
          } else {
            lives = 0;
            gameOver = true;
            restartBtn.style.display = "block";
          }
        }
      }

      if (bossSafeZonePattern && boss && boss.isMilestone && boss.phase === 2) {
        const safe = bossSafeZonePattern;
        safe.timer++;
        if (safe.timer === safe.warnDuration) playBossAttackSound("widebeam", safe.fireDuration / 60);
        if (safe.timer >= safe.warnDuration && safe.timer < safe.warnDuration + safe.fireDuration) {
          const outsideSafeZone = Math.abs(player.x - safe.safeX) > (safe.safeWidth / 2 - player.hitRadius * 0.25);
          if (outsideSafeZone) damagePlayer();
        }
        if (safe.timer >= safe.warnDuration + safe.fireDuration) {
          bossSafeZonePattern = null;
          // 광역 공격 직후 다른 공격이 연달아 나오지 않도록 충분히 쉰다.
          if (boss) boss.restTimer = Math.round(210 * getDifficultySettings().bossRestMultiplier);
        }
      }

      if (!bossSafeZonePattern) for (let i = bossVerticalLasers.length - 1; i >= 0; i--) {
        const vl = bossVerticalLasers[i];
        vl.timer++;

        if (vl.timer === vl.warnDuration) playBossAttackSound("beam");
        if (vl.timer >= vl.warnDuration && vl.timer < vl.warnDuration + vl.fireDuration) {
          if (Math.abs(player.x - vl.x) < (vl.width / 2 + player.hitRadius)) {
            damagePlayer();
          }
        }

        if (vl.timer >= vl.warnDuration + vl.fireDuration) {
          bossVerticalLasers.splice(i, 1);
        }
      }

      if (!bossSafeZonePattern) for (let i = bossBullets.length - 1; i >= 0; i--) {
        let bb = bossBullets[i];
        bb.x += bb.vx;
        bb.y += bb.vy;

        if (circleCircleCollision(bb, player, player.hitRadius)) {
           bossBullets.splice(i, 1);
           damagePlayer();
           continue;
        }

        if (bb.y > canvas.height + 30 || bb.y < -30 || bb.x < -30 || bb.x > canvas.width + 30) {
            bossBullets.splice(i, 1);
        }
      }

      if (!boss) {
        spawnTimer++;
        const spawnInterval = Math.max(8, baseSpawnInterval / Math.pow(1.3, Math.floor((stage - 1) / 2)));
        
        if (spawnTimer >= spawnInterval) {
          spawnTimer = 0;
          // 현재 스테이지에서 가능한 총알/레이저 레벨업을 모두 마치면
          // 적을 한 번에 더 많이 투입해 진행 속도를 높인다.
          const upgradesComplete = player.bulletLevel >= MAX_BULLET_LEVEL &&
                                   player.laserLevel >= MAX_LASER_LEVEL;
          const enemyCount = upgradesComplete ? 2 : 1;
          const enemyCap = upgradesComplete ? 42 : 32;
          for (let n = 0; n < enemyCount && enemies.length < enemyCap; n++) {
            spawnEnemy();
          }
        }
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].x += bullets[i].vx || 0;
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < -20) bullets.splice(i, 1);
      }

      for (let i = items.length - 1; i >= 0; i--) {
          const item = items[i];
          item.y += item.speed;
          const itemCircle = {
            x: item.x + item.width / 2,
            y: item.y + item.height / 2,
            radius: item.width / 2
          };

          // 본체뿐 아니라 21스테이지 이후 합류하는 좌우 윙맨도 아이템을 획득할 수 있다.
          // 무기 레벨은 편대가 공유하므로 윙맨이 먹은 강화 아이템도 전체 공격에 반영된다.
          let collector = null;
          if (circleCircleCollision(itemCircle, player, player.radius)) {
            collector = { x: player.x, y: player.y, isWingman: false };
          } else if (stage >= 21) {
            for (const side of [-1, 1]) {
              const wingX = Math.max(16, Math.min(canvas.width - 16, player.x + side * 48));
              const wingBody = { x: wingX, y: player.y + 5 };
              // 화면에 그려지는 작은 기체 크기에 맞춘 전용 획득 판정 반경
              if (circleCircleCollision(itemCircle, wingBody, 12)) {
                collector = { x: wingX, y: player.y + 5, isWingman: true };
                break;
              }
            }
          }

          if (collector) {
              let text = '';
              let color = item.color;
              const sourceLabel = collector.isWingman ? '윙맨 ' : '';

              playSound('item');

              if (item.type === 'power') {
                  if (player.bulletLevel < MAX_BULLET_LEVEL) {
                      player.bulletLevel++;
                      text = `${sourceLabel}화력 강화! (레벨 ${player.bulletLevel})`;
                  } else {
                      const bonusPoints = Math.round(100 * getStageScoreMultiplier(stage));
                      score += bonusPoints;
                      if (!boss) checkStageProgress(100);
                      text = collector.isWingman ? `윙맨 +${bonusPoints.toLocaleString("ko-KR")} [최대]` : `+${bonusPoints.toLocaleString("ko-KR")} [최대 레벨]`;
                  }
              } else if (item.type === 'laserBooster') {
                  if (player.laserLevel < MAX_LASER_LEVEL) {
                      player.laserLevel++;
                      text = `${sourceLabel}광선 강화! (레벨 ${player.laserLevel})`;
                  } else {
                      const bonusPoints = Math.round(100 * getStageScoreMultiplier(stage));
                      score += bonusPoints;
                      if (!boss) checkStageProgress(100);
                      text = collector.isWingman ? `윙맨 +${bonusPoints.toLocaleString("ko-KR")} [최대]` : `+${bonusPoints.toLocaleString("ko-KR")} [최대 레벨]`;
                  }
              } else if (item.type === 'heal') {
                  if (lives < getDifficultySettings().maxHealth) {
                      lives = Math.min(getDifficultySettings().maxHealth, lives + 1);
                      text = collector.isWingman ? '윙맨 체력 +1' : '회복 ❤️ +1';
                  } else {
                      const bonusPoints = Math.round(200 * getStageScoreMultiplier(stage));
                      score += bonusPoints;
                      text = collector.isWingman ? `윙맨 +${bonusPoints.toLocaleString("ko-KR")} [최대]` : `+${bonusPoints.toLocaleString("ko-KR")} (최대 체력)`;
                  }
              }

              createExplosion(itemCircle.x, itemCircle.y, color, 12);
              addScoreText(collector.x, collector.y - 40, text, color);
              triggerShake(3, 5);
              items.splice(i, 1);
              continue;
          }
          if (item.y > canvas.height + 20) items.splice(i, 1);
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (!b) continue;

        let bulletDmg = (1.2 + player.bulletLevel * 0.2) * (b.damageMultiplier ?? 1);
        if (player.bulletLevel >= 15) bulletDmg *= 2;
        // 레이저 강화 레벨은 기본 탄환의 공격력에도 소폭 보너스를 준다.
        bulletDmg *= 1 + Math.max(0, player.laserLevel - 1) * 0.012;

        if (boss && !boss.introMode && boss.repairNode && circleRectCollision(b, boss.repairNode)) {
          if (b.isGoldenPulse) triggerGoldenWave(b.x, b.y, b.damageMultiplier ?? 1, !!b.isWingman, boss.repairNode, "node");
          else if (b.isAoe) triggerBulletAoE(b.x, b.y, b.damageMultiplier ?? 1, !!b.isWingman);
          else {
            damageBossRepairNode(bulletDmg);
            playSound('explosion');
          }
          bullets.splice(i, 1);
          continue;
        }

        if (boss && circleRectCollision(b, boss)) {
          if (!boss.introMode) {
            if (b.isGoldenPulse) {
              triggerGoldenWave(b.x, b.y, b.damageMultiplier ?? 1, !!b.isWingman, boss, "boss");
            } else if (b.isAoe) {
              triggerBulletAoE(b.x, b.y, b.damageMultiplier ?? 1, !!b.isWingman);
            } else {
              boss.hp -= bulletDmg; 
              playSound('explosion');
              createExplosion(b.x, b.y, "#fff", 5);
              triggerShake(2, 2);
              
              if (difficultyMode !== "easy" && player.bulletLevel >= 15 && player.bulletLevel < 25) {
                triggerElectricity(b.x, b.y);
              }

              if (boss && boss.hp <= 0) handleBossDefeat();
            }
          } else {
            createExplosion(b.x, b.y, "#fff", 3);
          }
          bullets.splice(i, 1);
          continue; 
        }

        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          if (!enemy) continue;

          if (circleRectCollision(b, enemy)) {
            const ex = enemy.x + enemy.width / 2;
            const ey = enemy.y + enemy.height / 2;

            if (b.isGoldenPulse) {
              triggerGoldenWave(b.x, b.y, b.damageMultiplier ?? 1, !!b.isWingman, enemy, "enemy");
            } else if (b.isAoe) {
              triggerBulletAoE(b.x, b.y, b.damageMultiplier ?? 1, !!b.isWingman);
            } else {
              enemy.hp = (enemy.hp ?? 1) - bulletDmg;
              if (enemy.hp <= 0) {
                const earnedPoints = enemy.scoreReward ?? enemy.point;
                score += earnedPoints;
                if (!boss) checkStageProgress(enemy.point);

                playSound('explosion');
                createExplosion(ex, ey, enemy.color);
                addScoreText(ex, ey, `+${earnedPoints.toLocaleString("ko-KR")}`, enemy.color);
                triggerShake(4, 8);
                spawnItem(ex, ey);
                enemies.splice(j, 1);

                if (difficultyMode !== "easy" && player.bulletLevel >= 15 && player.bulletLevel < 25) {
                  triggerElectricity(ex, ey);
                }
              } else {
                // 피격 시 짧은 타격 표시만 추가하고 적은 계속 진행
                createExplosion(ex, ey, "#ffffff", 3);
                playSound('explosion');
              }
            }

            bullets.splice(i, 1);
            break;
          }
        }
      }

      if (laser.active) {
        const beams = getLaserBeams();

        let laserDmg = (1.0 + player.laserLevel * 0.2);
        if (player.laserLevel >= 15) laserDmg *= 2;
        // SOLAR BEAM은 Lv.25부터 보스전 핵심 무기가 되도록 기본 피해량을 크게 강화한다.
        // Lv.25 배율 x4.0, Lv.30 배율 x6.25로 레벨이 오를수록 추가 상승한다.
        if (player.laserLevel >= 25) {
          laserDmg *= 4.0 + (player.laserLevel - 25) * 0.45;
        }

        if (boss && !boss.introMode) {
          let repairCoreBlocksBeam = false;
          if (boss.repairNode) {
            const node = boss.repairNode;
            const nodeCenterX = node.x + node.width / 2;
            const nodeCenterY = node.y + node.height / 2;
            const nodeRadius = node.width * 0.48;
            for (const beam of beams) {
              if (lineCircleCollision(beam.x1, beam.y1, beam.x2, beam.y2, nodeCenterX, nodeCenterY, nodeRadius + beam.width / 2)) {
                repairCoreBlocksBeam = true;
                damageBossRepairNode(laserDmg * (beam.damageMultiplier || 1));
                break;
              }
            }
          }

          if (!repairCoreBlocksBeam && boss) {
            const bossCenter = {
              x: boss.x + boss.width / 2,
              y: boss.y + boss.height / 2,
              radius: Math.min(boss.width, boss.height) / 2
            };

            for (const beam of beams) {
              if (lineCircleCollision(beam.x1, beam.y1, beam.x2, beam.y2, bossCenter.x, bossCenter.y, bossCenter.radius + beam.width / 2)) {
                boss.hp -= laserDmg * (beam.damageMultiplier || 1);
                triggerShake(4, 2);
                const laserColor = player.laserLevel >= 25 ? "#ffd34d" : (player.laserLevel >= 15 ? "#a29bfe" : "#7CFFFD");
                createExplosion(boss.x + Math.random() * boss.width, boss.y + boss.height, laserColor, 3);
                if (boss.hp <= 0) {
                  handleBossDefeat();
                  break;
                }
              }
            }
          }
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemy = enemies[i];
          if (!enemy) continue;

          const enemyCenter = {
            x: enemy.x + enemy.width / 2,
            y: enemy.y + enemy.height / 2,
            radius: enemy.width / 2
          };

          let hitByLaser = false;
          for (const beam of beams) {
            if (lineCircleCollision(beam.x1, beam.y1, beam.x2, beam.y2, enemyCenter.x, enemyCenter.y, enemyCenter.radius + beam.width / 2)) {
              hitByLaser = true;
              break;
            }
          }

          if (hitByLaser && (enemy.laserHitCooldown || 0) <= 0) {
            enemy.hp = (enemy.hp ?? 1) - 1;
            enemy.laserHitCooldown = 12;
            playSound('explosion');
            const laserColor = player.laserLevel >= 25 ? "#ffd34d" : (player.laserLevel >= 15 ? "#a29bfe" : "#7CFFFD");
            if (enemy.hp <= 0) {
              const earnedPoints = enemy.scoreReward ?? enemy.point;
              score += earnedPoints;
              if (!boss) checkStageProgress(enemy.point);
              createExplosion(enemyCenter.x, enemyCenter.y, enemy.color);
              addScoreText(enemyCenter.x, enemyCenter.y, `+${earnedPoints.toLocaleString("ko-KR")}`, laserColor);
              triggerShake(12, 20);
              if (Math.random() < 0.6) spawnItem(enemyCenter.x, enemyCenter.y);
              enemies.splice(i, 1);
              if (boss) break;
            } else {
              createExplosion(enemyCenter.x, enemyCenter.y, "#ffffff", 3);
            }
          }
        }
      }

      updateGoldenWaves();

      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        if (!enemy) continue;

        enemy.y += enemy.speed;
        if (enemy.laserHitCooldown > 0) enemy.laserHitCooldown--;

        const enemyCenter = { x: enemy.x + enemy.width/2, y: enemy.y + enemy.height/2, radius: enemy.width/2 };
        if (circleCircleCollision(enemyCenter, player, player.hitRadius)) {
          enemies.splice(i, 1);
          damagePlayer();
          continue;
        }

        if (enemy.y > canvas.height + enemy.height) enemies.splice(i, 1);
      }

      for (let i = explosions.length - 1; i >= 0; i--) {
        const p = explosions[i];
        p.x += p.dx; p.y += p.dy;
        p.alpha -= 0.04; p.radius *= 0.97;
        if (p.alpha <= 0) explosions.splice(i, 1);
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.currentRadius += (sw.maxRadius - sw.currentRadius) * 0.22 + 2;
        sw.alpha -= 0.04;
        if (sw.alpha <= 0 || sw.currentRadius >= sw.maxRadius) {
          shockwaves.splice(i, 1);
        }
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        t.y -= t.vy; t.alpha -= 0.02;
        if (t.alpha <= 0) floatingTexts.splice(i, 1);
      }
      if (shakeTime > 0) shakeTime--;
      else shakePower = 0;
    }

    function checkStageProgress(point) {
        // 보스가 이미 생성된 프레임에는 중복으로 스테이지를 넘기지 않는다.
        if (boss) return;
        stageProgressScore += point;
        if (stageProgressScore >= requiredScoreForNext) {
            stageProgressScore = 0; 
            if (stage % 5 === 4) {
                stage++;
                spawnBoss();
            } else {
                stage++;
                requiredScoreForNext = stage <= 4 ? (150 + stage * 50) : (300 + stage * 100);
            }
        }
    }

    function handleBossDefeat() {
        if (!boss) return;

        // 20스테이지 배수 보스는 1페이지를 격파하면 최종 형태로 부활한다.
        if (boss.isMilestone && boss.phase === 1) {
          goldenWaves.length = 0;
          boss.phase = 2;
          boss.hp = boss.phaseTwoHp;
          boss.maxHp = boss.phaseTwoHp;
          boss.introMode = true;
          boss.warningBannerTimer = Math.ceil(((2.179955 / 2.5) * 3 + 0.005 * 2) * 60);
          boss.x = canvas.width / 2 - boss.width / 2;
          boss.y = -boss.height;
          boss.targetY = 82;
          boss.vx = -Math.abs(boss.vx) * 1.15;
          boss.restTimer = Math.round(110 * getDifficultySettings().bossRestMultiplier);
          boss.targetLaser.active = false;
          boss.targetLaser.timer = 0;
          boss.repairNode = null;
          boss.healingTimer = 0;
          boss.healCooldown = 90;
          boss.spiralAngle = 0;
          bossBullets.length = 0;
          bossVerticalLasers.length = 0;
          bossSafeZonePattern = null;
          bullets.length = 0;
          laser.active = false;
          resetChargeStatus();
          // 경고음 두 종류가 또렷하게 들리도록 겹치던 저주파 폭발음은 재생하지 않는다.
          playBossWarningSound(true);
          createExplosion(canvas.width / 2, 360, "#d9b8ff", 70);
          if (shockwaves.length < 10) shockwaves.push({
            x: canvas.width / 2, y: 350,
            currentRadius: 18, maxRadius: 280, alpha: 1,
            color: "rgba(117,244,255,0.22)", borderColor: "#75f4ff"
          });
          addScoreText(canvas.width / 2, 420, "2단계 // 공허의 승천", "#75f4ff");
          triggerShake(22, 38);
          return;
        }

        goldenWaves.length = 0;
        score += boss.scoreReward ?? boss.point;
        MAX_BULLET_LEVEL += 5; 
        MAX_LASER_LEVEL += 5;
        playSound('bigExplosion');
        playBossExitSound(!!boss.isMilestone);

        if (shockwaves.length < 10) shockwaves.push({
          x: boss.x + boss.width/2,
          y: boss.y + boss.height/2,
          currentRadius: 20,
          maxRadius: 300,
          alpha: 1,
          color: "rgba(155, 89, 182, 0.4)",
          borderColor: "#9b59b6"
        });
        // 보스 퇴장 순간 기존 파동 바깥에 한 겹을 더해 폭발의 마무리감을 강화한다.
        if (shockwaves.length < 10) shockwaves.push({
          x: boss.x + boss.width/2,
          y: boss.y + boss.height/2,
          currentRadius: 54,
          maxRadius: 430,
          alpha: 0.62,
          color: boss.isMilestone ? "rgba(255, 55, 95, 0.16)" : "rgba(255, 190, 55, 0.16)",
          borderColor: boss.isMilestone ? "#ff526f" : "#ffd65a"
        });

        createExplosion(boss.x + boss.width/2, boss.y + boss.height/2, boss.color, 80);
        addScoreText(boss.x + boss.width/2, boss.y + boss.height/2, `보스 격파! 최대 레벨 +5`, "#FFD700");
        triggerShake(20, 30);
        spawnItem(boss.x + boss.width/2 - 40, boss.y + boss.height/2, true);
        spawnItem(boss.x + boss.width/2, boss.y + boss.height/2, true);
        spawnItem(boss.x + boss.width/2 + 40, boss.y + boss.height/2, true);

        stage++;
        requiredScoreForNext = 300 + (stage * 100);
        if (stage === 21) {
          // 20스테이지 보상은 화면 상단의 고정 안내 배너로 충분히 오래 알린다.
          wingmanNoticeTimer = 480; // 약 8초(60FPS 기준)
        }
        boss = null;
        bossBullets = []; 
        bossVerticalLasers = [];
        bossSafeZonePattern = null;
        resetChargeStatus();
    }

        const bx=100,bw=500,by=270;
        ctx.fillStyle="rgba(7,10,25,.86)"; ctx.beginPath(); ctx.roundRect(bx,by,bw,28,8); ctx.fill();
        const hp=Math.max(0,boss.hp/boss.maxHp);
        const hg=ctx.createLinearGradient(bx,0,bx+bw,0);
        if (boss.isMilestone && boss.phase === 2) {
          hg.addColorStop(0,"#67f3ff"); hg.addColorStop(1,"#b8a1ff");
        } else {
          hg.addColorStop(0,"#ff4f9a"); hg.addColorStop(1,"#a45bff");
        }
        ctx.fillStyle=hg; ctx.beginPath(); ctx.roundRect(bx+3,by+3,(bw-6)*hp,22,6); ctx.fill();
        ctx.textAlign="center"; ctx.fillStyle="#fff"; ctx.font='900 11px "Malgun Gothic", "맑은 고딕", Arial, sans-serif';
        const bossLabel = difficultyMode === "easy"
          ? (boss.isMilestone ? `하트 대장  //  ${boss.phase}단계/2  //  ${Math.ceil(boss.hp)} / ${boss.maxHp}` : `대왕 말랑이  //  ${Math.ceil(boss.hp)} / ${boss.maxHp}`)
          : (boss.isMilestone ? `공허 군주  //  ${boss.phase}단계/2  //  ${Math.ceil(boss.hp)} / ${boss.maxHp}` : "보스  //  "+Math.ceil(boss.hp)+"  /  "+boss.maxHp);
        ctx.fillText(bossLabel,350,by+18);
        if (boss.isMilestone && boss.phase === 2) {
          ctx.font='900 11px "Malgun Gothic", "맑은 고딕", Arial, sans-serif';
          if (boss.repairNode) {
            ctx.fillStyle="#75f4ff";
            ctx.fillText(`${difficultyMode === "easy" ? "하트 충전기" : "수리 핵"} ${Math.ceil(boss.repairNode.hp)} / ${boss.repairNode.maxHp} — 파괴하라!`,350,318);
            ctx.save();
            const warningPulse = 0.72 + Math.sin(performance.now() * 0.012) * 0.28;
            ctx.globalAlpha = warningPulse;
            ctx.textAlign = "center";
            ctx.font = "900 17px Arial";
            ctx.shadowColor = "#ff4f9a";
            ctx.shadowBlur = 18;
            ctx.fillStyle = "#fff1a8";
            ctx.fillText(difficultyMode === "easy" ? "하트 대장 회복 중! 충전기를 톡톡!" : "⚠ 보스 회복 중! 수리 핵을 파괴하라!", 350, 346);
            ctx.restore();
          } else {
            ctx.fillStyle="#9eb7d0";
            const cooldownSeconds = Math.ceil(Math.max(0,boss.healCooldown) / 60);
            ctx.fillText(`다음 수리 주기: ${cooldownSeconds}초`,350,318);
          }
        }
      }

      if(gameOver){
        ctx.fillStyle="rgba(2,5,17,.78)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.textAlign="center"; ctx.shadowColor="#39dfff"; ctx.shadowBlur=22;
        ctx.fillStyle=gameQuitByESC?"#8beaff":"#ff75b7"; ctx.font='900 43px "Malgun Gothic", "맑은 고딕", Arial, sans-serif';
        ctx.fillText(gameQuitByESC?"임무 중단":"신호 끊김",350,420);
        ctx.shadowBlur=0; ctx.fillStyle="#d7eaff"; ctx.font='16px "Malgun Gothic", "맑은 고딕", Arial, sans-serif';
        ctx.fillText("최종 점수  "+score,350,460);
        ctx.fillStyle="#8caac7"; ctx.font='12px "Malgun Gothic", "맑은 고딕", Arial, sans-serif'; ctx.fillText("재시작을 눌러 다시 출격하세요",350,490);
      }

      if(gamePaused && !gameOver){
        ctx.fillStyle="rgba(2,5,17,.76)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.textAlign="center";
        ctx.shadowColor="#39dfff";
        ctx.shadowBlur=24;
        ctx.fillStyle="#8beaff";
        ctx.font='900 46px "Malgun Gothic", "맑은 고딕", Arial, sans-serif';
        ctx.fillText("일시 정지",350,420);
        ctx.shadowBlur=0;
        ctx.fillStyle="#e1f5ff";
        ctx.font='16px "Malgun Gothic", "맑은 고딕", Arial, sans-serif';
        ctx.fillText("ESC를 눌러 계속하기",350,462);
        ctx.fillStyle="#8caac7";
        ctx.font='12px "Malgun Gothic", "맑은 고딕", Arial, sans-serif';
        ctx.fillText("진행 상황이 보존되었습니다",350,490);
      }

      if(boss && boss.introMode && (!boss.isMilestone || boss.warningBannerTimer > 0)){
        const isVoidLord = !!boss.isMilestone;
        const blink = 0.5 + 0.5 * Math.sin(performance.now() / (isVoidLord ? (490 / (Math.PI * 2)) : 112));
        const brightRed = `rgba(255, ${Math.round(35 + blink * 30)}, ${Math.round(28 + blink * 15)}, 1)`;
        const brightYellow = `rgba(255, ${Math.round(178 + blink * 64)}, ${Math.round(35 + blink * 20)}, 1)`;
        const warningColor = blink > 0.48 ? brightRed : `rgba(255, 82, 66, 0.42)`;

        ctx.fillStyle = difficultyMode === "easy" ? "rgba(255,220,236,.20)" : "rgba(18,2,8,.34)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = difficultyMode === "easy" ? "rgba(255,245,250,.96)" : "rgba(12,5,12,.94)";
        ctx.fillRect(0,390,canvas.width,120);

        // 빨강/노랑이 교차하며 점멸하는 이중 경고 테두리
        ctx.save();
        ctx.shadowColor = blink > 0.5 ? "#ff342e" : "#ffd52f";
        ctx.shadowBlur = 18 + blink * 18;
        ctx.strokeStyle = blink > 0.5 ? "#ff302e" : "#ffd52f";
        ctx.lineWidth = 6;
        ctx.strokeRect(3,393,canvas.width-6,114);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = blink > 0.5 ? "#ffd52f" : "#ff4035";
        ctx.lineWidth = 2;
        ctx.strokeRect(10,400,canvas.width-20,100);
        ctx.restore();

        // 상·하단 경고등 세그먼트
        for (let i = 0; i < 14; i++) {
          const segmentX = 18 + i * 50;
          ctx.fillStyle = (i + Math.floor(performance.now() / 100)) % 2 === 0 ? brightRed : brightYellow;
          ctx.globalAlpha = 0.55 + blink * 0.4;
          ctx.fillRect(segmentX, 390, 27, 4);
          ctx.fillRect(segmentX, 506, 27, 4);
        }
        ctx.globalAlpha = 1;

        if (isVoidLord) {
          const warningAlpha = 0.35 + blink * 0.65;
          ctx.save();
          ctx.globalAlpha = warningAlpha;
          ctx.textAlign = "center";
          ctx.font = '900 13px monospace';
          ctx.fillStyle = "#ff2929";
          ctx.shadowColor = "#ff1010";
          ctx.shadowBlur = 13 + blink * 12;
          for (let x = 55; x <= 645; x += 118) {
            ctx.fillText("/WARNING/", x, 380);
            ctx.fillText("/WARNING/", x, 536);
          }
          ctx.restore();
        }

        ctx.textAlign="center";
        ctx.shadowColor = isVoidLord ? "#ff2828" : (blink > 0.5 ? "#ff3028" : "#ffd52f");
        ctx.shadowBlur = 20 + blink * 12;
        ctx.fillStyle = difficultyMode === "easy" ? "#a74470" : (isVoidLord ? "#fff0ef" : (blink > 0.5 ? "#fff0e8" : "#fff4c8"));
        ctx.font='900 34px "Malgun Gothic", "맑은 고딕", Arial, sans-serif';
        const easyBossTitle = boss.isMilestone ? "하트 대장 등장!" : "대왕 말랑이 등장!";
        const introTitle = difficultyMode === "easy"
          ? ((boss.isMilestone && boss.phase === 2) ? "하트 대장 2단계!" : easyBossTitle)
          : ((boss.isMilestone && boss.phase === 2) ? "공허 군주 각성" : "경고");
        ctx.fillText(introTitle,350,438);
        ctx.shadowBlur=0;
        ctx.fillStyle = difficultyMode === "easy" ? "#c85d8c" : (isVoidLord ? "#ff8d8d" : "#ffd36b");
        ctx.font='700 17px "Malgun Gothic", "맑은 고딕", Arial, sans-serif';
        const introSubtitle = difficultyMode === "easy"
          ? (boss.isMilestone ? "하트 대장과 말랑말랑 대결!" : "몽실몽실한 친구가 나타났어요")
          : ((boss.isMilestone && boss.phase === 2) ? "공허 군주 // 진정한 모습 각성" : (boss.isMilestone ? "공허 군주 감지 · 즉시 전투 준비" : "적대 신호 감지 · 전투 준비"));
        ctx.fillText(introSubtitle,350,475);
      }
      ctx.restore();
    }

    function drawDamageFlash() {
      if (damageFlashTimer <= 0) return;

      ctx.save();
      const alpha = damageFlashTimer / 22;

      const grad = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, canvas.width * 0.2,
        canvas.width / 2, canvas.height / 2, canvas.width * 0.65
      );
      grad.addColorStop(0, "rgba(255, 0, 0, 0)");
      grad.addColorStop(1, `rgba(255, 0, 0, ${0.55 * alpha})`);

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = `rgba(255, 30, 30, ${0.85 * alpha})`;
      ctx.lineWidth = 14;
      ctx.strokeRect(0, 0, canvas.width, canvas.height);

      ctx.restore();
    }

    // SOLAR BEAM 렌더링 캐시: 정적인 빔/플레어는 한 번만 그리고 프레임마다 재사용한다.
    let solarBeamCache = null;
    let solarFlowCache = null;
    let solarSparkCache = null;
    let solarBeamCacheWidth = 0;

    function ensureSolarBeamCache(w, h) {
      if (solarBeamCache && Math.abs(solarBeamCacheWidth - w) < 0.5) {
        return { beam: solarBeamCache, flow: solarFlowCache, spark: solarSparkCache,
          width: solarBeamCache.width, height: solarBeamCache.height };
      }

      const cacheWidth = Math.ceil(Math.max(480, w * 4.8));
      const cacheHeight = Math.ceil(h + 280);
      const beamCanvas = document.createElement('canvas');
      beamCanvas.width = cacheWidth;
      beamCanvas.height = cacheHeight;
      const beamCtx = beamCanvas.getContext('2d');
      beamCtx.translate(cacheWidth / 2, h);
      beamCtx.globalCompositeOperation = 'lighter';

      // 큰 블룸과 본체 그라데이션은 캐시 생성 시 단 한 번만 계산한다.
      beamCtx.globalAlpha = 0.30;
      beamCtx.fillStyle = '#ff8a00';
      beamCtx.shadowColor = '#ff9d00';
      beamCtx.shadowBlur = 38;
      beamCtx.fillRect(-w * 0.68, -h, w * 1.36, h);
      beamCtx.shadowBlur = 0;

      const body = beamCtx.createLinearGradient(-w * 0.5, 0, w * 0.5, 0);
      body.addColorStop(0, 'rgba(255,105,0,0.05)');
      body.addColorStop(0.10, 'rgba(255,126,0,0.68)');
      body.addColorStop(0.23, 'rgba(255,177,20,0.96)');
      body.addColorStop(0.50, 'rgba(255,224,91,1)');
      body.addColorStop(0.77, 'rgba(255,177,20,0.96)');
      body.addColorStop(0.90, 'rgba(255,126,0,0.68)');
      body.addColorStop(1, 'rgba(255,105,0,0.05)');
      beamCtx.globalAlpha = 0.98;
      beamCtx.fillStyle = body;
      beamCtx.shadowColor = '#ffb000';
      beamCtx.shadowBlur = 25;
      beamCtx.fillRect(-w * 0.5, -h, w, h);
      beamCtx.shadowBlur = 0;

      const innerGlow = beamCtx.createLinearGradient(0, -h, 0, 0);
      innerGlow.addColorStop(0, 'rgba(255,255,220,0.10)');
      innerGlow.addColorStop(0.28, 'rgba(255,255,255,0.03)');
      innerGlow.addColorStop(0.52, 'rgba(255,255,220,0.38)');
      innerGlow.addColorStop(0.72, 'rgba(255,255,255,0.04)');
      innerGlow.addColorStop(1, 'rgba(255,255,220,0.16)');
      beamCtx.globalAlpha = 0.72;
      beamCtx.fillStyle = innerGlow;
      beamCtx.fillRect(-w * 0.39, -h, w * 0.78, h);

      const core = beamCtx.createLinearGradient(-w * 0.29, 0, w * 0.29, 0);
      core.addColorStop(0, 'rgba(255,244,177,0.04)');
      core.addColorStop(0.18, 'rgba(255,238,145,0.82)');
      core.addColorStop(0.50, 'rgba(255,255,231,1)');
      core.addColorStop(0.82, 'rgba(255,238,145,0.82)');
      core.addColorStop(1, 'rgba(255,244,177,0.04)');
      beamCtx.globalAlpha = 1;
      beamCtx.fillStyle = core;
      beamCtx.shadowColor = '#fff1a8';
      beamCtx.shadowBlur = 21;
      beamCtx.fillRect(-w * 0.29, -h, w * 0.58, h);
      beamCtx.shadowBlur = 0;
      beamCtx.fillStyle = 'rgba(255,255,255,0.96)';
      beamCtx.fillRect(-w * 0.095, -h, w * 0.19, h);
      beamCtx.fillStyle = '#ffffff';
      beamCtx.fillRect(-Math.max(2.5, w * 0.075), -h, Math.max(5, w * 0.15), h);

      // 플라스마 리본은 고정된 유려한 곡선으로 미리 그려 매 프레임의 경로 계산을 제거한다.
      for (let lane = -1; lane <= 1; lane += 2) {
        beamCtx.beginPath();
        for (let n = 0; n <= 28; n++) {
          const t = n / 28;
          const y = -h + t * h;
          const drift = Math.sin(t * 21 + lane) * w * 0.085;
          const x = lane * w * (0.43 + Math.sin(t * 15) * 0.025) + drift;
          if (n === 0) beamCtx.moveTo(x, y);
          else beamCtx.lineTo(x, y);
        }
        beamCtx.strokeStyle = 'rgba(255,244,174,0.92)';
        beamCtx.lineWidth = Math.max(2.5, w * 0.055);
        beamCtx.shadowColor = '#fff0a0';
        beamCtx.shadowBlur = 8;
        beamCtx.stroke();
      }
      beamCtx.shadowBlur = 0;

      // 발사구의 플레어/광선/링도 캐시에 포함한다.
      const flareR = w * 1.40;
      const flare = beamCtx.createRadialGradient(0, -7, 2, 0, -7, flareR * 1.75);
      flare.addColorStop(0, 'rgba(255,255,245,0.98)');
      flare.addColorStop(0.22, 'rgba(255,238,150,0.88)');
      flare.addColorStop(0.55, 'rgba(255,158,18,0.34)');
      flare.addColorStop(1, 'rgba(255,120,0,0)');
      beamCtx.globalAlpha = 0.95;
      beamCtx.fillStyle = flare;
      beamCtx.beginPath();
      beamCtx.arc(0, -7, flareR * 1.75, 0, Math.PI * 2);
      beamCtx.fill();

      for (let ray = 0; ray < 20; ray++) {
        const angle = Math.PI * 2 * ray / 20;
        const inner = flareR * 0.72;
        const outer = flareR * (1.08 + ((ray % 3) * 0.18));
        beamCtx.beginPath();
        beamCtx.moveTo(Math.cos(angle) * inner, -7 + Math.sin(angle) * inner * 0.42);
        beamCtx.lineTo(Math.cos(angle) * outer, -7 + Math.sin(angle) * outer * 0.42);
        beamCtx.strokeStyle = ray % 3 === 0 ? 'rgba(255,255,225,0.95)' : 'rgba(255,190,50,0.78)';
        beamCtx.lineWidth = ray % 3 === 0 ? 2.8 : 1.7;
        beamCtx.shadowColor = '#ffd45b';
        beamCtx.shadowBlur = 9;
        beamCtx.stroke();
      }
      for (let ring = 0; ring < 3; ring++) {
        beamCtx.beginPath();
        beamCtx.ellipse(0, -8, flareR * (0.82 + ring * 0.34), flareR * (0.22 + ring * 0.045), 0, 0, Math.PI * 2);
        beamCtx.strokeStyle = ring === 0 ? 'rgba(255,255,245,0.98)' : `rgba(255,${205 - ring * 18},70,${0.88 - ring * 0.16})`;
        beamCtx.lineWidth = ring === 0 ? 4 : 2.4;
        beamCtx.shadowColor = '#ffc52e';
        beamCtx.shadowBlur = 12;
        beamCtx.stroke();
      }
      beamCtx.shadowBlur = 0;
      beamCtx.globalAlpha = 1;
      beamCtx.globalCompositeOperation = 'source-over';

      // 한 줄짜리 애니메이션 텍스처를 재사용해 7개의 그라데이션을 매 프레임 만들지 않는다.
      const flowCanvas = document.createElement('canvas');
      flowCanvas.width = Math.max(64, Math.ceil(w * 1.1));
      flowCanvas.height = 14;
      const flowCtx = flowCanvas.getContext('2d');
      const flowGrad = flowCtx.createLinearGradient(0, 0, flowCanvas.width, 0);
      flowGrad.addColorStop(0, 'rgba(255,255,255,0)');
      flowGrad.addColorStop(0.22, 'rgba(255,245,183,0.48)');
      flowGrad.addColorStop(0.50, 'rgba(255,255,255,0.78)');
      flowGrad.addColorStop(0.78, 'rgba(255,245,183,0.48)');
      flowGrad.addColorStop(1, 'rgba(255,255,255,0)');
      flowCtx.fillStyle = flowGrad;
      flowCtx.fillRect(0, 0, flowCanvas.width, flowCanvas.height);

      // 빔 주변 스파크는 작은 스프라이트로 만들어 drawImage만 수행한다.
      const sparkCanvas = document.createElement('canvas');
      sparkCanvas.width = 28;
      sparkCanvas.height = 34;
      const sparkCtx = sparkCanvas.getContext('2d');
      sparkCtx.lineCap = 'round';
      sparkCtx.shadowColor = '#ffb52b';
      sparkCtx.shadowBlur = 7;
      sparkCtx.strokeStyle = 'rgba(255,245,210,0.98)';
      sparkCtx.lineWidth = 2.2;
      sparkCtx.beginPath();
      sparkCtx.moveTo(7, 27);
      sparkCtx.lineTo(14, 16);
      sparkCtx.lineTo(18, 10);
      sparkCtx.lineTo(23, 4);
      sparkCtx.stroke();
      sparkCtx.strokeStyle = 'rgba(255,180,35,0.9)';
      sparkCtx.lineWidth = 1.2;
      sparkCtx.beginPath();
      sparkCtx.moveTo(4, 22);
      sparkCtx.lineTo(14, 16);
      sparkCtx.lineTo(24, 13);
      sparkCtx.stroke();

      solarBeamCache = beamCanvas;
      solarFlowCache = flowCanvas;
      solarSparkCache = sparkCanvas;
      solarBeamCacheWidth = w;
      return { beam: solarBeamCache, flow: solarFlowCache, spark: solarSparkCache,
        width: solarBeamCache.width, height: solarBeamCache.height };
    }

    // 게임 시작 단계에서 미리 준비해 첫 솔라 빔 발사 순간의 캐시 생성 지연도 방지한다.
    ensureSolarBeamCache(laser.width * 2.75, 1500);

    function drawLaser() {
      if (!laser.active) return;
      const beams = getLaserBeams();
      const isGolden = player.laserLevel >= 25;
      const isPurple = player.laserLevel >= 15 && !isGolden;
      // 보이드 빔도 트리플 빔과 같은 세 갈래 형태를 사용하고, 보라색과 은은한 광채만 더한다.
      // Lv.10부터는 3중 빔으로 바뀌므로 전기 장식 연산을 줄여 프레임 부하를 낮춘다.
      const liteMode = player.laserLevel >= 10;
      const phase = performance.now() / 1000;

      ctx.save();
      for (const beam of beams) {
        ctx.save();
        ctx.translate(beam.x1, beam.y1);
        ctx.rotate(beam.angle + Math.PI / 2);

        const w = beam.width;
        const h = 1500;

        if (difficultyMode === "easy") {
          // 쉬움 전용 무지개 빔: 레벨과 관계없이 같은 한 줄기/두께/형태를 유지하고 색조만 바뀐다.
          const palettes = [
            ["#f4b4ca", "#f3c7aa", "#f2e0a8", "#b9d9bd", "#add5df", "#c8b9d8"],
            ["#e9a0bc", "#e8b990", "#e6d18f", "#a6cfae", "#93c9d8", "#b8a8d2"],
            ["#d98cab", "#dda879", "#d9c17e", "#8fbd9e", "#7fb7ce", "#a795c7"]
          ];
          const palette = palettes[player.laserLevel >= 25 ? 2 : player.laserLevel >= 10 ? 1 : 0];
          const rainbow = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
          palette.forEach((color, index) => rainbow.addColorStop(index / (palette.length - 1), color));

          ctx.globalAlpha = 0.30;
          ctx.fillStyle = palette[0];
          ctx.fillRect(-w * 0.78, -h, w * 1.56, h);
          ctx.globalAlpha = 0.90;
          ctx.fillStyle = rainbow;
          ctx.fillRect(-w * 0.48, -h, w * 0.96, h);
          ctx.globalAlpha = 0.72;
          ctx.fillStyle = "rgba(255,255,255,.74)";
          ctx.fillRect(-Math.max(1, w * 0.10), -h, Math.max(2, w * 0.20), h);
          ctx.globalAlpha = 0.88;
          ctx.fillStyle = "#fff8fb";
          ctx.beginPath(); ctx.arc(0, -8, Math.max(4, w * 0.72), 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
          ctx.restore();
          continue;
        }

        // Lv.30 윙맨 솔라 빔: 가늘지만 여러 겹의 빛과 흐르는 에너지 띠로 존재감을 준다.
        // 중앙 빔보다 절제된 광량을 사용하고, 작은 도형만 그려 렌더링 부담을 낮춘다.
        if (beam.isWingman && isGolden) {
          const wingPulse = 0.78 + Math.sin(phase * 6.5 + beam.x1 * 0.035) * 0.12;
          const wingSurge = 0.5 + Math.sin(phase * 9 + beam.x1 * 0.02) * 0.5;

          ctx.globalCompositeOperation = "lighter";

          // 얇은 황금 외곽광과 주황빛 본체
          ctx.globalAlpha = 0.24 * wingPulse;
          ctx.fillStyle = "#ff9f24";
          ctx.fillRect(-w * 1.65, -h, w * 3.3, h);
          ctx.globalAlpha = 0.58 * wingPulse;
          ctx.fillStyle = "#ffbf3d";
          ctx.fillRect(-w * 0.78, -h, w * 1.56, h);
          ctx.globalAlpha = 0.92;
          ctx.fillStyle = "#ffe49a";
          ctx.fillRect(-Math.max(1.2, w * 0.20), -h, Math.max(2.4, w * 0.40), h);
          ctx.globalAlpha = 0.96;
          ctx.fillStyle = "#fff9df";
          ctx.fillRect(-Math.max(0.8, w * 0.075), -h, Math.max(1.6, w * 0.15), h);

          // 양쪽 가장자리에 얇은 플라스마 선을 넣어 빔의 윤곽을 분명하게 한다.
          ctx.globalAlpha = 0.72;
          ctx.strokeStyle = "#ffdc75";
          ctx.lineWidth = Math.max(1, w * 0.065);
          ctx.beginPath();
          ctx.moveTo(-w * 0.56, -h); ctx.lineTo(-w * 0.56, 0);
          ctx.moveTo(w * 0.56, -h); ctx.lineTo(w * 0.56, 0);
          ctx.stroke();

          // 빔을 따라 위로 흐르는 짧은 에너지 펄스 3개
          for (let pulse = 0; pulse < 3; pulse++) {
            const py = -((phase * 285 + pulse * 505 + beam.x1 * 1.7) % h);
            ctx.globalAlpha = 0.48 + wingSurge * 0.28;
            ctx.fillStyle = pulse === 1 ? "#ffffff" : "#fff0b5";
            ctx.fillRect(-w * 0.43, py - 2.2, w * 0.86, 4.4);
            ctx.globalAlpha = 0.35;
            ctx.fillStyle = "#ffad32";
            ctx.fillRect(-w * 0.82, py - 1.2, w * 1.64, 2.4);
          }

          // 발사구의 이중 에너지 링과 작은 양옆 플레어
          ctx.globalAlpha = 0.82 * wingPulse;
          ctx.strokeStyle = "#ffe9a8";
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.ellipse(0, -9, w * 1.45, w * 0.42, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 0.52 * wingPulse;
          ctx.strokeStyle = "#ff9f24";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.ellipse(0, -9, w * 1.95, w * 0.62, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 0.75;
          ctx.fillStyle = "#fff4cf";
          for (const side of [-1, 1]) {
            ctx.beginPath();
            ctx.arc(side * w * 1.55, -10, Math.max(1.2, w * 0.12), 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";
          ctx.restore();
          continue;
        }

        // Lv.25 SOLAR BEAM: 한 줄기지만 화면을 압도하는 굵은 태양광 기둥.
        // 실제 충돌 폭도 함께 확장되어 빛의 두께와 피해 판정이 일치한다.
        if (isGolden) {
          const pulse = 0.90 + Math.sin(phase * 5.2) * 0.08;
          const surge = 0.5 + Math.sin(phase * 8.5) * 0.5;
          const cache = ensureSolarBeamCache(w, h);
          ctx.globalCompositeOperation = 'lighter';

          // 고비용의 빔 본체/플라스마/발사구는 캐시 이미지 한 장으로 재사용한다.
          ctx.globalAlpha = pulse;
          ctx.drawImage(cache.beam, -cache.width / 2, -h);

          // 움직이는 광류는 미리 만들어 둔 작은 텍스처를 반복 배치한다.
          const flowOffset = (phase * 330) % 250;
          ctx.globalAlpha = 0.48 + surge * 0.14;
          for (let band = 0; band < 6; band++) {
            const y = -((flowOffset + band * 238) % h);
            ctx.drawImage(cache.flow, -w * 0.54, y - 7, w * 1.08, 14);
          }

          // 스파크는 24개의 개별 경로 대신 작은 스프라이트 8개만 움직인다.
          for (let spark = 0; spark < 8; spark++) {
            const seed = spark * 23.7;
            const y = -((phase * (300 + (spark % 4) * 58) + seed * 29) % h);
            const side = spark % 2 === 0 ? -1 : 1;
            const x = side * (w * (0.72 + ((Math.sin(seed + phase * 2.5) + 1) * 0.5) * 0.38));
            ctx.globalAlpha = 0.62 + ((Math.sin(seed + phase * 4) + 1) * 0.5) * 0.30;
            ctx.drawImage(cache.spark, x - 9, y - 13, 18, 26);
          }

          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
          ctx.restore();
          continue;
        }

        // 윙맨은 간단한 2겹 직선 빔만 사용해 장식 연산과 화면 점유를 줄인다.
        if (beam.isWingman) {
          ctx.globalAlpha = 0.42;
          ctx.fillStyle = isGolden ? "#f2a900" : (isPurple ? "#a66cff" : "#00cfe8");
          ctx.fillRect(-w * 0.85, -h, w * 1.7, h);
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = isGolden ? "#fff0a3" : (isPurple ? "#e9d5ff" : "#c9fbff");
          ctx.fillRect(-Math.max(1.4, w * 0.16), -h, Math.max(2.8, w * 0.32), h);
          ctx.globalAlpha = 1;
          ctx.restore();
          continue;
        }

        const pulse = isPurple ? (0.88 + Math.sin(phase * 12) * 0.12) : (0.82 + Math.sin(phase * 12) * 0.18);
        const main = isGolden ? [255, 190, 35] : (isPurple ? [171, 105, 255] : [0, 224, 255]);
        const hot = isGolden ? "#fff4bd" : (isPurple ? "#f1dcff" : "#eaffff");
        const impactBoost = isPurple ? 1.14 : 1; // 보이드 빔은 트리플 빔 형태에 보라색 광채만 살짝 강화한다.

        // 넓은 빛기둥과 다층 코어
        const halo = ctx.createLinearGradient(-w * 1.8, 0, w * 1.8, 0);
        halo.addColorStop(0, "rgba(0,0,0,0)");
        halo.addColorStop(0.22, `rgba(${main.join(",")},${0.12 * pulse * impactBoost})`);
        halo.addColorStop(0.5, `rgba(${main.join(",")},${0.34 * pulse * impactBoost})`);
        halo.addColorStop(0.78, `rgba(${main.join(",")},${0.12 * pulse * impactBoost})`);
        halo.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = halo;
        ctx.fillRect(-w * 1.8, -h, w * 3.6, h);

        const body = ctx.createLinearGradient(-w, 0, w, 0);
        body.addColorStop(0, "rgba(255,255,255,0)");
        body.addColorStop(0.18, `rgba(${main.join(",")},${0.48 * (isPurple ? 1.08 : 1)})`);
        body.addColorStop(0.5, `rgba(${main.join(",")},${0.72 * (isPurple ? 1.08 : 1)})`);
        body.addColorStop(0.82, `rgba(${main.join(",")},${0.48 * (isPurple ? 1.08 : 1)})`);
        body.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = body;
        ctx.fillRect(-w, -h, w * 2, h);

        // 흰색 중심 코어를 넓고 선명하게 만들어 밝은 배경에서도 잘 보이게 한다.
        ctx.fillStyle = hot;
        ctx.globalAlpha = 1;
        ctx.fillRect(-Math.max(2.5, w * 0.20), -h, Math.max(5, w * 0.40), h);
        // 중심에 얇은 순백색 하이라이트를 한 겹 더해 광선의 중심을 또렷하게 표현
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(-Math.max(1.2, w * 0.07), -h, Math.max(2.4, w * 0.14), h);
        ctx.globalAlpha = 1;

        // 전기 아크: 시간 단위 시드로 패턴을 부드럽게 교체
        const seed = Math.floor(phase * 13);
        const rand = (n, lane) => {
          const v = Math.sin((seed + 1) * 127.1 + n * 311.7 + lane * 74.7) * 43758.5453;
          return v - Math.floor(v);
        };

        // Lv.10 미만은 4가닥, Lv.10 이상은 핵심 번개 2가닥만 표시
        const arcCount = liteMode ? 2 : 4;
        const arcSegments = liteMode ? 16 : 34;
        for (let arc = 0; arc < arcCount; arc++) {
          const side = arc % 2 === 0 ? -1 : 1;
          const offset = arc < 2 ? 0.28 : 0.72;
          const widthFactor = arc < 2 ? 0.72 : 1.25;
          ctx.beginPath();
          ctx.moveTo(side * w * offset, -h);
          for (let n = 1; n <= arcSegments; n++) {
            const y = -h + h * n / arcSegments;
            const wave = Math.sin(n * 1.7 + phase * (arc % 2 ? 13 : -11) + arc) * w * 0.2;
            const x = side * w * offset + (rand(n, arc) - 0.5) * w * widthFactor + wave;
            ctx.lineTo(x, y);
          }
          ctx.strokeStyle = arc < 2
            ? (isGolden ? "rgba(255,245,190,0.98)" : (isPurple ? "rgba(221,190,255,0.98)" : "rgba(177,255,255,0.98)"))
            : (isGolden ? "rgba(255,174,0,0.82)" : (isPurple ? "rgba(139,78,255,0.82)" : "rgba(0,174,255,0.82)"));
          ctx.lineWidth = arc < 2 ? Math.max(2.4, w * 0.11) : Math.max(1.4, w * 0.065);
          ctx.shadowColor = isGolden ? "#ffbf32" : (isPurple ? "#bd79ff" : "#00eaff");
          ctx.shadowBlur = liteMode ? 3 : (arc < 2 ? 13 : 8);
          ctx.stroke();

          // Lv.10 이상에서는 분기 번개를 생략해 드로우 호출을 크게 줄인다.
          for (let b = 0; !liteMode && b < 5; b++) {
            const n = 4 + b * 6 + (arc % 2);
            const y = -h + h * n / 34;
            const x = side * w * offset + (rand(n, arc) - 0.5) * w * widthFactor
              + Math.sin(n * 1.7 + phase * (arc % 2 ? 13 : -11) + arc) * w * 0.2;
            const dir = (b % 2 ? -1 : 1) * side;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + dir * w * 0.42, y - 10);
            ctx.lineTo(x + dir * w * (0.7 + rand(b, arc) * 0.35), y - 24);
            ctx.strokeStyle = hot;
            ctx.lineWidth = Math.max(1, w * 0.045);
            ctx.stroke();
          }
        }
        ctx.shadowBlur = 0;

        // Lv.10 이상은 얇은 전류 한 줄만 유지
        const strandCount = liteMode ? 1 : 3;
        const strandSegments = liteMode ? 12 : 26;
        for (let strand = 0; strand < strandCount; strand++) {
          ctx.beginPath();
          for (let n = 0; n <= strandSegments; n++) {
            const y = -h + h * n / strandSegments;
            const drift = Math.sin(n * 2.1 + phase * 9 + strand * 2.2) * w * 0.22;
            const x = drift + (rand(n, strand + 8) - 0.5) * w * 0.22;
            if (n === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = strand === 1 ? hot : (isGolden ? "rgba(255,207,76,0.88)" : (isPurple ? "rgba(205,164,255,0.8)" : "rgba(124,255,255,0.8)"));
          ctx.lineWidth = strand === 1 ? 1.7 : 1;
          ctx.stroke();
        }

        // 작은 전기 스파크도 Lv.10 이상에서는 개수를 줄인다
        const sparkCount = liteMode ? 5 : 18;
        for (let s = 0; s < sparkCount; s++) {
          const y = -((phase * 520 + s * 97) % h);
          const side = s % 2 ? 1 : -1;
          const x = side * (w * (0.45 + rand(s, 22) * 0.75));
          const len = 5 + rand(s, 23) * 13;
          ctx.beginPath();
          ctx.moveTo(x - len * 0.45, y + len * 0.35);
          ctx.lineTo(x, y);
          ctx.lineTo(x + len * 0.45, y - len * 0.35);
          ctx.strokeStyle = hot;
          ctx.globalAlpha = 0.45 + rand(s, 24) * 0.55;
          ctx.lineWidth = 1 + rand(s, 25) * 1.4;
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        // 빔 시작점의 에너지 링
        const ringR = w * (1.1 + Math.sin(phase * 14) * 0.12);
        ctx.beginPath();
        ctx.ellipse(0, -8, ringR, ringR * 0.34, 0, 0, Math.PI * 2);
        ctx.strokeStyle = hot;
        ctx.lineWidth = 2;
        ctx.shadowColor = isGolden ? "#ffc42e" : (isPurple ? "#c58aff" : "#00efff");
        ctx.shadowBlur = liteMode ? (isPurple ? 8 : 5) : 18;
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.restore();
