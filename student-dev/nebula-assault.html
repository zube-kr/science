<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>성운 강습</title>
<style>

* { margin:0; padding:0; box-sizing:border-box; }
:root { color-scheme: dark; }
body {
  min-height:100vh; overflow:hidden; display:flex; justify-content:center; align-items:center;
  padding:18px; background:
    radial-gradient(ellipse at 50% 10%, rgba(25,65,115,.34), transparent 48%),
    radial-gradient(ellipse at 50% 100%, rgba(91,35,145,.22), transparent 48%),
    #050814;
  font-family: Inter, "Malgun Gothic", "맑은 고딕", "Segoe UI", Arial, sans-serif;
}
#container {
  position:relative; padding:10px; border-radius:24px;
  background:linear-gradient(145deg, rgba(74,210,255,.55), rgba(128,92,255,.22) 38%, rgba(8,16,34,.9) 70%);
  box-shadow:0 0 0 1px rgba(139,220,255,.18), 0 24px 90px rgba(0,0,0,.72), 0 0 55px rgba(28,151,255,.15);
}
#container::before {
  content:""; position:absolute; inset:1px; border-radius:23px; pointer-events:none;
  background:linear-gradient(145deg,rgba(255,255,255,.09),transparent 24%,transparent 75%,rgba(130,93,255,.10));
}
body.easy-mode {
  background: #f5e9ee;
}
body.easy-mode #container {
  background:linear-gradient(145deg,#eccbd9,#f8edf2 48%,#e8c5d5);
  box-shadow:0 0 0 1px rgba(255,255,255,.72),0 16px 44px rgba(145,93,117,.14);
}
body.easy-mode #container::before {
  background:linear-gradient(145deg,rgba(255,255,255,.24),transparent 35%,transparent 72%,rgba(255,255,255,.10));
}
body.easy-mode canvas { background:#f7e7ed; }
canvas {
  display:block; width:min( min( calc(100vw - 56px), 700px), calc((100vh - 56px) * .7778));
  height:auto; max-height:calc(100vh - 56px); aspect-ratio:7/9;
  border-radius:16px; background:#050b1b; position:relative;
}
#restartBtn {
  position:absolute; left:50%; top:58%; transform:translate(-50%,-50%);
  padding:15px 32px; font-size:16px; letter-spacing:.08em; text-transform:uppercase;
  border:1px solid rgba(132,231,255,.8); border-radius:999px; cursor:pointer; display:none;
  background:linear-gradient(110deg,#21d4fd,#7367ff); color:#04101e; font-weight:900;
  box-shadow:0 0 28px rgba(33,212,253,.4), inset 0 1px rgba(255,255,255,.65);
  z-index:10; transition:transform .18s, filter .18s;
}
#restartBtn:hover { transform:translate(-50%,-50%) scale(1.05); filter:brightness(1.15); }
.overlayMenuBtn {
  position:absolute; left:50%; transform:translate(-50%,-50%); z-index:13;
  min-width:190px; padding:13px 25px; border:1px solid rgba(132,231,255,.78);
  border-radius:999px; cursor:pointer; display:none;
  color:#eafaff; background:linear-gradient(110deg,rgba(12,42,75,.97),rgba(44,35,91,.97));
  font:900 14px "Malgun Gothic", "맑은 고딕", Arial, sans-serif; letter-spacing:.10em;
  box-shadow:0 0 22px rgba(33,212,253,.24), inset 0 1px rgba(255,255,255,.18);
  transition:transform .18s, filter .18s, box-shadow .18s;
}
.overlayMenuBtn:hover { transform:translate(-50%,-50%) scale(1.05); filter:brightness(1.18); box-shadow:0 0 28px rgba(33,212,253,.42); }
#pauseMenuBtn { top:63%; }
#gameOverMenuBtn { top:68%; }


/* 시작 메뉴 및 조작 방법 화면 */
#menuOverlay {
  position:absolute; inset:10px; z-index:20; display:flex; align-items:center; justify-content:center;
  overflow:hidden; border-radius:16px; color:#eafaff; text-align:center;
  background:
    radial-gradient(ellipse at 50% 22%, rgba(27,143,220,.30), transparent 37%),
    radial-gradient(ellipse at 50% 82%, rgba(109,56,194,.24), transparent 42%),
    linear-gradient(155deg, #071a32 0%, #080e22 52%, #100a28 100%);
}
/* 메인 메뉴의 격자 장식 제거: 성운과 별 배경만 보이도록 유지 */
#menuOverlay::after {
  content:""; position:absolute; width:min(76%, 480px); aspect-ratio:1; border-radius:50%;
  border:1px solid rgba(91,211,255,.14); box-shadow:0 0 55px rgba(37,168,255,.08), inset 0 0 55px rgba(102,83,255,.08);
  pointer-events:none;
}
.menu-content, .controls-content {
  position:relative; z-index:1; width:min(520px, 92%); display:flex; flex-direction:column;
  align-items:center; gap:15px; padding:26px 12px;
}
.menu-kicker {
  color:#8cecff; font-size:11px; font-weight:900; letter-spacing:.30em;
  text-shadow:0 0 16px rgba(70,220,255,.65);
}
.menu-emblem {
  position:relative; width:100px; height:100px; display:grid; place-items:center; margin:2px 0 0;
  border:1px solid rgba(120,231,255,.54); border-radius:50%;
  box-shadow:0 0 20px rgba(43,194,255,.24), inset 0 0 25px rgba(36,164,255,.13);
}
.menu-emblem::before, .menu-emblem::after {
  content:""; position:absolute; border:1px solid rgba(170,147,255,.55); border-radius:50%;
}
.menu-emblem::before { inset:10px; }
.menu-emblem::after { inset:-8px; border-color:rgba(79,220,255,.22); border-style:dashed; }
.menu-emblem-core {
  width:31px; height:31px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff 0 9%, #bdfaff 20%, #35dfff 48%, #536dff 76%, #241a64 100%);
  box-shadow:0 0 18px #31dfff, 0 0 42px rgba(64,110,255,.72);
}
.menu-title {
  color:#f5fdff; font-size:clamp(38px, 8vw, 56px); line-height:1.05; font-weight:1000;
  letter-spacing:.13em; margin-left:.13em;
  text-shadow:0 0 9px rgba(123,235,255,.75), 0 0 30px rgba(43,157,255,.58), 0 5px 25px rgba(0,0,0,.75);
}
.menu-subtitle { color:#a9c9e5; font-size:14px; letter-spacing:.12em; }
.menu-divider { width:150px; height:2px; margin:5px 0 7px; background:linear-gradient(90deg, transparent, #55e9ff, #9b83ff, transparent); box-shadow:0 0 12px rgba(74,214,255,.65); }
.menu-actions { width:min(300px, 100%); display:flex; flex-direction:column; gap:11px; margin-top:5px; }
.menu-btn {
  width:100%; min-height:52px; padding:13px 20px; border-radius:999px; cursor:pointer;
  border:1px solid rgba(126,226,255,.64); color:#eaffff; background:rgba(7,24,49,.76);
  font:900 15px "Malgun Gothic", "맑은 고딕", Arial, sans-serif; letter-spacing:.10em;
  box-shadow:inset 0 1px rgba(255,255,255,.12), 0 8px 25px rgba(0,0,0,.22);
  transition:transform .16s, filter .16s, box-shadow .16s;
}
.menu-btn.primary {
  color:#041522; border-color:#a8f7ff;
  background:linear-gradient(105deg,#55eaff 0%,#79c8ff 48%,#a99aff 100%);
  box-shadow:0 0 23px rgba(52,208,255,.28), inset 0 1px rgba(255,255,255,.75);
}
.menu-btn:hover { transform:translateY(-2px); filter:brightness(1.12); box-shadow:0 0 24px rgba(75,211,255,.28); }
.menu-btn:focus-visible { outline:3px solid #fff; outline-offset:4px; }
.menu-footnote { color:#718eac; font-size:10px; letter-spacing:.12em; margin-top:5px; }
.controls-content { width:min(500px, 94%); gap:13px; }
.difficulty-content { width:min(560px, 94%); gap:12px; }
.difficulty-title { color:#f3fcff; font-size:clamp(28px, 6vw, 38px); font-weight:1000; letter-spacing:.12em; text-shadow:0 0 18px rgba(69,207,255,.42); }
.difficulty-subtitle { color:#99b9d5; font-size:12px; line-height:1.5; }
.difficulty-grid { width:100%; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:5px 0; }
.difficulty-card {
  min-height:82px; padding:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
  border:1px solid rgba(126,226,255,.46); border-radius:14px; cursor:pointer; color:#eaffff;
  background:linear-gradient(145deg,rgba(12,38,67,.92),rgba(13,17,42,.94));
  box-shadow:inset 0 1px rgba(255,255,255,.10),0 8px 22px rgba(0,0,0,.20);
  transition:transform .16s,filter .16s,border-color .16s,box-shadow .16s;
  font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;
}
.difficulty-card:hover { transform:translateY(-2px); filter:brightness(1.13); border-color:#8cecff; box-shadow:0 0 22px rgba(75,211,255,.22); }
.difficulty-card strong { font-size:18px; letter-spacing:.12em; }
.difficulty-card.easy strong { color:#8cf2a8; }
.difficulty-card.normal strong { color:#84ddff; }
.difficulty-card.hard strong { color:#ffc36f; }
.difficulty-card.hardcore strong { color:#ff7181; }
.controls-title { color:#f3fcff; font-size:clamp(27px, 6vw, 36px); font-weight:1000; letter-spacing:.12em; text-shadow:0 0 18px rgba(69,207,255,.42); }
.controls-subtitle { color:#99b9d5; font-size:12px; letter-spacing:.06em; }
.control-list {
  width:100%; margin:7px 0; padding:7px 15px; border:1px solid rgba(105,204,255,.24);
  border-radius:14px; background:rgba(3,13,31,.66); box-shadow:inset 0 0 25px rgba(53,113,191,.08);
}
.control-row {
  min-height:52px; display:grid; grid-template-columns:minmax(105px, 36%) 1fr; align-items:center;
  gap:12px; text-align:left; border-bottom:1px solid rgba(126,181,224,.12);
}
.control-row:last-child { border-bottom:0; }
.control-key { display:flex; flex-wrap:wrap; align-items:center; gap:5px; }
.key-cap {
  display:inline-flex; min-width:30px; min-height:27px; align-items:center; justify-content:center;
  padding:3px 7px; border:1px solid rgba(117,226,255,.55); border-radius:6px;
  color:#c7f8ff; background:linear-gradient(180deg,rgba(39,93,133,.7),rgba(11,28,54,.9));
  font:900 11px "Malgun Gothic", "맑은 고딕", Arial, sans-serif; box-shadow:0 2px 0 rgba(0,0,0,.35);
}
.control-action { color:#e1f3ff; font-size:12px; font-weight:800; }
.control-note { color:#86a8c7; font-size:11px; line-height:1.6; margin:0 6px 3px; }
@media (max-height:700px) {
  .menu-content, .controls-content { gap:9px; padding:12px 8px; }
  .menu-emblem { width:72px; height:72px; }
  .menu-title { font-size:clamp(32px, 7vw, 44px); }
  .control-row { min-height:43px; }
  .difficulty-content { gap:7px; padding:10px 6px; }
  .difficulty-card { min-height:74px; padding:9px 7px; }
  .difficulty-card strong { font-size:16px; }
}



</style>
</head>
<body>
  <div id="container">
    <canvas id="gameCanvas" tabindex="0" aria-label="게임 화면"></canvas>
    <button id="restartBtn">게임 재시작</button>
    <button id="pauseMenuBtn" class="overlayMenuBtn" type="button">메인 메뉴로</button>
    <button id="gameOverMenuBtn" class="overlayMenuBtn" type="button">메인 메뉴로</button>
    <section id="menuOverlay" aria-label="게임 메뉴">
      <div id="mainMenuView" class="menu-content">
        <div class="menu-kicker">은하 방위 작전</div>
        <div class="menu-emblem" aria-hidden="true"><div class="menu-emblem-core"></div></div>
        <h1 class="menu-title">성운 강습</h1>
        <p class="menu-subtitle">무너지는 은하를 지켜라</p>
        <div class="menu-divider"></div>
        <div class="menu-actions">
          <button id="menuStartBtn" class="menu-btn primary" type="button">게임 시작</button>
          <button id="menuControlsBtn" class="menu-btn" type="button">조작 방법</button>
        </div>
        <div class="menu-footnote">출격 준비 완료 · 조작 방법을 확인하고 출격하세요</div>
      </div>

      <div id="difficultyView" class="menu-content difficulty-content" style="display:none">
        <div class="menu-kicker">출격 설정</div>
        <h2 class="difficulty-title">난이도 선택</h2>
        <div class="difficulty-grid">
          <button class="difficulty-card easy" type="button" data-difficulty="easy">
            <strong>쉬움</strong>
          </button>
          <button class="difficulty-card normal" type="button" data-difficulty="normal">
            <strong>보통</strong>
          </button>
          <button class="difficulty-card hard" type="button" data-difficulty="hard">
            <strong>어려움</strong>
          </button>
          <button class="difficulty-card hardcore" type="button" data-difficulty="hardcore">
            <strong>하드코어</strong>
          </button>
        </div>
        <div class="menu-actions">
          <button id="difficultyBackBtn" class="menu-btn" type="button">뒤로가기</button>
        </div>
      </div>

      <div id="controlsView" class="controls-content" style="display:none">
        <div class="menu-kicker">출격 안내</div>
        <h2 class="controls-title">조작 방법</h2>
        <p class="controls-subtitle">키보드로 전투기를 조종하고 무기를 사용하세요</p>
        <div class="control-list">
          <div class="control-row">
            <div class="control-key"><span class="key-cap">A</span><span class="key-cap">D</span></div>
            <div class="control-action">좌우 이동</div>
          </div>
          <div class="control-row">
            <div class="control-key"><span class="key-cap">SPACE</span></div>
            <div class="control-action">기본 총알 발사 · 누르고 있기</div>
          </div>
          <div class="control-row">
            <div class="control-key"><span class="key-cap">W</span></div>
            <div class="control-action">빔 발사 · 누르고 있기</div>
          </div>
          <div class="control-row">
            <div class="control-key"><span class="key-cap">←</span><span class="key-cap">→</span></div>
            <div class="control-action">해당 방향으로 대시</div>
          </div>
          <div class="control-row">
            <div class="control-key"><span class="key-cap">ESC</span></div>
            <div class="control-action">일시정지 및 이어하기</div>
          </div>
        </div>
        <p class="control-note">총알과 빔은 해당 키를 누르고 있으면 사용할 수 있어요. 방향키를 누르면 해당 방향으로 빠르게 대시합니다.</p>
        <div class="menu-actions">
          <button id="controlsBackBtn" class="menu-btn primary" type="button">메인 메뉴로</button>
        </div>
      </div>
    </section>
  </div>

    const gameContainer = document.getElementById("container");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restartBtn");

    let voidLordSirenBuffer = null;
    let voidLordSirenBufferPromise = null;

    function loadVoidLordSirenBuffer() {
      if (!audioCtx) return Promise.resolve(null);
      if (voidLordSirenBuffer) return Promise.resolve(voidLordSirenBuffer);
      if (!voidLordSirenBufferPromise) {
        try {
          const binary = atob(VOID_LORD_SIREN_WAV_BASE64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          voidLordSirenBufferPromise = audioCtx.decodeAudioData(bytes.buffer.slice(0))
            .then(buffer => (voidLordSirenBuffer = buffer))
            .catch(error => {
              console.warn('공허 군주 경고음 샘플을 불러오지 못했습니다.', error);
              voidLordSirenBufferPromise = null;
              return null;
            });
        } catch (error) {
          console.warn('공허 군주 경고음 샘플을 준비하지 못했습니다.', error);
          voidLordSirenBufferPromise = null;
          return Promise.resolve(null);
        }
      }
      return voidLordSirenBufferPromise;
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (!audioBus) {
        audioBus = audioCtx.createGain();
        audioBus.gain.setValueAtTime(0.28, audioCtx.currentTime);
        audioBus.connect(audioCtx.destination);
      }
      initWidebeamReferenceAudio();
      // 첫 보스 등장 전에 미리 디코딩해 경고음 시작이 늦어지지 않게 한다.
      loadVoidLordSirenBuffer();
    }

    function initWidebeamReferenceAudio() {
      if (!audioCtx || widebeamReferenceAudio) return;
      widebeamReferenceAudio = new Audio();
      widebeamReferenceAudio.src = WIDEBEAM_REFERENCE_AUDIO_DATA_URI;
      widebeamReferenceAudio.preload = "auto";
      widebeamReferenceAudio.loop = true;
      widebeamReferenceAudio.load();
      const referenceSource = audioCtx.createMediaElementSource(widebeamReferenceAudio);
      widebeamReferenceGain = audioCtx.createGain();
      widebeamReferenceGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      referenceSource.connect(widebeamReferenceGain);
      widebeamReferenceGain.connect(audioBus || audioCtx.destination);
    }

    // 메인 메뉴 버튼을 누를 때 짧고 부드러운 클릭 효과음을 재생한다.
    function playMenuClickSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(760, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.055);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.22, now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.065);
        osc.connect(gain);
        // Menu taps keep the same level even when a button starts the game and creates the quieter gameplay bus.
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.07);
      } catch (error) {
        console.warn('메뉴 클릭 효과음을 재생하지 못했습니다.', error);
      }
    }

    let lastEasyCatShotAt = -Infinity;

    // 플레이어의 무기 레벨이 높아질수록 공격 효과음의 음색과 힘도 단계적으로 성장한다.
    function getPlayerSoundPower(weaponType = 'bullet') {
      const level = !player ? 1 : (weaponType === 'laser'
        ? (Number.isFinite(player.laserLevel) ? player.laserLevel : 1)
        : (Number.isFinite(player.bulletLevel) ? player.bulletLevel : 1));
      return Math.max(0, Math.min(1, (level - 1) / 34));
    }

    function playEasyCatMeow(type, now, power = 0) {
      // Web Audio로 만든 짧은 '야옹' 음색. 외부 음원 없이 쉬움 모드에서만 사용한다.
      const isBeam = type === 'laser';
      if (!isBeam && now - lastEasyCatShotAt < 0.11) return;
      if (!isBeam) lastEasyCatShotAt = now;

      const duration = isBeam ? 0.42 : 0.16;
      const osc = audioCtx.createOscillator();
      const formant = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();
      const vibrato = audioCtx.createOscillator();
      const vibratoGain = audioCtx.createGain();

      osc.type = 'sawtooth';
      const pitchBoost = 1 + power * 0.12;
      osc.frequency.setValueAtTime((isBeam ? 430 : 590) * pitchBoost, now);
      osc.frequency.exponentialRampToValueAtTime((isBeam ? 760 : 880) * pitchBoost, now + duration * 0.28);
      osc.frequency.exponentialRampToValueAtTime((isBeam ? 390 : 510) * pitchBoost, now + duration);

      formant.type = 'bandpass';
      formant.Q.setValueAtTime(2.2, now);
      formant.frequency.setValueAtTime(1050, now);
      formant.frequency.linearRampToValueAtTime(1650, now + duration * 0.32);
      formant.frequency.linearRampToValueAtTime(1120, now + duration);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime((isBeam ? 0.15 : 0.115) * (1 + power * 0.48), now + 0.025);
      gain.gain.setTargetAtTime(0.0001, now + duration * 0.62, Math.max(0.018, duration * 0.12));

      vibrato.type = 'sine';
      vibrato.frequency.setValueAtTime(isBeam ? 17 : 22, now);
      vibratoGain.gain.setValueAtTime(isBeam ? 20 : 13, now);
      vibrato.connect(vibratoGain);
      vibratoGain.connect(osc.frequency);

      osc.connect(formant);
      formant.connect(gain);
      gain.connect(audioBus || audioCtx.destination);
      vibrato.start(now);
      osc.start(now);
      osc.stop(now + duration + 0.03);
      vibrato.stop(now + duration + 0.03);
    }

    function playSound(type) {
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const soundPower = getPlayerSoundPower((type === 'laser' || type === 'bigExplosion') ? 'laser' : 'bullet');
      if (difficultyMode === 'easy' && ['shoot', 'laser', 'explosion', 'bigExplosion'].includes(type)) {
        playEasyCatMeow((type === 'laser' || type === 'bigExplosion') ? 'laser' : 'shoot', now, soundPower);
        return;
      }

      if (type === 'shoot') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(600 + soundPower * 170, now);
        osc.frequency.exponentialRampToValueAtTime(120 + soundPower * 45, now + 0.08);
        gain.gain.setValueAtTime(0.12 + soundPower * 0.065, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(audioBus || audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);

        // 중후반에는 낮은 보조음을 얹어 기본 사격이 더 묵직하게 들리게 한다.
        if (soundPower > 0.18) {
          const bodyOsc = audioCtx.createOscillator();
          const bodyGain = audioCtx.createGain();
          bodyOsc.type = 'triangle';
          bodyOsc.frequency.setValueAtTime(105 + soundPower * 38, now);
          bodyOsc.frequency.exponentialRampToValueAtTime(62 + soundPower * 18, now + 0.09);
          bodyGain.gain.setValueAtTime(0.012 + soundPower * 0.035, now);
          bodyGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          bodyOsc.connect(bodyGain); bodyGain.connect(audioBus || audioCtx.destination);
          bodyOsc.start(now); bodyOsc.stop(now + 0.09);
        }
      } 
      else if (type === 'laser') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        const duration = 0.35 + soundPower * 0.08;
        osc.frequency.setValueAtTime(200 + soundPower * 55, now);
        osc.frequency.linearRampToValueAtTime(800 + soundPower * 300, now + 0.15);
        gain.gain.setValueAtTime(0.25 + soundPower * 0.11, now);
        gain.gain.linearRampToValueAtTime(0.01, now + duration);
        osc.connect(gain);
        gain.connect(audioBus || audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration);

        // 높은 레이저 레벨에서는 얇은 저음 공명을 추가해 빔의 위력을 소리로도 전달한다.
        if (soundPower > 0.25) {
          const sub = audioCtx.createOscillator();
          const subGain = audioCtx.createGain();
          sub.type = 'triangle';
          sub.frequency.setValueAtTime(92, now);
          sub.frequency.exponentialRampToValueAtTime(48, now + duration);
          subGain.gain.setValueAtTime(0.025 + soundPower * 0.035, now);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          sub.connect(subGain); subGain.connect(audioBus || audioCtx.destination);
          sub.start(now); sub.stop(now + duration);
        }
      }
      else if (type === 'explosion') {
        const bufferSize = audioCtx.sampleRate * 0.2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, now);
        filter.frequency.linearRampToValueAtTime(50, now + 0.2);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3 + soundPower * 0.09, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioBus || audioCtx.destination);
        noise.start(now);
      }
      else if (type === 'bigExplosion') {
        const bufferSize = audioCtx.sampleRate * 0.5;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(500, now);
        filter.frequency.linearRampToValueAtTime(30, now + 0.5);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.5);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioBus || audioCtx.destination);
        noise.start(now);
      }
      else if (type === 'item') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.06); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.12); // G5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(audioBus || audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
      else if (type === 'hit') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(audioBus || audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }
      else if (type === 'dash') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain);
        gain.connect(audioBus || audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }
    }


    // 보스 공격별 전용 효과음: 경고음과 구분되도록 발사 순간에 짧고 강한 음색을 사용한다.
    function playBossAttackSound(kind, attackDurationSeconds = null) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;

        if (kind === "widebeam") {
          const beamDuration = Number.isFinite(attackDurationSeconds) && attackDurationSeconds > 0
            ? attackDurationSeconds : 0.01;
          initWidebeamReferenceAudio();
          if (!widebeamReferenceAudio || !widebeamReferenceGain) return;

          // Play the supplied roar itself so its character stays faithful to the reference.
          const release = 0.28;
          const build = Math.min(0.48, beamDuration * 0.34);
          const endAt = now + beamDuration;
          const tailAt = endAt + release;
          const playbackToken = ++widebeamReferencePlaybackToken;
          widebeamReferenceAudio.pause();
          try { widebeamReferenceAudio.currentTime = 0; } catch (_) {}
          widebeamReferenceAudio.loop = true;
          widebeamReferenceGain.gain.cancelScheduledValues(now);
          widebeamReferenceGain.gain.setValueAtTime(0.0001, now);
          widebeamReferenceGain.gain.linearRampToValueAtTime(0.82, now + build);
          widebeamReferenceGain.gain.setValueAtTime(0.72, endAt);
          widebeamReferenceGain.gain.exponentialRampToValueAtTime(0.0001, tailAt);
          const startReference = () => {
            if (playbackToken !== widebeamReferencePlaybackToken) return;
            widebeamReferenceAudio.currentTime = 0;
            const playAttempt = widebeamReferenceAudio.play();
            if (playAttempt && typeof playAttempt.catch === "function") playAttempt.catch(() => {});
          };
          if (widebeamReferenceAudio.readyState >= 2) startReference();
          else widebeamReferenceAudio.addEventListener("canplay", startReference, { once: true });
          window.setTimeout(() => {
            if (playbackToken !== widebeamReferencePlaybackToken) return;
            widebeamReferenceAudio.pause();
            try { widebeamReferenceAudio.currentTime = 0; } catch (_) {}
          }, (beamDuration + release + 0.06) * 1000);
          return;

        }
        const isHuge = kind === "sanctuary";
        const isCharge = kind === "charge";
        const isBeam = kind === "beam";
        const isProjectile = kind === "spread" || kind === "spiral" || kind === "crossfire";
        const duration = isHuge ? 1.65 : (isCharge ? 0.92 : (isBeam ? 0.95 : (isProjectile ? 0.19 : 0.30)));

        // 보스 전용 버스: 강한 어택과 긴 잔향을 한 덩어리로 묶는다.
        const bus = audioCtx.createGain();
        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-24, now);
        compressor.knee.setValueAtTime(16, now);
        compressor.ratio.setValueAtTime(7, now);
        compressor.attack.setValueAtTime(0.002, now);
        compressor.release.setValueAtTime(0.28, now);
        bus.gain.setValueAtTime(isHuge ? 0.90 : 0.80, now);
        bus.connect(compressor);
        compressor.connect(audioBus || audioCtx.destination);

        // 짧은 딜레이를 피드백으로 돌려 거대한 공간에서 울리는 느낌을 만든다.
        const delay = audioCtx.createDelay(0.45);
        const feedback = audioCtx.createGain();
        const damp = audioCtx.createBiquadFilter();
        delay.delayTime.setValueAtTime(isHuge ? 0.19 : 0.115, now);
        feedback.gain.setValueAtTime(0.22, now);
        damp.type = "lowpass";
        damp.frequency.setValueAtTime(1500, now);
        delay.connect(damp);
        damp.connect(feedback);
        feedback.connect(delay);
        delay.connect(compressor);
        const dry = audioCtx.createGain();
        dry.gain.setValueAtTime(0.92, now);
        dry.connect(compressor);

        // 왜곡된 중역: 둥근 공 소리가 아니라 금속성 에너지 포효가 중심.
        const shaper = audioCtx.createWaveShaper();
        const curve = new Float32Array(2048);
        for (let i = 0; i < curve.length; i++) {
          const x = (i * 2) / (curve.length - 1) - 1;
          curve[i] = Math.tanh(x * (isHuge ? 5.8 : 4.6));
        }
        shaper.curve = curve;
        shaper.oversample = "4x";
        const midFilter = audioCtx.createBiquadFilter();
        midFilter.type = "bandpass";
        midFilter.frequency.setValueAtTime(isHuge ? 420 : (isBeam ? 980 : 620), now);
        midFilter.Q.setValueAtTime(0.72, now);
        shaper.connect(midFilter);
        midFilter.connect(dry);

        const roar = audioCtx.createOscillator();
        const roar2 = audioCtx.createOscillator();
        const roarGain = audioCtx.createGain();
        roar.type = "sawtooth";
        roar2.type = "square";
        const base = isHuge ? 54 : (isCharge ? 68 : (isBeam ? 118 : 82));
        roar.frequency.setValueAtTime(base, now);
        roar.frequency.exponentialRampToValueAtTime(isCharge ? 520 : (isHuge ? 31 : (isProjectile ? 105 : 43)), now + duration);
        roar2.frequency.setValueAtTime(base * 1.51, now);
        roar2.frequency.exponentialRampToValueAtTime(isCharge ? 760 : (isProjectile ? 190 : 67), now + duration * 0.82);
        roar.detune.setValueAtTime(-9, now);
        roar2.detune.setValueAtTime(13, now);
        roarGain.gain.setValueAtTime(0.0001, now);
        roarGain.gain.linearRampToValueAtTime(isCharge ? 0.72 : (isProjectile ? 0.78 : 0.95), now + (isCharge ? 0.58 : 0.006));
        roarGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        roar.connect(shaper);
        roar2.connect(shaper);
        shaper.connect(roarGain);
        roarGain.connect(dry);
        roar.start(now);
        roar2.start(now);
        roar.stop(now + duration + 0.03);
        roar2.stop(now + duration + 0.03);

        // 충격파 저음: 시작 1~2프레임에 강하게 치고 빠진다.
        const sub = audioCtx.createOscillator();
        const subGain = audioCtx.createGain();
        const subFilter = audioCtx.createBiquadFilter();
        sub.type = "sine";
        sub.frequency.setValueAtTime(isHuge ? 39 : 58, now);
        sub.frequency.exponentialRampToValueAtTime(isHuge ? 22 : 29, now + 0.42);
        subFilter.type = "lowpass";
        subFilter.frequency.setValueAtTime(150, now);
        subGain.gain.setValueAtTime(0.0001, now);
        subGain.gain.linearRampToValueAtTime(isHuge ? 1.0 : 0.82, now + 0.009);
        subGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.48);
        sub.connect(subFilter);
        subFilter.connect(dry);
        sub.start(now);
        sub.stop(now + 0.5);

        // 금속 파열/에너지 방전 노이즈. 충전은 상승, 발사는 폭발적으로 열린다.
        const noiseDuration = isHuge ? 1.25 : (isCharge ? 0.72 : (isProjectile ? 0.11 : 0.48));
        const sampleCount = Math.floor(audioCtx.sampleRate * noiseDuration);
        const buffer = audioCtx.createBuffer(1, sampleCount, audioCtx.sampleRate);
        const samples = buffer.getChannelData(0);
        for (let i = 0; i < sampleCount; i++) {
          const t = i / sampleCount;
          const envelope = isCharge
            ? Math.pow(t, 1.7) * (1 - t * 0.45)
            : Math.pow(1 - t, isHuge ? 0.75 : 1.65);
          samples[i] = (Math.random() * 2 - 1) * envelope;
        }
        const noise = audioCtx.createBufferSource();
        const noiseFilter = audioCtx.createBiquadFilter();
        const noiseGain = audioCtx.createGain();
        noise.buffer = buffer;
        noiseFilter.type = "bandpass";
        noiseFilter.frequency.setValueAtTime(isCharge ? 360 : (isHuge ? 680 : 1450), now);
        noiseFilter.frequency.exponentialRampToValueAtTime(isCharge ? 4200 : 420, now + noiseDuration);
        noiseFilter.Q.setValueAtTime(0.55, now);
        noiseGain.gain.setValueAtTime(0.0001, now);
        noiseGain.gain.linearRampToValueAtTime(isCharge ? 0.32 : (isHuge ? 0.95 : (isProjectile ? 0.52 : 0.76)), now + (isCharge ? 0.62 : 0.004));
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + noiseDuration);
        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(dry);
        noise.start(now);

        // 공격별 성격을 분리: 산탄은 폭발, 회전탄은 불길한 와류, 레이저는 고압 방전.
        if (kind === "spiral" || isBeam || isHuge) {
          const ring = audioCtx.createOscillator();
          const ringGain = audioCtx.createGain();
          const ringFilter = audioCtx.createBiquadFilter();
          ring.type = "triangle";
          ring.frequency.setValueAtTime(kind === "spiral" ? 240 : (isHuge ? 92 : 1450), now);
          ring.frequency.exponentialRampToValueAtTime(kind === "spiral" ? 920 : (isHuge ? 38 : 190), now + duration);
          ringFilter.type = "highpass";
          ringFilter.frequency.setValueAtTime(kind === "spiral" ? 180 : 520, now);
          ringGain.gain.setValueAtTime(0.0001, now);
          ringGain.gain.linearRampToValueAtTime(isHuge ? 0.58 : 0.38, now + 0.025);
          ringGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          ring.connect(ringFilter);
          ringFilter.connect(ringGain);
          ringGain.connect(dry);
          ring.start(now);
          ring.stop(now + duration + 0.02);
        }

        // 충전음은 끝에 고조되고, 발사음은 첫 순간에 강한 어택을 준다.
        if (isCharge) {
          bus.gain.setValueAtTime(0.0001, now);
          bus.gain.linearRampToValueAtTime(0.9, now + 0.68);
          bus.gain.setValueAtTime(0.9, now + 0.68);
          bus.gain.exponentialRampToValueAtTime(0.0001, now + duration + 0.08);
        }
      } catch (error) {
        console.warn("보스 공격 효과음을 재생하지 못했습니다.", error);
      }
    }

    // 일반 보스는 한 가지 낮은 음을 반복한다.
    // 공허 군주는 235Hz 고정음 3회와 별도 고음역 사이렌을 동시에 재생한다.
    function playBossWarningSound(isVoidLord = false) {
      if (!audioCtx) return;

      // 일반 보스는 요청한 대로 동일한 낮은 단음만 반복한다.
      if (!isVoidLord) {
        const now = audioCtx.currentTime;
        const master = audioCtx.createGain();
        master.gain.setValueAtTime(0.68, now);
        master.connect(audioBus || audioCtx.destination);
        const pulseOffsets = [0, 0.32, 0.64, 0.96, 1.28, 1.60];
        const frequency = 285;
        pulseOffsets.forEach((offset) => {
          const start = now + offset;
          const end = start + 0.20;
          const osc = audioCtx.createOscillator();
          const toneGain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(frequency, start);
          toneGain.gain.setValueAtTime(0.0001, start);
          toneGain.gain.linearRampToValueAtTime(0.16, start + 0.018);
          toneGain.gain.setValueAtTime(0.16, end - 0.035);
          toneGain.gain.linearRampToValueAtTime(0.0001, end);
          osc.connect(toneGain);
          toneGain.connect(master);
          osc.start(start);
          osc.stop(end + 0.02);
        });
        return;
      }

      // 공허 군주: 낮은 고정음 3회와 사용자가 제공한 원본 사이렌 전체 3회를 함께 재생한다.
      // 원본 음원을 자르거나 배속하지 않으며, 각 재생 사이에는 짧은 숨 고르기만 둔다.
      const warningBossRef = boss;
      const warningRequestedAt = performance.now();
      loadVoidLordSirenBuffer().then((buffer) => {
        if (!buffer || !audioCtx) return;
        // 화면 경고 애니메이션의 밝기 최고점(sin = 1)에 첫 음과 첫 사이렌을 맞춘다.
        const warningFlashPeriodMs = 490;
        const warningFlashPeriod = warningFlashPeriodMs / 1000;
        const visualPhase = (performance.now() / (warningFlashPeriodMs / (Math.PI * 2))) % (Math.PI * 2);
        const phaseToBrightFlash = (Math.PI / 2 - visualPhase + Math.PI * 2) % (Math.PI * 2);
        const delayToBrightFlash = phaseToBrightFlash / (Math.PI * 2) * warningFlashPeriod;
        const now = audioCtx.currentTime + delayToBrightFlash + 0.025;
        const master = audioCtx.createGain();
        master.gain.setValueAtTime(0.78, now);
        master.connect(audioBus || audioCtx.destination);

        // 낮고 일정한 경고음: 동일한 235Hz를 화면 점멸에 맞춰 정확히 세 번.
        const warningOffsets = [0, warningFlashPeriod, warningFlashPeriod * 2];
        warningOffsets.forEach((offset) => {
          const start = now + offset;
          const end = start + 0.18;
          const osc = audioCtx.createOscillator();
          const toneGain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(235, start);
          toneGain.gain.setValueAtTime(0.0001, start);
          toneGain.gain.linearRampToValueAtTime(0.14, start + 0.012);
          toneGain.gain.setValueAtTime(0.14, end - 0.035);
          toneGain.gain.linearRampToValueAtTime(0.0001, end);
          osc.connect(toneGain);
          toneGain.connect(master);
          osc.start(start);
          osc.stop(end + 0.02);
        });

        // 원본 음원을 피치 보정 방식으로 2.5배 빠르게 미리 늘여 만든 샘플을 재생한다. 재생 시 피치는 바뀌지 않는다.
        const sirenRepeatCount = 3;
        const sirenGap = 0.005;
        // 음원 자체가 피치를 유지한 채 2.5배 빠르게 처리되어 있으므로 재생 속도는 1로 둔다.
        const sirenPlaybackRate = 1;
        const sirenPlayDuration = buffer.duration;
        const sirenInterval = sirenPlayDuration + sirenGap;
        const totalSirenDuration = sirenPlayDuration * sirenRepeatCount + sirenGap * (sirenRepeatCount - 1);
        const elapsedSinceRequest = Math.max(0, (performance.now() - warningRequestedAt) / 1000);
        const remainingWarningSeconds = Math.max(0, delayToBrightFlash + totalSirenDuration - elapsedSinceRequest);

        // 경고 배너는 원본 사이렌 3회가 모두 끝날 때까지 유지하고, 이후 보스가 진입한다.
        if (warningBossRef && boss === warningBossRef && warningBossRef.introMode) {
          warningBossRef.warningBannerTimer = Math.ceil(remainingWarningSeconds * 60);
        }

        for (let repeat = 0; repeat < sirenRepeatCount; repeat++) {
          const start = now + repeat * sirenInterval;
          const source = audioCtx.createBufferSource();
          const sirenGain = audioCtx.createGain();
          source.buffer = buffer;
          source.playbackRate.setValueAtTime(1, start);
          sirenGain.gain.setValueAtTime(0.0001, start);
          sirenGain.gain.linearRampToValueAtTime(0.70, start + 0.008);
          sirenGain.gain.setValueAtTime(0.70, start + sirenPlayDuration - 0.015);
          sirenGain.gain.linearRampToValueAtTime(0.0001, start + sirenPlayDuration);
          source.connect(sirenGain);
          sirenGain.connect(master);
          // 피치 보정된 샘플 전체 재생: duration/offset으로 잘라내지 않는다.
          source.start(start, 0);
        }
      });
    }

    function playBossExitSound(isVoidLord = false) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      if (difficultyMode === 'easy') {
        playEasyCatMeow('laser', now, 0.16);
        return;
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      osc.type = 'sine';
      const duration = isVoidLord ? 0.92 : 0.66;
      osc.frequency.setValueAtTime(isVoidLord ? 196 : 247, now);
      osc.frequency.exponentialRampToValueAtTime(isVoidLord ? 65 : 82, now + duration);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(540, now);
      filter.frequency.linearRampToValueAtTime(210, now + duration);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(isVoidLord ? 0.105 : 0.082, now + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioBus || audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.04);
    }

    function getGameKeyCode(e) {
      if (e.code && e.code !== "Unidentified") return e.code;
      if (e.keyCode === 65 || e.which === 65) return "KeyA";
      if (e.keyCode === 68 || e.which === 68) return "KeyD";
      if (e.keyCode === 32 || e.which === 32) return "Space";
      if (e.keyCode === 37 || e.which === 37) return "ArrowLeft";
      if (e.keyCode === 39 || e.which === 39) return "ArrowRight";
      if (e.keyCode === 87 || e.which === 87) return "KeyW";
      if (e.key === "Escape") return "Escape";
      return e.code || e.key;
    }

    // --- 충돌 판정 유틸리티 ---
    function circleRectCollision(circle, rect) {
      if (!circle || !rect) return false;
      let testX = circle.x;
      let testY = circle.y;

      if (circle.x < rect.x) testX = rect.x;
      else if (circle.x > rect.x + rect.width) testX = rect.x + rect.width;
      if (circle.y < rect.y) testY = rect.y;
      else if (circle.y > rect.y + rect.height) testY = rect.y + rect.height;

      const dx = circle.x - testX;
      const dy = circle.y - testY;
      return dx * dx + dy * dy <= circle.radius * circle.radius;
    }

    function rectRectCollision(a, b) {
      if (!a || !b) return false;
      return (
        a.x < b.x + b.width && a.x + a.width > b.x &&
        a.y < b.y + b.height && a.y + a.height > b.y
      );
    }
    
    function circleCircleCollision(c1, c2, c2Radius) {
      if (!c1 || !c2) return false;
      const dx = c1.x - c2.x;
      const dy = c1.y - c2.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      return distance < c1.radius + c2Radius;
    }

    function lineCircleCollision(x1, y1, x2, y2, cx, cy, cr) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return Math.hypot(cx - x1, cy - y1) <= cr;
      let t = ((cx - x1) * (x2 - x1) + (cy - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      const projX = x1 + t * (x2 - x1);
      const projY = y1 + t * (y2 - y1);
      return Math.hypot(cx - projX, cy - projY) <= cr;
    }

    // --- Lv.15 전류 로직 ---
    function triggerElectricity(originX, originY) {
      const chainRadius = 220;
      const lightningTargets = [];

      for (let k = 0; k < enemies.length; k++) {
        const enemy = enemies[k];
        const ex = enemy.x + enemy.width / 2;
        const ey = enemy.y + enemy.height / 2;
        const dist = Math.hypot(ex - originX, ey - originY);
        if (dist <= chainRadius) {
          lightningTargets.push({ enemy, index: k, x: ex, y: ey });
        }
      }

      const removeIndices = [];
      let progressPoints = 0;
      for (const target of lightningTargets) {
        if (lightningArcs.length < 18) lightningArcs.push({
          x1: originX, y1: originY,
          x2: target.x, y2: target.y,
          life: 10,
          color: "#a29bfe"
        });

        score += target.enemy.scoreReward ?? target.enemy.point;
        progressPoints += target.enemy.point;

        createExplosion(target.x, target.y, "#a29bfe", 12);
        addScoreText(target.x, target.y, `⚡감전! +${(target.enemy.scoreReward ?? target.enemy.point).toLocaleString("ko-KR")}`, "#a29bfe");
        removeIndices.push(target.index);
      }

      // 연쇄 공격 대상 정리 중에는 스테이지를 넘기지 않는다.
      // checkStageProgress()가 보스를 생성하면 spawnBoss()가 enemies를 비우므로,
      // 정리 전에 호출하면 이후 보상 처리에서 이미 삭제된 적을 참조할 수 있다.
      removeIndices.sort((a, b) => b - a);
      for (const idx of removeIndices) {
        const enemy = enemies[idx];
        if (!enemy) continue;
        spawnItem(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
        enemies.splice(idx, 1);
      }

      // 모든 연쇄 대상과 보상 처리를 끝낸 뒤 한 번만 진행도를 반영한다.
      if (!boss && progressPoints > 0) checkStageProgress(progressPoints);

      if (boss && !boss.introMode) {
        const bx = boss.x + boss.width / 2;
        const by = boss.y + boss.height / 2;
        if (Math.hypot(bx - originX, by - originY) <= chainRadius) {
          if (lightningArcs.length < 18) lightningArcs.push({
            x1: originX, y1: originY,
            x2: bx, y2: by,
            life: 10,
            color: "#a29bfe"
          });
          const chainDamage = (1.5 + player.bulletLevel * 0.3) * 2 *
        (1 + Math.max(0, player.laserLevel - 1) * 0.012);
          boss.hp -= chainDamage;
          createExplosion(bx, by, "#a29bfe", 10);
          if (boss.hp <= 0) handleBossDefeat();
        }
      }
    }

    function positionBossRepairNode() {
      if (!boss || !boss.repairNode) return;
      const node = boss.repairNode;
      // 생성 순간 보스 아래의 임의 위치를 정하고, 이후에는 좌표를 갱신하지 않는다.
      const minX = 18;
      const maxX = Math.max(minX, canvas.width - node.width - 18);
      node.x = minX + Math.random() * (maxX - minX);

    function damageBossRepairNode(damage, quiet = false) {
      if (!boss || !boss.isMilestone || boss.phase !== 2 || !boss.repairNode) return false;

    function spawnBoss() {
      // 보스 전환은 한 번만 실행하고, 이전 전투의 잔여 객체를 정리해
      // 고스테이지에서 보스 등장 직전 프레임 정체가 생기지 않도록 한다.
      if (boss) return;
      enemies.length = 0;
      bullets.length = 0;

      lightningArcs.length = 0;
