<style>
:root{--bg:#f6f5ff;--fg:#1d1b2e;--card:#fff;--ac:#6c4cf1;--mut:#6b6880;--bd:#ddd9f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

h1{font-size:24px;margin:8px 0 4px}h2{font-size:18px;margin:16px 0 8px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:14px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer;margin:3px 3px 3px 0}
button.s{background:transparent;color:var(--fg);border:1px solid var(--bd)}
button:disabled{opacity:.4;cursor:default}
input[type=text]{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}

.pl.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{display:inline-flex;align-items:center;justify-content:center;width:52px;height:78px;border-radius:9px;color:#fff;font-weight:800;font-size:20px;margin:3px;border:3px solid #fff;box-shadow:0 1px 4px #0005;cursor:pointer;user-select:none}

/* ===== 3D 카드대전 ===== */
.card{position:relative;overflow:hidden;transform-style:preserve-3d;--rx:0deg;--ry:0deg;--rz:0deg;--ty:0px;transform:translateY(var(--ty)) rotate(var(--rz)) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .16s ease-out,box-shadow .2s;border-radius:10px;box-shadow:0 3px 8px #0007,inset 0 0 0 2px #fff6}
.card::before{content:'';position:absolute;inset:12% 6%;border-radius:50%;background:#ffffff38;transform:rotate(-26deg);z-index:-1}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff66 46%,transparent 62%);pointer-events:none;z-index:2}
.card:not(.no):not(.big):not(.back):hover{--ty:-22px;--rx:-8deg;box-shadow:0 18px 22px #000a,0 0 16px #fff6 inset;z-index:6}
.card.no:hover{--ty:0px}
.card.back{background:linear-gradient(135deg,#1b1a3a,#4b3bd0 60%,#8d73ff);cursor:pointer;font-size:16px}
.card.back::before{content:'★';display:flex;align-items:center;justify-content:center;font-size:24px;color:#ffe27a;background:none;inset:0;transform:none}
.stage{perspective:1100px;margin:6px -6px 10px}
.felt{transform:rotateX(16deg);transform-origin:50% 100%;transform-style:preserve-3d;background:radial-gradient(ellipse at 50% 45%,#23905f 0%,#115238 58%,#0a2f23 100%);border-radius:30px;padding:16px 8px 20px;box-shadow:0 34px 40px -12px #000b,inset 0 0 50px #000a,0 0 0 7px #3d2b1a,0 0 0 9px #6b4a2a;position:relative}
.seats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;transform:translateZ(24px)}
.seat{background:#0007;border:1px solid #fff3;border-radius:14px;padding:6px 10px 4px;color:#fff;text-align:center;min-width:84px;font-size:14px}
.seat.on{box-shadow:0 0 0 2px #ffe27a,0 0 24px #ffe27a;animation:pulse 1.1s ease-in-out infinite}
.fan{display:flex;justify-content:center;height:34px;margin:4px 0 2px;padding-left:8px}
.fan i{display:block;width:20px;height:28px;border-radius:4px;background:linear-gradient(135deg,#2b2b50,#6c4cf1);border:1px solid #fff;margin-left:-10px;box-shadow:0 2px 4px #0009;transform-origin:50% 130%}
.center{display:flex;justify-content:center;align-items:center;gap:34px;margin:22px 0 10px;transform-style:preserve-3d}
.pile{position:relative;width:78px;height:112px;transform-style:preserve-3d}
.pile .card{position:absolute;inset:0;margin:0;width:78px;height:112px;font-size:32px}
.deck.go{cursor:pointer;animation:bob 1.3s ease-in-out infinite}
.hand{display:flex;flex-wrap:wrap;justify-content:center;padding:26px 8px 6px;min-height:108px}
.hand .card{margin:3px -9px;cursor:pointer}
.deal{animation:deal .55s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(var(--i)*55ms)}
.throw{animation:throw .6s cubic-bezier(.2,.8,.2,1)}
@keyframes deal{from{opacity:0;transform:translateY(-220px) rotateY(180deg) rotate(40deg) scale(.4)}}
@keyframes throw{from{transform:translate3d(0,190px,140px) rotate(-220deg) scale(1.6);opacity:.2}60%{transform:translate3d(0,-14px,70px) rotate(16deg) scale(1.12)}}
@keyframes pulse{50%{box-shadow:0 0 0 3px #ffe27a,0 0 34px #ffe27a}}
@keyframes bob{50%{transform:translateY(-6px)}}

/* ===== 둘러앉기 / 겹침 수정 ===== */
.felt{height:480px;padding:0}
.seat{position:absolute;transform:translate(-50%,-50%) translateZ(24px);width:80px;min-width:0;padding:4px 4px 3px;font-size:13px;box-sizing:border-box;z-index:3}
.seat.me{background:#3d2b1acc}
.seat .fan{height:30px;margin:3px 0 1px}
.center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) translateZ(60px);margin:0;gap:20px;z-index:2}
.cap{position:absolute;left:0;right:0;top:66%;text-align:center;color:#fffc;font-size:12px;z-index:1}

.dir.rev{animation-direction:reverse}
.card.back{padding-top:34px;box-sizing:border-box}
.card.back::before{inset:9px 0 auto 0;height:auto;display:block;text-align:center;line-height:1.1;font-size:20px}

.hand .card{margin:3px -6px}
@keyframes spin{to{transform:rotate(360deg)}}

.K{background:linear-gradient(135deg,#2d3436,#d63031)}
.bm{display:block;color:#ff7675;font-weight:900;font-size:12px}
.card.W,.card.J,.W,.J{background:linear-gradient(120deg,#ff4d4d 0%,#ffa94d 17%,#ffe94d 34%,#5cff7a 50%,#4dc9ff 67%,#8a6bff 84%,#ff6bd6 100%);text-shadow:0 1px 3px #000b}
.Q{background:linear-gradient(135deg,#f9ca24,#6c5ce7)}
.tip{position:relative;cursor:help}
.tip:hover::after{content:attr(data-tip);position:absolute;left:0;top:100%;margin-top:6px;z-index:60;width:max-content;max-width:250px;padding:8px 10px;border-radius:8px;background:#000e;color:#fff;font-size:12px;line-height:1.45;white-space:normal;box-shadow:0 4px 12px #0007;pointer-events:none;text-shadow:none}

.av3{perspective:220px;display:flex;flex-direction:column;align-items:center;height:50px;margin:-2px 0 2px}
.cube{width:26px;height:26px;position:relative;transform-style:preserve-3d;animation:sway 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}

.cube .ft{transform:translateZ(13px)}.cube .bk{transform:rotateY(180deg) translateZ(13px);background:hsl(var(--h) 60% 45%)}.cube .lf{transform:rotateY(-90deg) translateZ(13px);background:hsl(var(--h) 65% 52%)}.cube .rt{transform:rotateY(90deg) translateZ(13px);background:hsl(var(--h) 65% 52%)}.cube .tp{transform:rotateX(90deg) translateZ(13px);background:hsl(var(--h) 80% 78%)}

<script>
/* 사이트용 보조 저장소: Claude 공유 DB(claude.use('db'))가 없을 때 이 기기(같은 브라우저) 안에서 방을 만들고 봇과 대전할 수 있게 함.
   같은 브라우저의 여러 탭끼리는 BroadcastChannel·storage 이벤트로 실시간 동기화됨. */
window.PG_LOCAL=false;
/* Claude 공유 DB가 없으면 탭마다 다른 참가자가 되도록 탭 단위 저장소에 ID 보관 */
window.PG_PIDSTORE=function(){try{return (typeof claude!=='undefined')?localStorage:sessionStorage}catch(e){return localStorage}};
window.pgLocalDB=function(){
  const K='pgdb:',mem={},subs=new Set(),bc=('BroadcastChannel' in window)?new BroadcastChannel('pgdb'):null;
  const rd=p=>{try{const v=localStorage.getItem(K+p);return v==null?null:JSON.parse(v)}catch(e){return mem[p]===undefined?null:JSON.parse(mem[p])}};
  const wr=(p,v)=>{const s=v==null?null:JSON.stringify(v);try{s==null?localStorage.removeItem(K+p):localStorage.setItem(K+p,s)}catch(e){if(s==null)delete mem[p];else mem[p]=s}};
  const keys=()=>{const out=new Set(Object.keys(mem));try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(K))out.add(k.slice(K.length))}}catch(e){}return [...out]};
  const dsnap=p=>{const v=rd(p);return {id:p.split('/').pop(),exists:v!=null,data:()=>v==null?undefined:JSON.parse(JSON.stringify(v))}};
  const csnap=p=>({docs:keys().filter(k=>k.startsWith(p+'/')&&!k.slice(p.length+1).includes('/')).sort().map(dsnap)});
  const fire=()=>subs.forEach(f=>{try{f()}catch(e){}});
  const changed=()=>{fire();if(bc)bc.postMessage(1)};
  if(bc)bc.onmessage=fire;
  addEventListener('storage',e=>{if(!e.key||e.key.startsWith(K))fire()});
  const watch=(mk,cb)=>{let last;const f=()=>{const s=mk(),j=JSON.stringify(s.docs?s.docs.map(d=>[d.id,d.data()]):[s.exists,s.data()]);if(j!==last){last=j;cb(s)}};subs.add(f);setTimeout(f,0);return ()=>subs.delete(f)};
  /* 오래된 방(하루 지난 것) 정리 */
  try{const now=Date.now();keys().filter(k=>/^parties\/[^/]+\/players\/[^/]+$/.test(k)).forEach(k=>{const v=rd(k);if(v&&v.t&&now-v.t>864e5)wr(k,null)});
    keys().filter(k=>/^parties\/[^/]+$/.test(k)).forEach(k=>{if(!keys().some(x=>x.startsWith(k+'/players/')))wr(k,null)})}catch(e){}
  return {
    doc:p=>({get:async()=>dsnap(p),set:async v=>{wr(p,JSON.parse(JSON.stringify(v)));changed()},delete:async()=>{wr(p,null);changed()},onSnapshot:(cb)=>watch(()=>dsnap(p),cb)}),
    collection:p=>({onSnapshot:(cb)=>watch(()=>csnap(p),cb)})
  };
};
</script>

const P=t=>t.trim().split('\n').map(l=>l.split('~'));
const Q=[P(`원소 중 가장 가벼운 것은?~수소

정육면체의 면은 모두 몇 개?~6

염산(HCl)은 산성과 염기성 중 무엇일까요?~산성
식물 세포에서 광합성이 일어나는 소기관은?~엽록체
혈액 응고를 돕는 혈액 속 세포 조각은?~혈소판

async function create(g){

  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c=(($('#ccode')||{}).value||'').trim().toUpperCase();
  try{
    if(c){
      if(c.length!==4||/[^A-Z0-9가-힣]/.test(c)){msg='코드는 영문·숫자·한글 4자리로 입력하세요 (비우면 랜덤)';return home()}
      if((await db.doc('parties/'+c).get()).exists){msg='이미 사용 중인 코드예요. 다른 코드를 써 주세요';return home()}
    }else{
      for(let k=0;k<12;k++){c='';for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];if(!(await db.doc('parties/'+c).get()).exists)break}
    }
  }catch(e){if(!c)for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)]}
  code=c;
  try{let cf0={};try{cf0=JSON.parse(localStorage.getItem('cfg_'+g)||'{}')}catch(e){}await mref().set({game:g,host:pid,status:'lobby',s:null,cfg:cf0});await enter()}catch(e){code=null;msg='방을 만들지 못했어요. 공유 권한(기여자 이상)을 확인하세요.';home()}
}
async function join(c){
  c=(c||'').trim().toUpperCase();
  if(!myName.trim()){msg='닉네임을 먼저 입력하세요';return home()}
  if(c.length!==4){msg='코드는 4자리예요';return home()}
  code=c;
  try{const s=await mref().get();if(!s.exists){code=null;msg='없는 방이에요';return home()}
    if((s.data().kicked||{})[pid]){code=null;msg='추방된 방이라 들어갈 수 없어요';return home()}
    if(s.data().status!=='lobby'&&!(await pref(pid).get()).exists){code=null;msg='이미 시작된 방이에요';return home()}
    await enter()}catch(e){code=null;msg='입장하지 못했어요. 공유 권한(기여자 이상)을 확인하세요.';home()}
}
async function enter(){
  try{localStorage.setItem('nick',myName)}catch(e){}

  if(!ex.exists)await pref(pid).set({name:myName.trim().slice(0,10),score:0,ans:-1,t:Date.now()});
  msg='';
  unsubs.push(mref().onSnapshot(s=>{main=s.exists?s.data():null;if(main&&main.kicked&&main.kicked[pid]&&main.host!==pid){msg='방장에게 추방되었어요';leave();return}render();autoReveal()},()=>{}));
  unsubs.push(db.collection('parties/'+code+'/players').onSnapshot(s=>{players={};s.docs.forEach(d=>players[d.id]=d.data());render();autoReveal()},()=>{}));
}

  o.onclick=e=>{if(e.target===o)closeDemo()};
  o.innerHTML=`<div class="dbox"><div class="dh">${LAB[code[1]]&&k!=='n'?'':''}🎬 ${DN[k]}</div><div id="dstg"></div><div class="dcap">${DTIP[k]}</div><div style="margin-top:8px"><button onclick="demo('${code}')">↻ 다시 보기</button> <button class="s" onclick="dex()">목록</button> <button class="s" onclick="closeDemo()">닫기</button></div></div>`;
  const st=$('#dstg');
  while(tk===DTK&&$('#dstg')===st){st.innerHTML='';try{await DS[k](mkG(st))}catch(e){}if(tk!==DTK)return;await new Promise(r=>setTimeout(r,1600))}
}

/* ---------- 카드대전 ---------- */
const LAB={S:'⊘',R:'⇄',D:'+2',F:'+4',W:'★',J:'🃏',X:'🛡',C:'📋',T:'🖐',M:'-2',N:'-3',K:'💣','~':'●',V:'7⇄',L:'1⇄',A:'ALL',Q:'🎰',E:'👁',H:'!',Z:'?',P:'π',I:'i',O:'e',U:'×2'},CN={R:'빨강',Y:'노랑',G:'초록',B:'파랑'};
let sp=null,mn=null;
function imm(s,id){return !!id&&(s.hands[id]||[]).some(c=>c[0]==='X')}
function av3(id,k,s){const w=s.winner&&(s.winners||[s.winner]).includes(id),bot=players[id]&&players[id].bot,f=w?'🥳':id===pid?'😎':bot?'🤖':'🙂',hue=(k*67+200)%360;return `<div class="av3 ${w?'win':''}"><div class="cube" style="--h:${hue};--d:-${k*.6}s"><i class="f ft">${f}</i><i class="f bk"></i><i class="f lf"></i><i class="f rt"></i><i class="f tp"></i></div><div class="bd" style="--h:${hue}"></div></div>`}
function doEye(s,me,pre,inv){let t;s.drawn=null;
  if(inv){s.hide=s.hide||{};s.peek=s.peek||{};const on=!s.hide[me];s.hide[me]=on;s.peek[me]=on;t='나는 상대에게 공개되지 않고, 훔칠 때 상대 카드가 보여요 '+(on?'ON':'OFF')}
  else if(!s.tr){const g=drawN(s,1,me)[0];if(g)s.hands[me].push(g);s.tr=true;t='🎡 룰렛 → '+(g?lab(g):'꽝')+' · 투명모드 ON'}else{s.tr=false;t='투명모드 OFF'}
  const rc=s.order.filter(o=>o!==me&&!imm(s,o));
  if(rc.length){const r=rc[Math.floor(Math.random()*rc.length)];s.hands[r].push('EE');t+=' · 투명카드는 '+players[r].name+'에게 넘어갔어요'}else t+=' · 투명카드는 사라졌어요';
  if(!s.hands[me].length)s.winner=me;
  s.last=players[me].name+': '+pre+'👁 투명카드! '+t;passTurn(s,1)}
async function eyeCommit(i,via,src){const s=JSON.parse(JSON.stringify(main.s));
  if(s.order[s.turn]!==pid||s.winner||PH(s)||s.order.length<2){sp=null;return render()}
  const h=s.hands[pid],c=h[i];if(!c||(via?c[0]!==src:c[0]!=='E')){sp=null;return render()}
  const ivE=!via&&c[2]==='~';h.splice(i,1);sp=null;pend=null;doEye(s,pid,via?'📋 복사 → ':'',ivE);await save(s)}
function reflectPend(s,me,k,pre,to){
  const p=s.pend,from=to||p.from;if(k>=0)s.hands[me].splice(k,1);s.drawn=null;
  let t=`${players[me].name}: ${pre||''}❗ 반사카드! +${p.n} 공격을 ${players[from].name}에게 되돌렸어요`;
  if(imm(s,from)){s.pend=null;t+=' → 🛡 방어카드 면역으로 무시'}
  else{s.pend={to:from,n:p.n,t:p.t,from:me};s.turn=s.order.indexOf(from)}
  if(!s.hands[me].length)s.winner=me;
  s.last=t}
async function useReflect(){
  const s=JSON.parse(JSON.stringify(main.s));
  if(!s.pend||s.pend.to!==pid||s.order[s.turn]!==pid||s.winner||!s.pend.from||!s.order.includes(s.pend.from))return;
  const k=s.hands[pid].findIndex(c=>c[0]==='H');if(k<0)return;
  pend=null;sp=null;mn=null;reflectPend(s,pid,k);await save(s)}
function holdFin(s){
  if(!s.winner||s.fin||s.finOk)return;const w=s.winner;
  if(!(s.hands[w]&&!s.hands[w].length))return;
  if(s.order.some(o=>o!==w&&(s.hands[o]||[]).some(c=>c[0]==='Z')))s.fin={by:w,until:Date.now()+10000}}

  if(!sp||s.order[s.turn]!==pid||s.winner||PH(s)){sp=null;return render()}
  const h=s.hands[pid],ci=sp.ci,via=!!sp.via,c=via?sp.vc:h[ci];
  if(!s.hands[tid]||tid===pid||!h[ci]||!c||(c[1]!=='V'&&!(c[1]==='L'&&c[2]==='~'))||(via&&h[ci][0]!==sp.src)){sp=null;return render()}
  if(c[0]==='W'&&!col)return;
  h.splice(ci,1);sp=null;pend=null;
  applyCard(s,c,col,via?(sp.src==='P'?'π → ':'📋 복사 → '):'',pid,tid);
  await save(s);
}
async function bombCommit(tid){
  const s=JSON.parse(JSON.stringify(main.s));
  if(!sp||s.order[s.turn]!==pid||s.winner||PH(s)){sp=null;return render()}
  const h=s.hands[pid],ci=sp.ci;
  if(!h[ci]||h[ci][0]!==sp.src||!s.hands[tid]||tid===pid){sp=null;return render()}
  if(s.bomb&&s.bomb.to!==pid){sp.msg='이미 다른 사람에게 폭탄이 진행 중이에요';return render()}
  if(h[ci][2]==='~'){h.splice(ci,1);const k=Math.min(5,h.length);let mv=0;const ig=imm(s,tid);if(!ig){for(let q=0;q<k;q++){const j=Math.floor(Math.random()*h.length);s.hands[tid].push(h.splice(j,1)[0]);mv++}}s.drawn=null;sp=null;pend=null;if(!h.length)s.winner=pid;s.last=`${players[pid].name}: 💣 반전 폭탄! `+(ig?`🛡 ${players[tid].name} 면역으로 무시`:`내 카드 ${mv}장이 ${players[tid].name}에게 넘어갔어요`);chainOrPass(s,pid,0);return save(s)}
  h.splice(ci,1);const rf=imm(s,tid),tt=rf?(imm(s,pid)?null:pid):tid;
  if(tt){s.hands[tt].push('KK');s.bomb={to:tt,left:s.bomb?s.bomb.left:3,from:pid,boom:Math.ceil(5*(sp.mult||1))}}
  s.drawn=null;sp=null;pend=null;
  if(!h.length)s.winner=pid;
  s.last=`${players[pid].name}: 💣 폭탄카드! `+(rf?`🛡 ${players[tid].name}의 방어카드가 반사! `+(tt?'폭탄이 '+players[pid].name+'에게 되돌아왔어요 (3턴 뒤 폭발) · 폭탄 신호':'폭탄이 사라졌어요'):`${players[tid].name}에게 폭탄 신호 (3턴 뒤 폭발, 방어카드로 막을 수 있어요)`);
  passTurn(s,1);
  await save(s);
}
async function spCommit(idx,col){
  const s=JSON.parse(JSON.stringify(main.s));
  if(!sp||s.order[s.turn]!==pid||s.winner||PH(s)){sp=null;return render()}
  const h=s.hands[pid],ci=sp.ci;
  if(!h[ci]||h[ci][0]!==sp.src){sp=null;return render()}
  let c,pre;
  if(sp.k==='copy'){c=h[idx];if(!c||idx===ci){sp=null;return render()}pre='📋 복사 → '}
  else{const th=s.hands[sp.tgt];if(!th||!th[idx]){sp=null;return render()}c=th[idx];pre='🖐 '+players[sp.tgt].name+'의 카드를 복사해서 → '}
  h.splice(ci,1);sp=null;pend=null;
  applyCard(s,c,col,pre);await save(s);
}
async function drawCard(){
  const s=JSON.parse(JSON.stringify(main.s));
  if(s.order[s.turn]!==pid||s.winner||s.pend||s.drawn||s.cbUntil)return;
  const h=s.hands[pid],nm0=players[pid].name,c=drawN(s,1,pid)[0];
  pend=null;sp=null;mn=null;
  if(!c){s.last=nm0+': 뽑을 카드가 없어요';passTurn(s,1);return save(s)}
  h.push(c);
  const can=(c[0]==='X'||c[0]==='H'||c[0]==='Z')?false:c[0]==='C'?h.length>1:c[0]==='T'?s.order.some(id=>id!==pid&&s.hands[id].length>0):c[0]==='K'?(s.order.length>1&&(!s.bomb||s.bomb.to===pid)):(c[0]==='Q'||c[0]==='E')?s.order.length>1:(c[0]==='W'||c[0]==='J'||c[0]===s.color||c[1]===s.top[1]);
  if(can){s.drawn={by:pid,c};s.last=nm0+': 카드를 뽑았어요 (낼 수 있으면 바로 낼 수 있어요)'}
  else{s.drawn=null;passTurn(s,1);s.last=nm0+': 카드를 뽑았어요'}
  await save(s);
}
function playDrawn(){
  if(!main||!main.s.drawn||main.s.drawn.by!==pid)return;
  const i=main.s.hands[pid].lastIndexOf(main.s.drawn.c);
  if(i>=0)play(i);
}
async function keepDrawn(){
  const s=JSON.parse(JSON.stringify(main.s));
  if(!s.drawn||s.drawn.by!==pid||s.order[s.turn]!==pid)return;
  s.drawn=null;passTurn(s,1);s.last=players[pid].name+': 뽑은 카드를 내지 않고 넘겼어요';pend=null;sp=null;mn=null;
  await save(s);
}
async function takeHit(){
  const s=JSON.parse(JSON.stringify(main.s));
  if(!s.pend||s.pend.to!==pid||s.order[s.turn]!==pid)return;
  s.hands[pid].push(...drawN(s,s.pend.n,pid));s.last=players[pid].name+': +'+s.pend.n+' 카드를 받았어요';s.pend=null;passTurn(s,1);await save(s);
}
async function useShield(){
  const s=JSON.parse(JSON.stringify(main.s));
  if(!s.pend||s.pend.to!==pid||s.order[s.turn]!==pid)return;
  const k=s.hands[pid].findIndex(c=>c[0]==='X');if(k<0)return;
  s.hands[pid].splice(k,1);s.last=players[pid].name+': 🛡 방어카드로 +'+s.pend.n+' 공격을 막았어요';s.pend=null;await save(s);
}
setInterval(()=>{
  if(!main||main.status!=='playing'||main.game!=='quiz'||!main.s||main.s.i>=main.s.qs.length)return;
  const s=main.s,el=Date.now()-phStart,T=(s.T||15)*1000;
  if(s.phase==='ask'){
    const left=Math.max(0,T-el),b=$('#tmbar'),t=$('#tmtxt');
    if(b)b.style.width=(left/T*100)+'%';
    if(t)t.textContent='남은 시간 '+Math.ceil(left/1000)+'초';
    if(left<=0&&main.host===pid&&!adv){adv=true;qnext()}
  }else if(s.phase==='reveal'&&el>=3000&&main.host===pid&&!adv){adv=true;qnext()}
},250);
setInterval(botTick,400);
let finBusy=false;
setInterval(async()=>{
  if(!main||main.status!=='playing'||main.game!=='uno'||!main.s)return;
  if(main.s.rev){const lf=main.s.rev.until-Date.now(),e2=$('#revcd');if(e2)e2.textContent=Math.max(0,Math.ceil(lf/1000));
    if(!finBusy&&lf<=0&&(main.host===pid||lf<-4000)){finBusy=true;try{const s=JSON.parse(JSON.stringify(main.s));if(s.rev){const id=s.rev.id;s.revNo=s.revNo||{};s.revNo[id]=true;s.rev=null;await save(s)}}catch(e){}finBusy=false}
    return}
  if(!main.s.fin)return;
  const left=main.s.fin.until-Date.now(),e=$('#fincd');if(e)e.textContent=Math.max(0,Math.ceil(left/1000));
  if(finBusy||left>0||(main.host!==pid&&left>-4000))return;
  finBusy=true;
  try{const s=JSON.parse(JSON.stringify(main.s));if(s.fin&&s.winner){s.fin=null;s.finOk=true;s.last=(players[s.winner]?players[s.winner].name:'')+': 🔚 진짜 끝! 🎉 ?카드가 나오지 않아 승리가 확정됐어요';await save(s)}}catch(e){}
  finBusy=false;
},400);
init();
