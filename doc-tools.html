<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>각종문서변환</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; }
:root{
  --ink:#1b1f3b; --sub:#565d78; --muted:#8c92aa; --line:#e4e6f0; --bg:#f6f6fb;
  --brand:#4f46e5; --brand-dark:#3730a3; --brand-soft:#eef0ff; --accent:#f0743a;
  --ok:#16a34a; --err:#dc2626;
  --c-org:#e8603c; --c-opt:#7cb342; --c-to:#f2a900; --c-from:#3d7be0; --c-edit:#a0598e;
  --font:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
html,body{ min-height:100%; }
body{ font-family:var(--font); color:var(--ink); background:linear-gradient(135deg,#f1f0ff 0%,#f7f5ff 50%,#eef4ff 100%); padding:24px 18px 48px; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
.hidden{ display:none !important; }
.wrap{ max-width:1180px; margin:0 auto; }

/* ---------- 머리 ---------- */
.head{ display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
.logo{ width:50px; height:50px; border-radius:15px; background:linear-gradient(135deg,#f0743a,#4f46e5); display:grid; place-items:center; color:#fff; box-shadow:0 10px 24px rgba(79,70,229,.25); flex:none; }
.logo svg{ width:28px; height:28px; }
.head h1{ font-size:25px; font-weight:800; letter-spacing:-.5px; }
.head p{ font-size:13.5px; color:var(--sub); margin-top:3px; }
.safe{ display:flex; gap:9px; align-items:flex-start; background:#ecfdf5; border:1px solid #bbf7d0; color:#166534; border-radius:13px; padding:10px 14px; font-size:13px; line-height:1.55; margin-bottom:16px; }

/* ---------- 허브(도구 목록) ---------- */
.hub{ background:#fff; border-radius:22px; box-shadow:0 10px 30px rgba(79,70,229,.08); padding:26px 28px; display:grid; grid-template-columns:repeat(5,1fr); gap:22px 18px; }
.hub-col h2{ font-size:14px; color:var(--sub); font-weight:700; margin-bottom:12px; }
.hub-item{ display:flex; align-items:center; gap:11px; width:100%; border:0; background:none; text-align:left; padding:7px 8px; border-radius:10px; font-size:14px; font-weight:600; color:var(--ink); transition:background .12s; }
.hub-item:hover{ background:#f3f2fb; color:var(--brand); }
.hub-item .tile{ width:26px; height:26px; border-radius:6px; display:grid; place-items:center; color:#fff; flex:none; }
.hub-item .tile svg{ width:16px; height:16px; }
.hub-item small{ display:block; font-size:11.5px; font-weight:400; color:var(--muted); margin-top:1px; }
.hub-item:hover small{ color:#7d82c4; }
.hub-search{ grid-column:1/-1; display:flex; gap:10px; align-items:center; }
.hub-search input{ flex:1; max-width:360px; padding:9px 13px; border:1.5px solid var(--line); border-radius:11px; background:#fafaff; }
.hub-search span{ font-size:12.5px; color:var(--muted); }

/* ---------- 도구 화면 ---------- */
.tool{ background:#fff; border-radius:22px; box-shadow:0 10px 30px rgba(79,70,229,.08); overflow:hidden; }
.tool-head{ display:flex; align-items:center; gap:12px; padding:16px 22px; border-bottom:1px solid var(--line); background:#faf9ff; flex-wrap:wrap; }
.back{ border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 14px; font-size:13px; font-weight:700; }
.back:hover{ background:var(--brand-soft); }
.tool-head .tile{ width:34px; height:34px; border-radius:9px; display:grid; place-items:center; color:#fff; flex:none; }
.tool-head .tile svg{ width:20px; height:20px; }
.tool-head h2{ font-size:20px; }
.tool-head p{ font-size:13px; color:var(--sub); flex-basis:100%; }
.tool-body{ padding:20px 22px 24px; }

.drop{ border:2.5px dashed #c7c3f5; border-radius:18px; background:#faf9ff; padding:34px 18px; text-align:center; cursor:pointer; transition:.2s; display:block; }
.drop:hover,.drop.over{ border-color:var(--brand); background:var(--brand-soft); }
.drop .drop-ic{ width:50px; height:50px; margin:0 auto 10px; color:var(--brand); }
.drop b{ display:block; font-size:16px; margin-bottom:5px; }
.drop span{ font-size:13px; color:var(--muted); }
.drop.small{ padding:12px 16px; display:flex; align-items:center; gap:12px; text-align:left; }
.drop.small .drop-ic{ width:28px; height:28px; margin:0; flex:none; }
.drop.small b{ font-size:14px; margin:0; }

.row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin:14px 0; }
.opts{ display:flex; flex-wrap:wrap; gap:14px 22px; align-items:flex-end; background:#f7f7fc; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:14px 0; }
.field{ display:flex; flex-direction:column; gap:5px; font-size:13px; }
.field .fl{ font-weight:700; color:var(--sub); font-size:12.5px; }
.field small{ color:var(--muted); font-size:11.5px; }
.field input[type=text],.field input[type=number],.field select,.field textarea,.field input[type=url]{ padding:8px 10px; border:1.5px solid #d4d7e6; border-radius:10px; background:#fff; min-width:0; }
.field input[type=number]{ width:90px; }
.field input[type=range]{ width:160px; accent-color:var(--brand); }
.field input[type=color]{ width:46px; height:34px; border:1px solid #d4d7e6; border-radius:8px; background:#fff; padding:2px; }
.check{ display:inline-flex; align-items:center; gap:7px; font-size:13.5px; cursor:pointer; }
.check input{ width:17px; height:17px; accent-color:var(--brand); }
.seg{ display:inline-flex; background:#eceef6; border-radius:11px; padding:3px; gap:3px; flex-wrap:wrap; }
.seg button{ border:0; background:transparent; padding:7px 12px; border-radius:8px; font-size:13px; font-weight:700; color:var(--sub); }
.seg button.on{ background:#fff; color:var(--brand); box-shadow:0 1px 4px rgba(0,0,0,.08); }
.btn{ display:inline-flex; align-items:center; gap:7px; padding:10px 16px; border-radius:12px; border:1.5px solid #3b3f5c; background:#fff; font-size:14px; font-weight:700; white-space:nowrap; }
.btn:hover{ background:#f6f5ff; }
.btn svg{ width:17px; height:17px; }
.btn.pri{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.pri:hover{ filter:brightness(.95); }
.btn.big{ padding:13px 26px; font-size:16px; border-radius:14px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.mini{ padding:6px 11px; border-radius:9px; border:1px solid #cfd2e3; background:#fff; font-size:12.5px; font-weight:600; }
.mini:hover{ background:#f3f3fb; }
.status{ font-size:13.5px; color:var(--sub); min-height:20px; margin-top:10px; line-height:1.6; }
.status.ok{ color:var(--ok); } .status.err{ color:var(--err); }
.prog{ height:8px; background:#eceef6; border-radius:99px; overflow:hidden; margin-top:10px; }
.prog i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--brand),var(--accent)); transition:width .2s; }
.spin{ display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:sp .8s linear infinite; vertical-align:-2px; }
@keyframes sp{ to{ transform:rotate(360deg); } }
.note{ font-size:12.5px; color:var(--sub); background:#fff8e6; border:1px solid #f6e2a8; border-radius:11px; padding:9px 12px; line-height:1.6; margin:12px 0; }
.note b{ color:#9a5b00; }
.result{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
.ritem{ display:flex; align-items:center; gap:10px; padding:10px 12px; background:#f3fbf6; border:1px solid #cdeedb; border-radius:12px; font-size:13.5px; }
.ritem b{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.textout{ width:100%; min-height:180px; border:1.5px solid #d4d7e6; border-radius:12px; padding:10px; font-size:13px; line-height:1.6; }

/* 파일 목록 */
.flist{ display:flex; flex-direction:column; gap:6px; margin-top:12px; }
.fitem{ display:flex; align-items:center; gap:9px; padding:8px 10px; border:1px solid var(--line); border-radius:11px; background:#fff; font-size:13.5px; }
.fitem .fdot{ width:10px; height:10px; border-radius:50%; flex:none; }
.fitem .fname{ flex:1; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fitem .fmeta{ color:var(--muted); font-size:12.5px; white-space:nowrap; }
.fitem button{ border:1px solid #d9dbe8; background:#fff; border-radius:7px; width:28px; height:28px; font-size:12px; color:var(--sub); }
.fitem button:hover:not(:disabled){ background:#f3f3fb; }
.fitem button:disabled{ opacity:.3; }
.fitem .rm:hover{ color:#fff; background:var(--err); border-color:var(--err); }
.fitem img,.fitem canvas{ width:44px; height:44px; object-fit:cover; border-radius:6px; flex:none; background:#eee; }

/* 페이지 격자 */
.pgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; padding:16px; background:#f8f8fc; border:1px solid var(--line); border-radius:16px; margin-top:12px; }
.pgrid-empty{ grid-column:1/-1; text-align:center; color:var(--muted); font-size:13.5px; padding:24px; }
.pcard{ position:relative; background:#eef0f5; border-radius:12px; border:2px solid transparent; padding:38px 10px 34px; cursor:pointer; user-select:none; }
.pcard:hover{ box-shadow:0 6px 18px rgba(30,30,80,.1); }
.pcard.sel{ border-color:var(--accent); background:#fff4ec; }
.pcard.del{ opacity:.35; }
.pcard.dragging{ opacity:.4; }
.pcard.dropto{ border-color:var(--brand); border-style:dashed; }
.pthumb{ position:relative; width:100%; aspect-ratio:1/1; }
.pthumb canvas{ position:absolute; left:50%; top:50%; background:#fff; box-shadow:0 2px 7px rgba(0,0,0,.15); transition:transform .25s; }
.ploading{ position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:12px; }
.pchk{ position:absolute; left:7px; top:7px; width:21px; height:21px; border-radius:6px; border:2px solid #b8bccd; background:#fff; display:grid; place-items:center; z-index:2; }
.pcard.sel .pchk{ background:var(--accent); border-color:var(--accent); }
.pcard.sel .pchk::after{ content:""; width:9px; height:5px; border-left:2.5px solid #fff; border-bottom:2.5px solid #fff; transform:rotate(-45deg) translate(1px,-1px); }
.ptools{ position:absolute; right:24px; top:6px; display:flex; gap:4px; z-index:2; }
.ptools button{ width:26px; height:26px; border-radius:50%; border:0; background:#3b3f4f; color:#fff; font-size:11px; display:grid; place-items:center; }
.ptools button.acc{ background:var(--accent); }
.ptools button svg{ width:14px; height:14px; }
.px{ position:absolute; right:-8px; top:-8px; width:24px; height:24px; border-radius:50%; border:1px solid #cfd2e3; background:#fff; color:#555; font-size:13px; display:grid; place-items:center; z-index:3; box-shadow:0 2px 6px rgba(0,0,0,.12); }
.px:hover{ background:var(--err); color:#fff; }
.pcard.del .px{ background:var(--ok); color:#fff; }
.pdot{ position:absolute; left:9px; bottom:12px; width:8px; height:8px; border-radius:50%; }
.pnum{ position:absolute; left:50%; bottom:7px; transform:translateX(-50%); background:#3b3f4f; color:#fff; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:6px; }
.pdeg{ position:absolute; right:8px; bottom:9px; font-size:11px; font-weight:700; color:var(--accent); }

/* 큰 편집 화면 */
.stage{ position:relative; background:#e9eaf2; border-radius:16px; padding:16px; overflow:auto; display:flex; justify-content:center; min-height:300px; }
.stage-inner{ position:relative; box-shadow:0 6px 24px rgba(0,0,0,.18); background:#fff; line-height:0; }
.stage-inner canvas{ display:block; }
.pager{ display:flex; align-items:center; gap:8px; justify-content:center; margin:10px 0; font-size:13.5px; }
.toolbar{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:10px; background:#f7f7fc; border:1px solid var(--line); border-radius:14px; margin-bottom:10px; }
.toolbar .tb{ border:1px solid #d6d9e8; background:#fff; border-radius:10px; padding:7px 11px; font-size:13px; font-weight:700; display:inline-flex; align-items:center; gap:5px; }
.toolbar .tb.on{ background:var(--brand); color:#fff; border-color:var(--brand); }
.toolbar .sep{ width:1px; height:26px; background:#d6d9e8; margin:0 4px; }
.cam{ position:relative; background:#111; border-radius:16px; overflow:hidden; max-width:720px; margin:10px auto; }
.cam video{ width:100%; display:block; }
.cam .shoot{ position:absolute; left:50%; bottom:14px; transform:translateX(-50%); width:70px; height:70px; border-radius:50%; border:5px solid #fff; background:rgba(255,255,255,.35); }
.cam .shoot:active{ background:#fff; }

#dt-toast{ position:fixed; left:50%; bottom:24px; transform:translate(-50%,40px); opacity:0; background:#1b1f3b; color:#fff; padding:11px 18px; border-radius:12px; font-size:13.5px; transition:.25s; z-index:99; pointer-events:none; max-width:90vw; }
#dt-toast.show{ transform:translate(-50%,0); opacity:1; }
#dt-toast.err{ background:#b91c1c; }

@media (max-width:980px){ .hub{ grid-template-columns:repeat(3,1fr); } }
@media (max-width:640px){
  body{ padding:14px 10px 40px; }
  .hub{ grid-template-columns:1fr 1fr; padding:18px 14px; gap:16px 8px; }
  .hub-item small{ display:none; }
  .tool-body{ padding:14px 12px 20px; }
  .tool-head{ padding:12px 14px; }
  .pgrid{ grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); padding:10px; gap:10px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h3l-1.5-1.5M16 17h-3l1.5 1.5"/></svg></div>
    <div><h1>각종문서변환</h1><p>PDF 합치기·나누기·압축·OCR, 워드·엑셀·파워포인트·그림 ↔ PDF 변환, 페이지 번호·워터마크·편집까지</p></div>
  </header>
  <div class="safe"><span>🔒 모든 파일은 서버로 올라가지 않고 <b>이 컴퓨터의 브라우저 안에서만</b> 처리돼요. 학생 개인정보가 담긴 문서도 안심하고 쓸 수 있어요.</span></div>

  <section class="hub" id="hub"></section>
  <section class="tool hidden" id="tool">
    <div class="tool-head"><button class="back" id="back" type="button">← 전체 도구</button><span class="tile" id="t-tile"></span><h2 id="t-name"></h2><p id="t-desc"></p></div>
    <div class="tool-body" id="t-body"></div>
  </section>
</div>

<script src="doc-tools/core.js"></script>
<script src="doc-tools/organize.js"></script>
<script src="doc-tools/optimize.js"></script>
<script src="doc-tools/to-pdf.js"></script>
<script src="doc-tools/from-pdf.js"></script>
<script src="doc-tools/edit.js"></script>
<script>
"use strict";
const GROUPS = [
  { id: "org", name: "PDF 구성", color: "var(--c-org)" },
  { id: "opt", name: "PDF 최적화", color: "var(--c-opt)" },
  { id: "to", name: "PDF로 변환", color: "var(--c-to)" },
  { id: "from", name: "PDF에서 변환", color: "var(--c-from)" },
  { id: "edit", name: "PDF 편집", color: "var(--c-edit)" },
];
/* 사이트에 따로 있는 도구 */
DT.register({ id: "hwp2pdf", group: "to", order: 6, name: "HWP → PDF 변환", desc: "한글 문서를 PDF로", tile: "#2a8de0", icon: "H", link: "hwp-to-pdf.html" });
DT.register({ id: "rotate", group: "edit", order: 1, name: "PDF 회전", desc: "누운 페이지 바로 세우기", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>', link: "pdf-rotate.html" });

const hub = document.getElementById("hub"), toolEl = document.getElementById("tool"), body = document.getElementById("t-body");
function tileHtml(t){
  const g = GROUPS.find(x => x.id === t.group);
  const icon = /^</.test(t.icon) ? t.icon : `<b style="font-size:12px">${t.icon}</b>`;
  return `<span class="tile" style="background:${t.tile || g.color}">${icon}</span>`;
}
function renderHub(filter = ""){
  hub.innerHTML = `<div class="hub-search"><input id="q" type="search" placeholder="🔍 도구 찾기 (예: 합치기, 엑셀, 워터마크)" value="${DT.esc(filter)}"><span>${DT.tools.length}가지 도구</span></div>`;
  for (const g of GROUPS){
    const list = DT.tools.filter(t => t.group === g.id && (!filter || (t.name + t.desc).includes(filter))).sort((a, b) => (a.order || 9) - (b.order || 9));
    if (!list.length) continue;
    const col = DT.h("div", { class: "hub-col" }, DT.h("h2", {}, g.name));
    for (const t of list){
      col.append(DT.h("button", { class: "hub-item", type: "button", onclick: () => open(t),
        html: `${tileHtml(t)}<span>${DT.esc(t.name)}<small>${DT.esc(t.desc)}</small></span>` }));
    }
    hub.append(col);
  }
  const q = document.getElementById("q");
  q.oninput = () => { const v = q.value.trim(); renderHub(v); const nq = document.getElementById("q"); nq.focus(); nq.setSelectionRange(v.length, v.length); };
}
function open(t){
  if (t.link){ location.href = t.link; return; }
  location.hash = t.id;
}
window.__dtCleanup = [];
function route(){
  window.__dtCleanup.forEach(f => { try{ f(); }catch (e){} }); window.__dtCleanup = [];
  const id = location.hash.slice(1);
  const t = DT.tools.find(x => x.id === id && !x.link);
  body.innerHTML = "";
  if (!t){ toolEl.classList.add("hidden"); hub.classList.remove("hidden"); renderHub(); return; }
  hub.classList.add("hidden"); toolEl.classList.remove("hidden");
  document.getElementById("t-tile").outerHTML = tileHtml(t).replace('class="tile"', 'class="tile" id="t-tile"');
  document.getElementById("t-name").textContent = t.name;
  document.getElementById("t-desc").innerHTML = t.long || DT.esc(t.desc);
  document.title = t.name + " · 각종문서변환";
  window.scrollTo(0, 0);
  try{ t.mount(body); }catch (e){ console.error(e); body.textContent = "이 도구를 여는 중 문제가 생겼어요: " + e.message; }
}
document.getElementById("back").onclick = () => { location.hash = ""; };
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
