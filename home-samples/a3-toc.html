<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시안 A-3 · 책등 + 목차 메뉴</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#fbf7ee; --grid:rgba(96,140,190,.13); --ink:#2a2f3a; --sub:#5e6573;
  --pen:#1f4fa8; --red:#d6453d; --cover:#24324a;
  --hand:"Gaegu","Pretendard Variable",cursive; --kr:"Pretendard Variable",sans-serif;
}

body{display:flex;min-height:100vh;font-family:var(--kr);color:var(--ink);background:linear-gradient(90deg,var(--cover) 84px,#e9e2d2 84px)}
.spine{width:84px;flex-shrink:0;background:var(--cover);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px 20px 0;gap:12px}
.spine::after{content:"";position:absolute;right:0;top:0;bottom:0;width:12px;background:repeating-linear-gradient(#1a2538 0 18px,#0f1726 18px 22px)}
.spine button{font-family:var(--hand);border:none;cursor:pointer}
.toc-btn{width:58px;height:62px;border-radius:10px;background:#fbf7ee;color:var(--ink);font-size:18px;font-weight:700;line-height:1;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.toc-btn b{display:block;font-size:24px;margin-bottom:2px}
.dot{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;font-size:19px;font-weight:700;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.dot:hover,.toc-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.dot.gb{background:#fbf7ee;color:var(--ink)}
.spine .name{margin-top:auto;writing-mode:vertical-rl;font-family:var(--hand);font-size:22px;color:#f4d27a;letter-spacing:4px}
.toc{position:fixed;inset:0;background:rgba(20,25,35,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:30px}
.toc.open{display:flex}
.toc-page{width:min(980px,100%);max-height:90vh;overflow:auto;position:relative;padding:34px 46px 36px 84px;border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.35);
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,var(--paper)}
.toc-page::before{content:"";position:absolute;left:62px;top:0;bottom:0;width:2px;background:rgba(214,69,61,.45)}
.toc-page .clip{position:absolute;top:-14px;right:80px;width:22px;height:70px;border:4px solid #9aa3b2;border-radius:12px}
.toc-page h2{font-family:var(--hand);font-size:42px;letter-spacing:14px;border-bottom:4px double var(--ink);display:inline-block;margin-bottom:22px}
.toc-page .x{position:absolute;top:18px;right:20px;font-size:14px;border:1px solid #d9d2c2;background:#fff;border-radius:16px;padding:5px 12px;cursor:pointer;color:var(--sub)}
.toc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 48px}
.toc h5{font-family:var(--hand);font-size:25px;color:var(--c);margin:8px 0 2px}
.toc li{list-style:none;display:flex;align-items:baseline;gap:6px;padding:5px 0;font-size:14.5px;cursor:pointer}
.toc li .dots{flex:1;border-bottom:2px dotted #cfc8b8;transform:translateY(-4px)}
.toc li .p{font-family:var(--hand);font-size:17px;color:var(--pen)}
.toc li.off{color:#a7a297;cursor:default}.toc li.off .p{color:#c0b9aa}
.toc li:not(.off):hover .t{color:var(--pen);text-decoration:underline}

/* 오른쪽: 모눈 노트 페이지 */
.page{flex:1;min-width:0;background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px, var(--paper);
  position:relative;padding:38px 56px 48px 96px}
.page::before{content:"";position:absolute;left:70px;top:0;bottom:0;width:2px;background:rgba(214,69,61,.45)}
.date{font-family:var(--hand);font-size:20px;color:var(--sub)}

.hero{display:flex;gap:36px;align-items:flex-start;margin-top:10px}
.hero-main{flex:1;min-width:0}
.hero h1{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1.25;margin:10px 0 14px}
.hero h1 .mark{background:linear-gradient(transparent 58%,#ffe27a 58%);padding:0 4px}
.hero h1 .hand{font-family:var(--hand);color:var(--pen);font-weight:700;font-size:48px}
.hero p{color:var(--sub);line-height:1.8;font-size:15.5px}
.steps{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;font-family:var(--hand);font-size:21px}
.steps span{border:2px solid var(--ink);border-radius:30px 26px 32px 24px;padding:4px 14px;background:#fff}
.steps i{font-style:normal;color:var(--red);align-self:center}

.sticky{width:250px;flex-shrink:0;background:#fff59a;padding:22px 20px 18px;transform:rotate(2.5deg);
  box-shadow:0 12px 20px -10px rgba(0,0,0,.35);font-family:var(--hand);font-size:21px;line-height:1.35;position:relative}
.sticky::before{content:"";position:absolute;top:-12px;left:70px;width:100px;height:26px;background:rgba(150,200,230,.6);transform:rotate(-4deg)}
.sticky b{display:block;font-size:25px;color:var(--red);margin-bottom:6px}

/* 학년 인덱스 탭 */
.tabs{display:flex;gap:6px;margin:44px 0 0 0}
.tab{font-family:var(--hand);font-size:24px;font-weight:700;padding:6px 22px 4px;border-radius:12px 12px 0 0;cursor:pointer;
  border:2px solid var(--ink);border-bottom:none;background:#efe8d8;color:var(--sub);position:relative;top:2px}
.tab.on{background:#fff;color:var(--ink);z-index:2}
.board{background:#fff;border:2px solid var(--ink);border-radius:0 14px 14px 14px;padding:26px 24px 30px;position:relative}
.board-title{font-family:var(--hand);font-size:24px;color:var(--pen);margin-bottom:18px}

.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:26px 20px}
.note{position:relative;background:#fffdf7;border:1.5px solid #d9d2c2;border-radius:4px;padding:26px 16px 14px;
  box-shadow:2px 3px 0 rgba(0,0,0,.06);transition:.2s;cursor:pointer}
.note:nth-child(3n+1){transform:rotate(-1deg)} .note:nth-child(3n+2){transform:rotate(.8deg)}
.note:hover{transform:rotate(0) translateY(-4px);box-shadow:4px 10px 18px rgba(0,0,0,.12)}
.note .tape{position:absolute;top:-11px;left:50%;width:84px;height:22px;margin-left:-42px;opacity:.75;transform:rotate(-3deg)}
.note .no{font-family:var(--hand);font-size:19px;color:var(--sub)}
.note .area{float:right;font-size:11.5px;font-weight:700}
.note h3{font-size:17px;font-weight:800;margin:4px 0 6px;letter-spacing:-.3px}
.note p{font-size:13px;color:var(--sub);line-height:1.6;min-height:42px;padding-right:4px}
.note.soon p{padding-right:52px}
.note .go{margin-top:10px;font-family:var(--hand);font-size:20px;color:var(--pen)}
.note.soon{cursor:default;opacity:.85}
.note.soon:hover{transform:none;box-shadow:2px 3px 0 rgba(0,0,0,.06)}
.stamp{position:absolute;right:12px;bottom:10px;border:2.5px solid var(--red);color:var(--red);border-radius:50%;
  width:54px;height:54px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;transform:rotate(-14deg);opacity:.7;background:rgba(255,253,247,.6)}

/* 아래 */
.bottom{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:24px;margin-top:40px}
.lined{background:#fff;border:1.5px solid #d9d2c2;padding:18px 20px;
  background-image:linear-gradient(transparent 33px,#dfe7f1 34px);background-size:100% 34px;background-position:0 46px}
.lined h3{font-family:var(--hand);font-size:25px;color:var(--red);height:40px}
.lined li{list-style:none;height:34px;line-height:34px;font-size:14px;display:flex;gap:8px;cursor:pointer;white-space:nowrap;overflow:hidden}
.lined li span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis}
.lined li:hover{color:var(--pen)}
.lined li::before{content:"✓";font-family:var(--hand);color:var(--pen);font-size:20px}
.lined .tag{font-family:var(--hand);font-size:17px;color:var(--sub)}
</style>
</head>
<body>

<nav class="spine">
  <button class="toc-btn" id="tocBtn" type="button"><b>☰</b>목차</button>
  <button class="dot" style="--c:#2f9e48" data-g="1" title="중학교 1학년">1</button>
  <button class="dot" style="--c:#3b7cf0" data-g="2" title="중학교 2학년">2</button>
  <button class="dot" style="--c:#ef8a2a" data-g="3" title="중학교 3학년">3</button>
  <button class="dot" style="--c:#8a5cf0" title="쉬어가는 게임">🎮</button>
  <button class="dot gb" title="방명록">✎</button>
  <div class="name">과학 탐구 노트</div>
</nav>
<main class="page">
  <div class="date" id="today"></div>
  <section class="hero">
    <div class="hero-main">
      <h1>오늘의 <span class="mark">탐구 질문</span>은<br><span class="hand">무엇인가요?</span></h1>
      <p>아화중학교 과학 탐구 노트에 오신 것을 환영해요.<br>학년 탭을 넘겨 이번 시간에 배울 단원을 펼쳐 보세요.</p>
      <div class="steps"><span>관찰</span><i>→</i><span>질문</span><i>→</i><span>실험</span><i>→</i><span>결론</span></div>
    </div>
    <div class="sticky"><b>과학실 약속 ✎</b>1. 보안경은 먼저!<br>2. 결과는 바로 기록<br>3. 틀려도 괜찮아,<br>&nbsp;&nbsp;&nbsp;다시 실험하면 돼</div>
  </section>

  <div class="tabs" id="tabs"></div>
  <section class="board">
    <div class="board-title" id="boardTitle"></div>
    <div class="notes" id="notes"></div>
  </section>

  <section class="bottom">
    <div class="lined"><h3>최근 실험 기록</h3><ul id="recent"></ul></div>
    <div class="lined"><h3>추천 가상실험</h3><ul id="sims"></ul></div>
    <div class="lined"><h3>쉬어가는 게임</h3><ul id="games"></ul></div>
  </section>
</main>
<div class="toc" id="toc"><div class="toc-page"><div class="clip"></div><button class="x" type="button" id="tocX">닫기 ✕</button>
  <h2>목차</h2><div class="toc-grid" id="tocGrid"></div></div></div>

<script>
// 시안 공통 데이터 (실제 사이트 index.html 의 단원/자료 수를 옮겨 놓은 것)
const AREA = { 물리:"#3b7cf0", 화학:"#ef6f2a", 생명:"#2f9e48", 지구:"#8a5cf0", 통합:"#d99a00" };
const UNITS = {
  1: [
    { sym:"인", name:"과학과 인류의 지속가능한 삶", area:"통합", n:0, desc:"과학이 인류 문명과 함께 발전해 온 과정과 지속가능한 미래" },
    { sym:"생", name:"생물의 구성과 다양성", area:"생명", n:0, desc:"세포에서 개체까지, 생물 다양성과 분류·보전" },
    { sym:"열", name:"열", area:"물리", n:0, desc:"온도와 입자 운동, 열의 이동, 비열과 열팽창" },
    { sym:"상", name:"물질의 상태 변화", area:"화학", n:4, desc:"입자 운동으로 보는 상태 변화와 열에너지 출입" },
    { sym:"힘", name:"힘의 작용", area:"물리", n:7, desc:"중력·탄성력·마찰력·부력을 측정하고 탐구" },
    { sym:"기", name:"기체의 성질", area:"화학", n:1, desc:"기체의 압력·부피·온도 관계를 입자 모형으로" },
    { sym:"태", name:"태양계", area:"지구", n:0, desc:"지구와 달의 운동, 태양계 행성과 태양 활동" }
  ],
  2: [
    { sym:"특", name:"물질의 특성", area:"화학", n:1, desc:"밀도·용해도·끓는점으로 물질 구별하기" },
    { sym:"지", name:"지권의 변화", area:"지구", n:0, desc:"지구 내부 구조, 암석, 판의 운동과 지진·화산" },
    { sym:"빛", name:"빛과 파동", area:"물리", n:0, desc:"빛의 반사·굴절, 렌즈와 상, 파동과 소리" },
    { sym:"원", name:"물질의 구성", area:"화학", n:1, desc:"원소·원자·분자·이온을 기호와 모형으로" },
    { sym:"식", name:"식물과 에너지", area:"생명", n:5, desc:"광합성과 증산 작용, 양분의 저장과 이용" },
    { sym:"동", name:"동물과 에너지", area:"생명", n:6, desc:"소화·순환·호흡·배설이 함께 만드는 에너지" },
    { sym:"전", name:"전기와 자기", area:"물리", n:0, desc:"전류·전압·저항, 전류가 만드는 자기장" },
    { sym:"별", name:"별과 우주", area:"지구", n:0, desc:"별의 거리와 밝기, 우리은하와 우주" }
  ],
  3: [
    { sym:"반", name:"화학 반응", area:"화학", n:0, desc:"화학 반응식, 질량 보존과 일정 성분비 법칙" },
    { sym:"날", name:"기권과 날씨", area:"지구", n:0, desc:"구름과 강수, 기압과 바람, 기단과 전선" },
    { sym:"운", name:"운동과 에너지", area:"물리", n:0, desc:"등속·자유 낙하 운동, 일과 에너지" },
    { sym:"감", name:"자극과 반응", area:"생명", n:1, desc:"감각 기관과 신경계, 호르몬의 작용" },
    { sym:"유", name:"생식과 유전", area:"생명", n:4, desc:"세포 분열과 생식, 멘델의 유전 법칙" },
    { sym:"에", name:"에너지 전환과 보존", area:"물리", n:2, desc:"역학적 에너지의 전환과 보존" },
    { sym:"우", name:"우주 탐사", area:"지구", n:1, desc:"성단과 성운, 우주 탐사의 역사와 성과" }
  ]
};
const RECENT = [
  ["중2", "혈액 순환 미로 — 적혈구의 여행"],
  ["게임", "볼링 게임"],
  ["중3", "성단과 성운 — 세 가지 성운의 차이"],
  ["중1", "샤를의 법칙 — 아두이노 실험"],
  ["중3", "롤러코스터 크리에이터"]
];
const SIMS = ["힘의 3요소 — 알까기 게임", "가상 공간에서의 힘과 운동", "놀이기구에서 힘의 작용", "뇌의 구조", "롤러코스터 크리에이터"];
const GAMES = [["볼링 게임","게임"],["초음파 드론 동굴 비행","아두이노"],["비행기 슈팅 게임","아두이노"],["기울기 미로 게임","아두이노"]];

const d=new Date();
document.getElementById('today').textContent=`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}. 날씨: 맑음 ☀`;
const tabs=document.getElementById('tabs');
function show(g){
  tabs.innerHTML='';
  [1,2,3].forEach(k=>{const t=document.createElement('div');t.className='tab'+(k===g?' on':'');t.textContent=`중${k}`;t.onclick=()=>show(k);tabs.appendChild(t);});
  document.getElementById('boardTitle').textContent=`중학교 ${g}학년 — 단원 펼쳐보기`;
  const box=document.getElementById('notes');box.innerHTML='';
  UNITS[g].forEach((u,i)=>{
    const el=document.createElement('div');el.className='note'+(u.n?'':' soon');
    el.innerHTML=`<div class="tape" style="background:${AREA[u.area]}"></div><span class="area" style="color:${AREA[u.area]}">${u.area}</span>
      <div class="no">${i+1}단원</div><h3>${u.name}</h3><p>${u.desc}</p>
      ${u.n?`<div class="go">실험하러 가기 ✎ (${u.n})</div>`:`<div class="go" style="color:#aaa">곧 공개</div><div class="stamp">준비중</div>`}`;
    box.appendChild(el);
  });
}
show(1);

const MENU = [
  { g:1, label:"중학교 1학년", short:"중1", color:"#2f9e48", items: UNITS[1].map((u,i)=>({t:`${i+1}. ${u.name}`, n:u.n})).concat([{t:"★ 1학년 학생 홈페이지", n:3}]) },
  { g:2, label:"중학교 2학년", short:"중2", color:"#3b7cf0", items: UNITS[2].map((u,i)=>({t:`${i+1}. ${u.name}`, n:u.n})).concat([{t:"★ 2학년 학생 홈페이지", n:7}]) },
  { g:3, label:"중학교 3학년", short:"중3", color:"#ef8a2a", items: UNITS[3].map((u,i)=>({t:`${i+1}. ${u.name}`, n:u.n})) },
  { g:0, label:"개발자료", short:"개발", color:"#8a5cf0", items: [{t:"🎮 쉬어가는 게임", n:6},{t:"🧪 추천 가상실험 모음", n:5}] }
];
const menuList = m => m.items.map(it=>`<li class="${it.n?'':'off'}"><span class="t">${it.t}</span><span class="dots"></span><span class="p">${it.n?('자료 '+it.n):'준비 중'}</span></li>`).join('');

const grid=document.getElementById('tocGrid');
const col=[[MENU[0],MENU[3]],[MENU[1],MENU[2]]];
col.forEach(c=>{const d=document.createElement('div'); c.forEach(m=>{d.insertAdjacentHTML('beforeend',`<h5 style="--c:${m.color}">${m.label}</h5><ul>${menuList(m)}</ul>`);}); grid.appendChild(d);});
grid.firstChild.insertAdjacentHTML('beforeend','<h5 style="--c:#d6453d">방명록</h5><ul><li><span class="t">📖 한마디 남기기</span><span class="dots"></span><span class="p">바로가기</span></li></ul>');
const toc=document.getElementById('toc');
document.getElementById('tocBtn').onclick=()=>toc.classList.add('open');
document.getElementById('tocX').onclick=()=>toc.classList.remove('open');
toc.onclick=e=>{if(e.target===toc) toc.classList.remove('open');};
document.querySelectorAll('.dot[data-g]').forEach(b=>b.onclick=()=>{show(+b.dataset.g);document.getElementById('tabs').scrollIntoView({behavior:'smooth'});});

const fill=(id,rows)=>{document.getElementById(id).innerHTML=rows.map(([t,g])=>`<li><span>${t}</span><span class="tag">${g}</span></li>`).join('');};
fill('recent',RECENT.map(([g,t])=>[t,g]));
fill('sims',SIMS.slice(0,5).map(t=>[t,'']));
fill('games',GAMES);
</script>
</body>
</html>
